# go.tany.im — short links for Post Studio, with a count of who came from where.
# Deploy: cd golinks && npx wrangler deploy
# Tables: npx wrangler d1 execute tatsuki-go --remote --file schema.sql
# The key Desk uses is the DESK_KEY secret (npx wrangler secret put DESK_KEY) and the macOS keychain item
# tatsuki-desk-go. It is never in this repo.
name = "tatsuki-go"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [{ pattern = "go.tany.im", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "tatsuki-go"
database_id = "5dc5958c-9692-44f3-bed0-311ff4f9cf17"

# every 5 minutes: send the approved posts whose time has come. once a day: renew tokens with less than 10 days left
[triggers]
crons = ["*/5 * * * *", "17 3 * * *"]

# Meta app "Tatsuki Post Studio" (ids are public; the secrets are META_APP_SECRET and THREADS_APP_SECRET)
[vars]
META_APP_ID = "1709651817192222"
META_CONFIG_ID = "1123461540280904"
THREADS_APP_ID = "1498510273338181"

# pictures waiting for Instagram and Threads to fetch them (two days, random names)
[[kv_namespaces]]
binding = "MEDIA"
id = "ea41cf63df7040d3827b12a4c256aaed"
