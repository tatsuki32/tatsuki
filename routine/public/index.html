<style>
/* Routine: a Routinery-style morning and evening routine app. One file, no libraries.
   Served two ways: by the Mac Desk at http://localhost:4747/routine/ (reads and writes the Desk's data directly),
   and on Cloudflare Pages (keeps a copy on the phone and syncs it through /api/sync with a passphrase).
   Data shapes are the Desk's: routines {id, when, order, icon, title, how, sec, lang, deleted, updatedAt},
   routinelog day docs {id: YYYY-MM-DD, morning:{itemId:ms}, night:{...}, morningRun, nightRun, totals} and doc "settings". */
:root{
  --bg:#fff6ee; --card:#ffffff; --ink:#3a2034; --ink-2:#6d5266; --muted:#9a8494; --line:#f0dfd6; --soft:#fbeee6;

  --r:22px; color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}

a{color:inherit}
:focus-visible{outline:3px solid var(--go);outline-offset:2px;border-radius:10px}
.wrap{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.top{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:28px;line-height:1.2;flex:1}
.sub{color:var(--muted);font-size:13px}
.ibtn{border:0;background:var(--soft);border-radius:999px;min-width:44px;min-height:44px;padding:0 14px;cursor:pointer;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);text-decoration:none}
.ibtn.go{background:var(--go);color:var(--go-ink)}

.rcard{border-radius:28px;padding:20px;display:grid;gap:12px;color:#3a2034;box-shadow:0 10px 30px rgba(120,60,80,.12)}
.rcard.sunrise{background:linear-gradient(160deg,#ffe3a6 0%,#ffb78c 45%,#f590b3 100%)}
.rcard.mint{background:linear-gradient(160deg,#e3f9d8 0%,#a8e6c3 50%,#7fd1c7 100%)}
.rcard.ocean{background:linear-gradient(160deg,#dff1ff 0%,#9fd3f5 50%,#7aa7ef 100%)}
.rcard.lavender{background:linear-gradient(160deg,#f6e8ff 0%,#d9c2fb 50%,#b39ddb 100%)}
.racts .start.mint{background:#2f9e6a}.racts .start.ocean{background:#2f6fd0}.racts .start.lavender{background:#8a5cd6}
.rcard.night{background:radial-gradient(1.5px 1.5px at 15% 20%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 80% 15%,#fffb 50%,transparent 51%),radial-gradient(1px 1px at 60% 70%,#fff8 50%,transparent 51%),linear-gradient(165deg,#1d1b4f 0%,#3b2a6e 100%);color:#f3efff}
.rhead{display:flex;align-items:center;gap:12px}

.rbar{height:10px;border-radius:999px;background:rgba(255,255,255,.4);overflow:hidden}

.newr{border:2px dashed var(--line);background:transparent;border-radius:28px;min-height:72px;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink-2);display:flex;gap:8px;align-items:center;justify-content:center}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.themes button{border:2px solid transparent;border-radius:999px;min-height:40px;padding:0 14px;cursor:pointer;font-weight:700;font-size:14px}

.tsunrise{background:linear-gradient(120deg,#ffe3a6,#f590b3);color:#3a2034}.tnight{background:linear-gradient(120deg,#1d1b4f,#3b2a6e);color:#f3efff}.tmint{background:linear-gradient(120deg,#e3f9d8,#7fd1c7);color:#16352b}.tocean{background:linear-gradient(120deg,#dff1ff,#7aa7ef);color:#13294b}.tlavender{background:linear-gradient(120deg,#f6e8ff,#b39ddb);color:#2e1f4a}

  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rp[data-when="sunrise"]{--rp-bg:linear-gradient(165deg,#ffe3a6 0%,#ffb78c 36%,#f590b3 70%,#b49ddc 100%);--rp-ink:#3a2034;--rp-soft:rgba(255,255,255,.45);--rp-go:#ff6f61;--rp-go-ink:#fff;--rp-ring:#fff;--rp-track:rgba(255,255,255,.4);--rp-over:#d81b60;--rp-panel:rgba(255,248,242,.94)}
.rp[data-when="mint"]{--rp-bg:linear-gradient(165deg,#e3f9d8 0%,#a8e6c3 45%,#7fd1c7 100%);--rp-ink:#16352b;--rp-soft:rgba(255,255,255,.45);--rp-go:#2f9e6a;--rp-go-ink:#fff;--rp-ring:#fff;--rp-track:rgba(255,255,255,.4);--rp-over:#c2185b;--rp-panel:rgba(244,255,248,.94)}
.rp[data-when="ocean"]{--rp-bg:linear-gradient(165deg,#dff1ff 0%,#9fd3f5 45%,#7aa7ef 100%);--rp-ink:#13294b;--rp-soft:rgba(255,255,255,.45);--rp-go:#2f6fd0;--rp-go-ink:#fff;--rp-ring:#fff;--rp-track:rgba(255,255,255,.4);--rp-over:#c2185b;--rp-panel:rgba(244,250,255,.94)}
.rp[data-when="lavender"]{--rp-bg:linear-gradient(165deg,#f6e8ff 0%,#d9c2fb 45%,#b39ddb 100%);--rp-ink:#2e1f4a;--rp-soft:rgba(255,255,255,.45);--rp-go:#8a5cd6;--rp-go-ink:#fff;--rp-ring:#fff;--rp-track:rgba(255,255,255,.4);--rp-over:#c2185b;--rp-panel:rgba(250,245,255,.94)}
.rp[data-when="night"]{--rp-bg:radial-gradient(1.5px 1.5px at 12% 18%,#ffffffaa 50%,transparent 51%),radial-gradient(1px 1px at 78% 12%,#ffffffbb 50%,transparent 51%),radial-gradient(1.5px 1.5px at 64% 30%,#ffffff88 50%,transparent 51%),radial-gradient(1px 1px at 30% 42%,#ffffff99 50%,transparent 51%),radial-gradient(1px 1px at 90% 55%,#ffffff88 50%,transparent 51%),radial-gradient(1.5px 1.5px at 8% 72%,#ffffff77 50%,transparent 51%),linear-gradient(170deg,#0c1033 0%,#1d1b4f 55%,#3b2a6e 100%);
  --rp-ink:#f3efff;--rp-soft:rgba(255,255,255,.12);--rp-go:#a99aff;--rp-go-ink:#14102e;--rp-ring:#cfc4ff;--rp-track:rgba(255,255,255,.13);--rp-over:#ff8fab;--rp-panel:rgba(22,18,52,.95)}
.rptop{display:flex;align-items:center;gap:8px;max-width:760px;width:100%;margin:0 auto}
.rpbtn{border:0;background:var(--rp-soft);color:var(--rp-ink);border-radius:999px;min-width:44px;min-height:44px;padding:0 14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-user-select:none;user-select:none}
.rpbtn:active{transform:scale(.97)}
.rp :focus-visible{outline:3px solid var(--rp-ink)}
.rpbar{flex:1;height:8px;border-radius:999px;background:var(--rp-track);overflow:hidden}
.rpbar i{display:block;height:100%;border-radius:999px;background:var(--rp-ring);transition:width .4s ease}
.rpcount{font-size:13px;font-weight:700;white-space:nowrap}
.rpmain{display:grid;justify-items:center;align-content:center;gap:14px;text-align:center;min-height:0;overflow-y:auto;padding:4px 0}
.rpring{position:relative;width:min(70vw,320px,38vh);aspect-ratio:1}
.rpring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.rpring circle{fill:none;stroke-width:12}

.rpnext{margin:0;font-size:14px;opacity:.85;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;overflow-wrap:anywhere}
.rppace{font-size:12px;font-weight:700;background:var(--rp-soft);border-radius:999px;padding:2px 12px}

.rpctl .rpbtn{flex-direction:column;gap:0;min-height:64px;border-radius:22px;font-size:20px;padding:0 8px}
.rpctl .rpbtn span{font-size:12px}

.rpstamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}

.rpbig{min-height:64px;padding:0 40px;font-size:20px;background:var(--rp-go);color:var(--rp-go-ink);box-shadow:0 12px 30px rgba(0,0,0,.2)}
.rpscore{font-size:clamp(64px,15vh,120px);font-weight:700;line-height:1}

.rpacts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

.rplist{position:absolute;left:0;right:0;bottom:0;z-index:2;max-height:78%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--rp-panel);color:var(--rp-ink);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));gap:8px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

<body>
<div id="app" class="wrap"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const HCMC=7*3600e3, DAY=864e5;
/* Where the data lives: the Mac Desk's API when the Desk serves this page, otherwise this phone + the cloud. */
const MODE=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&location.port==="4747"?"desk":"cloud";
const S={routines:[],log:[],sync:{state:MODE==="desk"?"desk":"",at:0}};
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}

/* ---------- data ---------- */
const settings=()=>{const s={morningAt:"04:00",nightAt:"17:00",voice:"en",nag:30,alarm:true,cutoff:4,...(S.log.find(x=>x.id==="settings")||{})};if(!RPL[s.voice])s.voice="en";return s};
const dayKey=ms=>new Date(ms+HCMC-(Number(settings().cutoff)||0)*3600e3).toISOString().slice(0,10);
const today=()=>dayKey(Date.now());
const dayOff=(d,n)=>new Date(Date.parse(d+"T12:00:00Z")+n*DAY).toISOString().slice(0,10);
const items=w=>S.routines.filter(x=>x.when===w&&!x.deleted).sort((a,b)=>(+a.order||0)-(+b.order||0));
const dayDoc=d=>S.log.find(x=>x.id===d)||{id:d,morning:{},night:{},totals:{}};
/* the routines: up to 5, kept in the settings doc as lists:[{id,name,emoji,at,theme,alarm}]. The first two keep the ids
   "morning" and "night", so the records from before stay theirs. */
const MAXR=5, THEMES={sunrise:"Sunrise",night:"Night sky",mint:"Mint",ocean:"Ocean",lavender:"Lavender"};
function lists(){
  const s=S.log.find(x=>x.id==="settings")||{};
  const ls=Array.isArray(s.lists)&&s.lists.length?s.lists:[{id:"morning",name:"Morning",emoji:"🌅",at:s.morningAt||"04:00",theme:"sunrise"},{id:"night",name:"Evening",emoji:"🌙",at:s.nightAt||"17:00",theme:"night"}];
  return ls.filter(l=>l&&typeof l.id==="string"&&l.id).slice(0,MAXR).map(l=>({name:"Routine",emoji:"✨",at:"",theme:"sunrise",alarm:true,...l,theme:THEMES[l.theme]?l.theme:"sunrise"}));
}
const listOf=id=>lists().find(l=>l.id===id)||{id,name:"Routine",emoji:"✨",at:"",theme:"sunrise",alarm:false};
const hmMin=t=>/^\d\d:\d\d$/.test(t||"")?+t.slice(0,2)*60+ +t.slice(3):null;
/* by start time, starting with the one whose time came last (the one to do now) */
function sortedLists(){const now=new Date(Date.now()+HCMC),m=now.getUTCHours()*60+now.getUTCMinutes(),ls=lists().sort((a,b)=>(hmMin(a.at)??9999)-(hmMin(b.at)??9999));
  let k=-1;ls.forEach((l,i)=>{const t=hmMin(l.at);if(t!=null&&t<=m)k=i});return k<0?ls:[...ls.slice(k),...ls.slice(0,k)]}
async function saveLists(ls){const cur=S.log.find(x=>x.id==="settings")||{cutoff:4};const mo=ls.find(l=>l.id==="morning"),ni=ls.find(l=>l.id==="night");
  await saveDoc("routinelog",{...cur,id:"settings",lists:ls.slice(0,MAXR),...(mo?{morningAt:mo.at}:{}),...(ni?{nightAt:ni.at}:{})})}
const totals=()=>Object.fromEntries(lists().map(l=>[l.id,items(l.id).length]));
function persist(){if(MODE!=="cloud")return;try{localStorage.setItem("rt-state",JSON.stringify({routines:S.routines,routinelog:S.log}))}catch(e){}}
async function saveDoc(col,doc){
  doc={...doc,updatedAt:Date.now()};const k=col==="routines"?"routines":"log";
  S[k]=[...S[k].filter(x=>x.id!==doc.id),doc];persist();
  if(MODE==="desk"){const {id,...body}=doc;try{const r=await fetch("/api/"+col+"/"+encodeURIComponent(id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw 0}catch(e){toast("Couldn't save to the Desk")}}
  else syncSoon();
}
async function load(){
  if(MODE==="desk"){
    try{const [r,l]=await Promise.all([fetch("/api/routines").then(x=>x.json()),fetch("/api/routinelog").then(x=>x.json())]);S.routines=r;S.log=l}catch(e){toast("The Desk isn't answering")}
    return;
  }
  try{const v=JSON.parse(localStorage.getItem("rt-state")||"null");if(v){S.routines=v.routines||[];S.log=v.routinelog||[]}}catch(e){}
  if(!S.routines.length){try{const v=await fetch("seed.json",{cache:"no-store"}).then(x=>x.json());S.routines=v.routines||[];S.log=v.routinelog||[];persist()}catch(e){}}
}
/* sync: send everything, get back the merged state (the server merges per doc, newest wins; a day's checks are joined) */
const syncKey=()=>{try{return localStorage.getItem("rt-key")||""}catch(e){return ""}};
let syncT=0, syncing=false;
const syncSoon=()=>{clearTimeout(syncT);syncT=setTimeout(sync,1500)};
async function sync(){
  if(MODE!=="cloud"||syncing)return;const key=syncKey();
  if(!key){S.sync={state:"nokey"};paintSync();return}
  if(!navigator.onLine){S.sync={...S.sync,state:"offline"};paintSync();return}
  syncing=true;
  try{const r=await fetch("api/sync",{method:"POST",headers:{"Content-Type":"application/json","x-sync-key":key},body:JSON.stringify({routines:S.routines,routinelog:S.log})});
    if(r.status===401){S.sync={state:"badkey"};return}
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();const before=JSON.stringify([S.routines,S.log]);S.routines=j.routines||[];S.log=j.routinelog||[];persist();S.sync={state:"ok",at:Date.now()};
    if(before!==JSON.stringify([S.routines,S.log])&&!P)render();
  }catch(e){S.sync={...S.sync,state:"offline"}}
  finally{syncing=false;paintSync()}
}
function syncText(){const s=S.sync;
  if(s.state==="desk")return `<span class="dotok"></span>Saved in the Mac Desk`;
  if(s.state==="ok")return `<span class="dotok"></span>Synced ${new Date(s.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;
  if(s.state==="nokey")return `<span class="dotno"></span>Only on this phone · <a href="#settings">turn on sync</a>`;
  if(s.state==="badkey")return `<span class="dotno"></span>The sync passphrase is wrong · <a href="#settings">fix it</a>`;
  if(s.state==="offline")return `<span class="dotno"></span>Offline · saved on this phone, syncs when back online`;
  return `<span class="dotno"></span>Syncing…`;
}
function paintSync(){const el=$("#syncline");if(el)el.innerHTML=syncText()}

/* ---------- small helpers ---------- */
const RPL={en:"en-US",ja:"ja-JP",ru:"ru-RU"}, RPLN={en:"English",ja:"Japanese",ru:"Russian"};
const rpLang=it=>RPL[it.lang]?it.lang:/[\u3040-\u30ff\u4e00-\u9fff]/.test(it.title||"")?"ja":/[\u0400-\u04ff]/.test(it.title||"")?"ru":"en";
const rpSec=it=>Math.max(5,Math.round(Number(it.sec)||60));
const rpFmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+pad(s%60)};
const rpDur=s=>{s=Math.round(s);const m=Math.floor(s/60),r=s%60;return m?(r?`${m}m ${r}s`:`${m}m`):`${r}s`};
function parseDur(v){
  v=String(v||"").trim().toLowerCase().replace(/分/g,"m").replace(/秒/g,"s");if(!v)return null;
  let m=/^(\d+):(\d{1,2})$/.exec(v);if(m)return +m[1]*60+ +m[2];
  if(/^\d+(\.\d+)?$/.test(v))return Math.round(parseFloat(v)*60);
  const mm=/(\d+(?:\.\d+)?)\s*m/.exec(v),ss=/(\d+)\s*s/.exec(v);if(!mm&&!ss)return null;
  return Math.round((mm?parseFloat(mm[1])*60:0)+(ss?+ss[1]:0))||null;
}
const newId=()=>"rt"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const run=(d,w)=>dayDoc(d)[w+"Run"]||null;
/* streak: days in a row (today, or up to yesterday while today is still open) with a run of that routine */
function streak(w){
  let d=today(),n=0;if(!run(d,w))d=dayOff(d,-1);
  while(run(d,w)&&n<3650){n++;d=dayOff(d,-1)}
  return n;
}
function best(w){const days=S.log.filter(x=>/^\d{4}-\d\d-\d\d$/.test(x.id)&&x[w+"Run"]).map(x=>x.id).sort();let b=0,c=0,prev=null;
  days.forEach(d=>{c=prev&&dayOff(prev,1)===d?c+1:1;b=Math.max(b,c);prev=d});return b}

function history(){

function itemSheet(w,it,after){

async function moveItem(id,dir){
  const it=S.routines.find(x=>x.id===id);if(!it)return;const its=items(it.when),i=its.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=its.length)return;
  const o=its.map((x,k)=>({x,o:k+1}));[o[i].o,o[j].o]=[o[j].o,o[i].o];
  for(const {x,o:ord} of o)if(+x.order!==ord)await saveDoc("routines",{...x,order:ord});

/* ---------- the player ---------- */
/* One item at a time: a chime, the item read aloud, a ring that counts down. Nothing moves on by itself: past zero the ring turns
   pink, counts up (+0:30) and says so every 30 seconds until Done or Skip. ☰ shows the whole routine: pick what comes next, move
   items, add one. Done items are the day's checks (log[when][id]); the run is log[when+"Run"]. */
const ruN=(n,a,b,c)=>{const t=n%100,o=n%10;return t>10&&t<20?c:o===1?a:o>=2&&o<=4?b:c};
const RPW={
  dur:{en:s=>{const m=Math.floor(s/60),r=s%60;return [m?m+(m>1?" minutes":" minute"):"",r?r+" seconds":""].filter(Boolean).join(" ")},
    ja:s=>{const m=Math.floor(s/60),r=s%60;return (m?m+"分":"")+(r?r+"秒":"")},
    ru:s=>{const m=Math.floor(s/60),r=s%60;return [m?m+" "+ruN(m,"минута","минуты","минут"):"",r?r+" "+ruN(r,"секунда","секунды","секунд"):""].filter(Boolean).join(" ")}},
  up:{en:"Time's up. Press Done when you finish.",ja:"時間です。終わったら完了を押してね。",ru:"Время вышло. Нажми «Готово», когда закончишь."},
  over:{en:s=>`${RPW.dur.en(s)} over.`,ja:s=>`${RPW.dur.ja(s)}、過ぎています。`,ru:s=>`Уже ${RPW.dur.ru(s)} сверх времени.`},
  time:{en:n=>`It's time for ${n}.`,ja:n=>`${n}の時間です。`,ru:n=>`Пора: ${n}.`},
  end:{morning:{en:"All done. Let's make today a great day!",ja:"おつかれさま。今日も一日がんばろう！",ru:"Готово. Хорошего дня!"},
    night:{en:"All done. Great work today. Sleep well.",ja:"おつかれさま。今日もよくがんばったね。ゆっくり休んでね。",ru:"Готово. Отличный день. Спокойной ночи."}},
  part:{morning:{en:"Good start. Let's make today a great day!",ja:"おつかれさま。できた分でOK。今日も一日がんばろう！",ru:"Хорошее начало. Хорошего дня!"},
    night:{en:"Good work today. What you did counts. Sleep well.",ja:"おつかれさま。できた分でOK。ゆっくり休んでね。",ru:"Хорошая работа. Спокойной ночи."},
    other:{en:"Good work. What you did counts.",ja:"おつかれさま。できた分でOK！",ru:"Хорошая работа."}}
};

  if(P.phase==="end"){if(k==="Escape"||k==="Enter"){e.preventDefault();rpClose()}return}
  if(k===" "){e.preventDefault();rpPause()}else if(k==="Enter"||k==="ArrowRight"){e.preventDefault();rpNext("done")}else if(k==="s"||k==="S")rpNext("skip");else if(k==="+"||k==="=")rpAdd();else if(k==="l"||k==="L")$('#rp [data-rp="list"]')?.click();else if(k==="Escape")rpEnd();
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(P&&P.phase==="run")rpWake(true);sync()}});
window.addEventListener("online",sync);
/* on the Mac (localhost), 22:00-07:00 is quiet: the start screen opens without the alarm sound (same as desk/routine_alarm.py) */
const macQuiet=()=>{if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))return false;const h=new Date(Date.now()+HCMC).getUTCHours();return h>=22||h<7};
/* the start alarm while this page is open (on the Mac, desk/routine_alarm.py rings even when it is closed) */
setInterval(()=>{
  if(P||document.visibilityState!=="visible")return;const c=settings();if(c.alarm===false)return;const now=new Date(Date.now()+HCMC).toISOString().slice(11,16);
  lists().filter(l=>l.alarm!==false&&l.at).forEach(l=>{const w=l.id;if(P||now!==l.at)return;const key=today()+w;let last="";try{last=localStorage.getItem("rt-alarm")||""}catch(e){}
    if(last===key||run(today(),w))return;try{localStorage.setItem("rt-alarm",key)}catch(e){}rpOpen(w,macQuiet()?"":"alarm")});
},15000);

/* ---------- start ---------- */
(async()=>{
  await load();route();sync();setInterval(()=>{if(!P||P.phase!=="run")sync()},60000);
  if(MODE==="desk")setInterval(async()=>{if(P)return;const was=JSON.stringify([S.routines,S.log]);await load();if(was!==JSON.stringify([S.routines,S.log]))render()},30000);
  if("serviceWorker" in navigator&&MODE==="cloud")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
