<title>VINEPRO ボード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: top bar (boards, language, people) / left tool rail / paper canvas or 100-day schedule / property sheet.
   The canvas and schedule grid are drawn as paper in both themes on purpose; the app chrome follows the theme. */
:root {
  --chrome: #F3F4F1;
  --chrome-2: #E6E8E3;
  --rule: #CDD1CA;
  --fg: #1C211E;
  --muted: #5D665F;
  --accent: #2B55C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE4FA;
  --danger: #B42A2A;
  --paper: #FBFBF8;
  --dot: #D9DCD4;
  --f-ui: "Zen Kaku Gothic New", "Be Vietnam Pro", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
:root[lang="vi"], :root[lang="en"] { --f-ui: "Be Vietnam Pro", "Zen Kaku Gothic New", "Segoe UI", "Noto Sans", sans-serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #1A1D1B; --chrome-2: #252925; --rule: #3A403B; --fg: #E8ECE6; --muted: #A3ACA4;
    --accent: #8EA9F2; --accent-ink: #10172B; --accent-soft: #24304F; --danger: #F08A8A;
    --paper: #F4F4EF; --dot: #D4D7CF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #1A1D1B; --chrome-2: #252925; --rule: #3A403B; --fg: #E8ECE6; --muted: #A3ACA4;
  --accent: #8EA9F2; --accent-ink: #10172B; --accent-soft: #24304F; --danger: #F08A8A;
  --paper: #F4F4EF; --dot: #D4D7CF; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--chrome); color: var(--fg); font-family: var(--f-ui); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--chrome);
}
.brand { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.brand small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 6px; letter-spacing: .08em; }
.tabs { display: flex; gap: 4px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 11px; white-space: nowrap; font-size: 13px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--paper); color: #1C211E; border-color: var(--rule); font-weight: 700; }
.tab.add { color: var(--accent); }
.langs { display: flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.langs button { border: 0; background: transparent; padding: 4px 9px; font-size: 12px; font-family: var(--f-mono); letter-spacing: .04em; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--fg); color: var(--chrome); }
.peers { display: flex; align-items: center; gap: 6px; }
.peers img { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--chrome); outline: 2px solid var(--pc, transparent); }
.status { font-size: 12px; color: var(--muted); white-space: nowrap; }
.status.warn { color: var(--danger); }

.main { position: relative; min-height: 0; display: grid; grid-template-columns: auto 1fr; }
.tools {
  display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; border-right: 1px solid var(--rule); background: var(--chrome);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
}
.tool { width: 44px; height: 44px; border-radius: 8px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; position: relative; }
.tool svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool:hover { background: var(--chrome-2); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tool kbd { position: absolute; right: 3px; bottom: 1px; font-family: var(--f-mono); font-size: 9px; opacity: .55; }
.tools .sep { height: 1px; background: var(--rule); margin: 4px 6px; }
.tool kbd { white-space: nowrap; }
#panel h2 .close { margin-left: auto; border: 0; background: transparent; width: 28px; height: 28px; margin-top: -6px; margin-right: -6px; border-radius: 6px; font-size: 18px; line-height: 1; color: var(--fg); font-family: var(--f-ui); letter-spacing: 0; }
#panel h2 .close:hover { background: var(--chrome-2); }
#panel h2 { align-items: center; }
#optbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; max-width: calc(100% - 32px); box-sizing: border-box; background: var(--chrome); border: 1px solid var(--rule); border-radius: 10px; padding: 7px 10px; font-size: 12px; box-shadow: 0 8px 24px -16px rgba(0,0,0,.4); }
#optbar .grp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
#optbar .lbl { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--rule); background: transparent; padding: 4px 9px; font-size: 12px; white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); padding: 0; }
.dot[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { position: relative; min-width: 0; min-height: 0; }
#viewport {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px); cursor: default; user-select: none; -webkit-user-select: none;
}
#viewport.panning { cursor: grabbing; }
#viewport.mode-pen, #viewport.mode-sticky, #viewport.mode-box, #viewport.mode-text { cursor: crosshair; }
#viewport.mode-arrow { cursor: alias; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.layer { position: absolute; left: 0; top: 0; }
svg.layer { overflow: visible; width: 1px; height: 1px; }

.it { position: absolute; box-sizing: border-box; border: 1px solid; border-radius: 7px; padding: 5px 7px 6px 8px; color: #1F2328; overflow: hidden; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
.it .t { font-weight: 700; display: block; }
.it .b { display: block; }
.it .n { display: block; color: #57606A; }
.it .m { display: inline-block; margin-top: 3px; padding: 0 6px; border-radius: 9px; background: #EEF1F4; color: #3D4650; font-family: var(--f-mono); font-size: 10.5px; line-height: 17px; }
.it .m i { font-style: normal; font-family: var(--f-ui); color: #57606A; }
.it.k-zone, .it.k-label, .it.k-cell, .it.k-sticky { border-radius: 0; }
.it.k-header { display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 3px 6px; }
.it.k-text { border-color: transparent; background: transparent; padding: 0; overflow: visible; }
.it.k-text.has-title { display: flex; align-items: center; }
.it.k-sticky { box-shadow: 0 1px 2px rgba(60, 50, 0, .18), 0 6px 14px -8px rgba(60, 50, 0, .35); }
.it.dash { border-style: dashed; border-width: 1.6px; }
.it.sel { outline: 2px solid #2B55C9; outline-offset: 2px; }
.it.src { outline: 2px dashed #2B55C9; outline-offset: 3px; }
.it.align-center { text-align: center; }
.it.pending .t::after { content: " …"; color: #8C959F; font-weight: 400; }
.handle { position: absolute; right: -6px; bottom: -6px; width: 12px; height: 12px; background: #fff; border: 2px solid #2B55C9; border-radius: 3px; cursor: nwse-resize; }
.edge-hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
.edge-line { fill: none; stroke-width: 1.5; pointer-events: none; }
.edge-line.sel { stroke-width: 3; }
.edge-label rect { fill: #FFFFFF; }
.edge-label text { font: 500 10.5px var(--f-ui); fill: #24292F; }
.stroke-line { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: stroke; }
.stroke-line.sel { filter: drop-shadow(0 0 2px #2B55C9); }
#live { pointer-events: none; }
.cursor { position: absolute; pointer-events: none; }
.cursor svg { width: 16px; height: 16px; display: block; }
.cursor span { display: inline-block; margin: 2px 0 0 12px; padding: 1px 7px; border-radius: 9px; font-size: 11px; color: #fff; white-space: nowrap; }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 2px; background: var(--chrome); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; }
.zoom button { border: 0; background: transparent; min-width: 34px; height: 30px; border-radius: 5px; font-family: var(--f-mono); font-size: 12px; }
.zoom button:hover { background: var(--chrome-2); }
.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--chrome); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 14px; font-size: 13px; text-align: center; z-index: 5; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #3F4741; padding: 16px; }
.empty b { display: block; font-size: 17px; margin-bottom: 6px; }
.empty button { margin-top: 12px; border: 0; background: #2B55C9; color: #fff; padding: 8px 16px; border-radius: 7px; }

/* ---- 100-day schedule ---- */
#gantt { position: absolute; inset: 0; overflow: auto; background: var(--paper); color: #1F2328; overscroll-behavior: contain; }
.g-bar-top { position: sticky; left: 0; top: 0; z-index: 6; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--paper); border-bottom: 1px solid #DDE1DA; width: max-content; min-width: 100%; box-sizing: border-box; }
.g-bar-top h2 { margin: 0; font-size: 15px; }
.g-bar-top .sum { font-family: var(--f-mono); font-size: 12px; color: #57606A; }
.g-bar-top button { border: 1px solid #C7CCC4; background: #fff; color: #1F2328; border-radius: 6px; padding: 5px 10px; font-size: 12.5px; }
.g-bar-top button.primary { background: #2B55C9; border-color: #2B55C9; color: #fff; }
.g-grid { position: relative; display: grid; }
.g-corner, .g-name, .g-lane, .g-foot-name { position: sticky; left: 0; z-index: 3; background: var(--paper); border-right: 1px solid #DDE1DA; box-sizing: border-box; }
.g-corner { z-index: 5; top: 49px; display: flex; align-items: end; padding: 0 10px 4px; font-size: 11px; color: #57606A; border-bottom: 1px solid #DDE1DA; }
.g-head { position: sticky; top: 49px; z-index: 4; background: var(--paper); border-bottom: 1px solid #DDE1DA; }
.g-month { position: absolute; top: 2px; font-size: 11px; font-weight: 700; color: #3D4650; white-space: nowrap; padding-left: 4px; border-left: 1px solid #C7CCC4; }
.g-day { position: absolute; bottom: 2px; text-align: center; font-family: var(--f-mono); font-size: 10px; color: #57606A; line-height: 1.15; }
.g-day.we { color: #A0562A; }
.g-day.today { color: #fff; background: #2B55C9; border-radius: 4px; }
.g-lane { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 700; font-size: 12.5px; color: #fff; border-right: 0; }
.g-lane-row { box-sizing: border-box; }
.g-name { display: flex; flex-direction: column; justify-content: center; padding: 0 10px 0 16px; font-size: 12px; line-height: 1.3; cursor: pointer; border-bottom: 1px solid #ECEEE9; overflow: hidden; }
.g-name .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-name .mt { font-family: var(--f-mono); font-size: 10px; color: #6A737D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-name.sel { background: #E6ECFB; }
.g-row { position: relative; border-bottom: 1px solid #ECEEE9; }
.g-cols { position: absolute; inset: 0; pointer-events: none; }
.g-bar { position: absolute; top: 7px; height: 22px; border-radius: 5px; box-sizing: border-box; padding: 0 6px; font-size: 10.5px; line-height: 22px; color: #fff; white-space: nowrap; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.g-bar.ms { border-radius: 50%; padding: 0; }
.g-bar.sel { outline: 2px solid #1F2328; outline-offset: 1px; }
.g-bar .rz { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
.g-foot-name { font-size: 11.5px; font-weight: 700; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; border-top: 2px solid #C7CCC4; }
.g-foot-name small { font-weight: 400; color: #57606A; font-size: 10.5px; }
.g-foot { position: relative; border-top: 2px solid #C7CCC4; }
.g-load { position: absolute; bottom: 4px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.g-load span { width: 70%; background: #7A5CC8; border-radius: 2px 2px 0 0; }
.g-load b { font-family: var(--f-mono); font-size: 9px; font-weight: 500; color: #3D4650; }
.g-load.hot span { background: #D03B3B; }

#panel { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; width: 290px; max-height: calc(100% - 70px); overflow: auto; background: var(--chrome); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: grid; gap: 12px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.45); z-index: 8; }
#panel h2 { margin: 0; font-size: 12px; letter-spacing: .1em; color: var(--muted); font-family: var(--f-mono); font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
#panel h2 span { letter-spacing: 0; font-family: var(--f-ui); }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; box-sizing: border-box; border: 1px solid var(--rule); border-radius: 6px; background: var(--chrome-2); padding: 6px 8px; font-size: 13px; }
.field textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.sw button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); padding: 0; }
.sw button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--rule); background: var(--chrome-2); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin: 0; }
.toast { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--chrome); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); z-index: 9; }
.rename { border: 1px solid var(--accent); border-radius: 6px; padding: 4px 8px; font-size: 13px; width: 160px; background: var(--paper); color: #1C211E; }

@media (max-width: 640px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .tools { grid-row: 2; flex-direction: row; overflow-x: auto; border-right: 0; border-top: 1px solid var(--rule); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .tools .sep { width: 1px; height: auto; margin: 6px 4px; }
  #panel { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); top: auto; bottom: 8px; width: auto; max-height: 55%; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand">VINEPRO <span id="brandWord">ボード</span><small>ACADEMY OPS</small></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <span class="status" id="status"></span>
    <div class="langs" id="langs" role="group">
      <button type="button" data-lang="ja">日本語</button><button type="button" data-lang="vi">Tiếng Việt</button><button type="button" data-lang="en">English</button>
    </div>
    <div class="peers" id="peers"></div>
  </header>
  <div class="main">
    <nav class="tools" id="tools">
      <button class="tool" data-tool="select" data-i="toolSelect"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><kbd>V</kbd></button>
      <button class="tool w" data-tool="sticky" data-i="toolSticky"><svg viewBox="0 0 24 24"><path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/></svg><kbd>N</kbd></button>
      <button class="tool w" data-tool="box" data-i="toolBox"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/></svg><kbd>B</kbd></button>
      <button class="tool w" data-tool="text" data-i="toolText"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg><kbd>T</kbd></button>
      <button class="tool w" data-tool="arrow" data-i="toolArrow"><svg viewBox="0 0 24 24"><path d="M4 18h9a4 4 0 004-4V6"/><path d="M13 10l4-4 4 4"/></svg><kbd>A</kbd></button>
      <button class="tool w" data-tool="pen" data-i="toolPen"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><kbd>P</kbd></button>
      <div class="sep"></div>
      <button class="tool w2" id="undoBtn" data-i="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg><kbd>⌘Z</kbd></button>
      <button class="tool w2" id="redoBtn" data-i="redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h4"/></svg><kbd>⇧⌘Z</kbd></button>
      <button class="tool" id="fitBtn" data-i="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><kbd>F</kbd></button>
    </nav>
    <div class="stage">
      <div id="viewport" tabindex="0">
        <div id="world">
          <div class="layer" id="back"></div>
          <svg class="layer" id="edgeSvg"><defs id="defs"></defs><g id="edges"></g></svg>
          <div class="layer" id="front"></div>
          <svg class="layer" id="inkSvg"><g id="strokes"></g><path id="live" class="stroke-line" fill="none"/></svg>
          <div class="layer" id="cursors"></div>

        <div class="empty" id="empty" hidden></div>
        <div class="zoom" id="zoom">
          <button id="zOut" type="button">−</button><button id="zPct" type="button">100%</button><button id="zIn" type="button">＋</button>
        </div>
      </div>
      <div id="gantt" hidden></div>
      <div id="optbar" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <aside id="panel" hidden></aside>
      <div class="toast" id="toast" hidden></div>
    </div>
  </div>
</div>

    if (tl === "text") seg(grp(t("optSize")), [["s", t("sz_s")], ["m", t("sz_m")], ["l", t("sz_l")], ["xl", t("sz_xl")]], S.opt.text, "text");
    if (tl === "arrow") {
      seg(grp(t("optLine")), [[false, t("solid")], [true, t("dashedL")]], !!S.opt.edash, "edash");
      seg(grp(t("optHead")), [["end", t("head_end")], ["both", t("head_both")], ["none", t("head_none")]], S.opt.ehead, "ehead");
      dots(grp(t("optColor")), LINES.filter((c) => c !== "none" && c !== "line"), S.opt.ecolor, "ecolor");
    }
    if (tl === "pen") {
      dots(grp(t("optColor")), INKS, S.opt.pen, "pen");
      seg(grp(t("optWidth")), [[2, t("w_thin")], [3, t("w_mid")], [6, t("w_bold")]], S.opt.penw, "penw");
    }
  }

  // ================= tools & keys =================
  function setTool(x) {
    if (!S.canWrite && x !== "select") x = "select";
    S.tool = x; S.arrowFrom = null;
    document.querySelectorAll(".tool[data-tool]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tool === x)));
    vp.className = "mode-" + x; schedule(); renderOptBar();
    if (x === "arrow") toast(t("arrowHint"));
  }
  document.querySelectorAll(".tool[data-tool]").forEach((b) => b.addEventListener("click", () => setTool(b.dataset.tool)));
  $("fitBtn").addEventListener("click", fit);
  $("undoBtn").addEventListener("click", undo); $("redoBtn").addEventListener("click", redo);
  const zc = (f) => { const r = vp.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, f); };
  $("zIn").addEventListener("click", () => zc(1.2)); $("zOut").addEventListener("click", () => zc(1 / 1.2)); $("zPct").addEventListener("click", () => zc(1 / S.view.s));
  function applyWriteMode(quiet) {
    const bn = $("banner");
    if (!S.canWrite) { bn.hidden = false; bn.textContent = t("roBanner"); if (!quiet) setTool("select"); } else bn.hidden = true;
    $("tabs").dataset.sig = ""; if (!quiet) renderPanel(); schedule();
  }

  // ================= canvas pointer =================
  const ptrs = new Map(); let act = null; let penColor = "red", spaceDown = false;
  vp.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".zoom, #optbar")) return;
    vp.focus({ preventScroll: true });
    ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); vp.setPointerCapture(ev.pointerId);
    if (ptrs.size === 2) { const [p1, p2] = [...ptrs.values()]; act = { type: "pinch", d: Math.hypot(p1.x - p2.x, p1.y - p2.y), view: Object.assign({}, S.view), cx: (p1.x + p2.x) / 2, cy: (p1.y + p2.y) / 2 }; $("live").setAttribute("d", ""); return; }
    const w = toWorld(ev.clientX, ev.clientY);
    const itemEl = ev.target.closest(".it"); const id = itemEl && itemEl.dataset.id;
    const eh = ev.target.closest("[data-edge]"); const edgeId = eh && eh.dataset.edge;
    const strokeId = ev.target.dataset && ev.target.dataset.stroke;
    if (ev.button === 1 || spaceDown) { act = { type: "pan", sx: ev.clientX, sy: ev.clientY, vx: S.view.x, vy: S.view.y }; vp.classList.add("panning"); return; }
    const tl = S.tool;
    if (tl === "pen") { act = { type: "pen", pts: [[w.x, w.y]] }; return; }
    if (tl === "sticky" || tl === "box" || tl === "text") { createItem(tl, w.x, w.y); act = null; return; }
    if (tl === "arrow") { if (id) { if (!S.arrowFrom) S.arrowFrom = id; else if (S.arrowFrom !== id) { createEdge(S.arrowFrom, id); S.arrowFrom = null; } } else S.arrowFrom = null; schedule(); act = null; return; }
    if (ev.target.dataset.handle && id) { const it = S.items.get(id); act = { type: "resize", id, sx: w.x, sy: w.y, w0: it.w, h0: realH(it) }; return; }
    if (id) {
      const it = S.items.get(id);
      if (it.locked || !S.canWrite) { act = { type: "pan", sx: ev.clientX, sy: ev.clientY, vx: S.view.x, vy: S.view.y, click: { type: "item", id } }; return; }
      S.sel = { type: "item", id }; renderPanel(); schedule(); act = { type: "drag", id, sx: w.x, sy: w.y, x0: it.x, y0: it.y, moved: false }; return;
    }
    if (edgeId) { S.sel = { type: "edge", id: edgeId }; renderPanel(); schedule(); act = null; return; }
    if (strokeId) { S.sel = { type: "stroke", id: strokeId }; renderPanel(); schedule(); act = null; return; }
    act = { type: "pan", sx: ev.clientX, sy: ev.clientY, vx: S.view.x, vy: S.view.y, click: null };
  });
  vp.addEventListener("pointermove", (ev) => {
    if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    const w = toWorld(ev.clientX, ev.clientY);
    if (room && ev.pointerType === "mouse") room.presence({ cursor: { x: Math.round(w.x), y: Math.round(w.y), board: S.board } }).catch(() => {});
    if (!act) return;
    if (act.type === "pinch" && ptrs.size >= 2) {
      const [p1, p2] = [...ptrs.values()]; const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      const r = vp.getBoundingClientRect(); const cx = (p1.x + p2.x) / 2 - r.left, cy = (p1.y + p2.y) / 2 - r.top;
      const ns = Math.min(3, Math.max(0.15, act.view.s * d / act.d)); const k = ns / act.view.s; const ocx = act.cx - r.left, ocy = act.cy - r.top;
      S.view = { s: ns, x: cx - (ocx - act.view.x) * k, y: cy - (ocy - act.view.y) * k }; applyView(); return;
    }
    if (act.type === "pan") { const dx = ev.clientX - act.sx, dy = ev.clientY - act.sy; if (Math.abs(dx) + Math.abs(dy) > 3) { act.moved = true; vp.classList.add("panning"); } S.view.x = act.vx + dx; S.view.y = act.vy + dy; applyView(); return; }
    if (act.type === "drag") {
      const it = S.items.get(act.id); if (!it) { act = null; return; }
      const nx = Math.round(act.x0 + w.x - act.sx), ny = Math.round(act.y0 + w.y - act.sy);
      if (!act.moved && Math.abs(nx - act.x0) + Math.abs(ny - act.y0) < 3) return;
      act.moved = true; it.x = nx; it.y = ny;
      for (const e of S.edges.values()) if ((e.from === it.id || e.to === it.id) && (e.mode !== "auto" || e.ox)) { e.mode = "auto"; e.ox = 0; act.reset = act.reset || new Set(); act.reset.add(e.id); }
      schedule(); return;
    }
    if (act.type === "resize") { const it = S.items.get(act.id); if (!it) { act = null; return; } it.w = Math.max(60, Math.round(act.w0 + w.x - act.sx)); it.h = Math.max(24, Math.round(act.h0 + w.y - act.sy)); act.moved = true; schedule(); return; }
    if (act.type === "pen") {
      const last = act.pts[act.pts.length - 1]; if (Math.hypot(w.x - last[0], w.y - last[1]) > 2 / S.view.s) act.pts.push([w.x, w.y]);
      const live = $("live"); live.setAttribute("d", strokePath(act.pts)); live.setAttribute("stroke", P[S.opt.pen] || P.red); live.setAttribute("stroke-width", S.opt.penw || 3);
    }
  });
  function endPointer(ev) {
    ptrs.delete(ev.pointerId); if (!act) return; const a = act;
    if (a.type === "pinch") { if (ptrs.size < 2) act = null; return; }
    act = null; vp.classList.remove("panning");
    if (a.type === "pan" && !a.moved) { S.sel = a.click || null; S.arrowFrom = null; renderPanel(); schedule(); }
    if (a.type === "drag" && a.moved) { const it = S.items.get(a.id); patch({ type: "item", id: a.id }, { x: it.x, y: it.y }); if (a.reset) for (const eid of a.reset) save("edges", eid, { mode: "auto", ox: 0 }, "update"); }
    if (a.type === "resize" && a.moved) { const it = S.items.get(a.id); patch({ type: "item", id: a.id }, { w: it.w, h: it.h }); }
    if (a.type === "pen") {
      $("live").setAttribute("d", "");
      if (a.pts.length > 1 && S.canWrite) {
        const pts = simplify(a.pts).map((p) => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]).slice(0, 1500);
        const id = "s" + uid(); const s = { board: S.board, pts, color: S.opt.pen || "red", width: S.opt.penw || 3, by: S.me, at: Date.now() };
        S.strokes.set(id, Object.assign({ id }, s)); save("strokes", id, s, "set"); schedule();
      }
    }
  }
  vp.addEventListener("pointerup", endPointer); vp.addEventListener("pointercancel", endPointer);
  vp.addEventListener("pointerleave", () => { if (room) room.presence({ cursor: null }).catch(() => {}); });
  vp.addEventListener("dblclick", (ev) => { const itemEl = ev.target.closest(".it"); if (!itemEl) return; S.sel = { type: "item", id: itemEl.dataset.id }; focusTitleNext = true; $("panel").dataset.sig = ""; renderPanel(); schedule(); });
  vp.addEventListener("wheel", (ev) => { ev.preventDefault(); if (ev.ctrlKey || ev.metaKey) zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.01)); else { S.view.x -= ev.deltaX; S.view.y -= ev.deltaY; applyView(); } }, { passive: false });
  function simplify(pts) {
    if (pts.length < 3) return pts; const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) { const a = out[out.length - 1], b = pts[i], c = pts[i + 1]; const area = Math.abs((b[0] - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (b[1] - a[1])); if (area > 2 || Math.hypot(b[0] - a[0], b[1] - a[1]) > 40) out.push(b); }
    out.push(pts[pts.length - 1]); return out;
  }
  document.addEventListener("keydown", (ev) => {
    const typing = ev.target.closest && ev.target.closest("input, textarea, select");
    if (typing) { if (ev.key === "Escape") ev.target.blur(); return; }
    if (ev.key === " ") { spaceDown = true; return; }
    if ((ev.metaKey || ev.ctrlKey) && (ev.key === "z" || ev.key === "Z")) { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); return; }
    if ((ev.metaKey || ev.ctrlKey) && (ev.key === "y" || ev.key === "Y")) { ev.preventDefault(); redo(); return; }
    if (ev.metaKey || ev.ctrlKey) return;
    const k = ev.key.toLowerCase();
    const map = { v: "select", n: "sticky", b: "box", t: "text", a: "arrow", p: "pen" };
    if (map[k] && !isGantt()) { setTool(map[k]); ev.preventDefault(); return; }
    if (k === "f") { fit(); return; }
    if (ev.key === "Escape") { if (!isGantt()) setTool("select"); closePanel(); }
    if ((ev.key === "Delete" || ev.key === "Backspace") && S.sel) { ev.preventDefault(); deleteSel(); }
  });
  document.addEventListener("keyup", (ev) => { if (ev.key === " ") spaceDown = false; });

  // ================= presence =================
  let presT = 0;
  function presenceSoon() { clearTimeout(presT); presT = setTimeout(() => { if (room) room.presence({ board: S.board }).catch(() => {}); }, 200); }
  async function renderPeerList() {
    const box = $("peers"); box.textContent = "";
    const ids = [...new Set(S.peers.filter((p) => p.kind === "viewer" && p.by).map((p) => p.by))];
    if (!user || !ids.length) return;
    const ps = await user.profiles(ids); S.profiles = Object.assign(S.profiles, ps);
    for (const id of ids) { const p = ps[id]; const img = el("img"); img.src = p.avatarUrl; img.alt = p.name || t("someone"); img.title = (p.name || t("someone")) + (p.isMe ? ` (${t("you")})` : ""); img.style.setProperty("--pc", p.color); box.append(img); }
    renderCursors();
  }
  function renderCursors() {
    const box = $("cursors"); box.textContent = "";
    for (const p of S.peers) {
      if (p.isMe || p.kind !== "viewer") continue;
      const c = p.presence && p.presence.cursor; if (!c || c.board !== S.board || typeof c.x !== "number") continue;
      const prof = (p.by && S.profiles[p.by]) || null; const color = (prof && prof.color) || "#2B55C9";
      const d = el("div", "cursor"); d.style.left = c.x + "px"; d.style.top = c.y + "px"; d.style.transform = `scale(${1 / S.view.s})`; d.style.transformOrigin = "0 0";
      const s = svgEl("svg", { viewBox: "0 0 16 16" }); s.append(svgEl("path", { d: "M1 1l5 14 2-6 6-2z", fill: color, stroke: "#fff", "stroke-width": "1" }));
      const name = el("span", null, (prof && prof.name) || t("someone")); name.style.background = color; d.append(s, name); box.append(d);
    }
  }

  // ================= boot =================
  applyView(); setTool("select"); applyLang(); status("loading");
  const loadTimer = setTimeout(() => { if (!S.loaded.items) status("unreachable", true); }, 10000);
  function listen(col, map) {
    db.collection(col).onSnapshot((snap) => {
      for (const ch of snap.docChanges()) {
        const d = ch.doc;
        const skey = col + "/" + d.id;
        if (ch.type === "removed") { map.delete(d.id); if (!queued.has(skey) && !inflight.has(skey)) shadow.delete(skey); continue; }
        if (!queued.has(skey) && !inflight.has(skey)) shadow.set(skey, clone(d.data()));
        const data = Object.assign({ id: d.id }, JSON.parse(JSON.stringify(d.data())));
        if (act && act.id === d.id && (act.type === "drag" || act.type === "resize")) { const cur = map.get(d.id); if (cur) Object.assign(data, { x: cur.x, y: cur.y, w: cur.w, h: cur.h }); }
        if (gDrag && gDrag.id === d.id) { const cur = map.get(d.id); if (cur) Object.assign(data, { start: cur.start, days: cur.days }); }
        map.set(d.id, data);
      }
      const first = !S.loaded[col]; S.loaded[col] = true;
      if (col === "items" && !snap.metadata.fromCache) { clearTimeout(loadTimer); status(S.canWrite ? "autosave" : "readonly"); }
      if (S.sel && !mapOf(S.sel.type).has(S.sel.id)) S.sel = null;
      $("tabs").dataset.sig = ""; renderPanel(); schedule();
      if (first && (col === "items" || col === "boards")) requestAnimationFrame(() => requestAnimationFrame(() => {
        if (S.board && S.loaded.items && S.loaded.boards && !S.fitted.has(S.board)) { S.fitted.add(S.board); if (isGantt()) scrollToToday(); else fit(); }
      }));
    }, (e) => { clearTimeout(loadTimer); status(e.code === "revoked" ? "revoked" : "loadFail", true); });
  }
  (async () => {
    if (!window.claude || !window.claude.use) { S.canWrite = false; status("nosave", true); applyWriteMode(); return; }
    const [d, u, r, s] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("room"), claude.use("sample")]);
    db = d; user = u; room = r; sample = s;
    if (user) { S.me = await user.id(); const cw = await user.can("data.write"); if (cw === false) S.canWrite = false; }
    if (!db) { S.canWrite = false; status("signin", true); applyWriteMode(); return; }
    applyWriteMode();
    listen("boards", S.boards); listen("items", S.items); listen("edges", S.edges); listen("strokes", S.strokes); listen("tasks", S.tasks);
    if (room) { room.onPeers((ch) => { S.peers = [...ch.peers]; if (ch.joined.length || ch.left.length) renderPeerList(); else renderCursors(); }); presenceSoon(); }
  })();
  window.addEventListener("resize", () => schedule());
})();
