<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusBlock</title>
<style>
:root {
  --bg: #f5f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dc;
  --accent: #2f6f5e; --accent-text: #fff; --danger: #b2412f; --chip: #eef1ee; --active: #1f3d35;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151614; --card: #1f201e; --text: #ecece8; --muted: #9a9a94; --line: #33342f;
    --accent: #5fb39a; --accent-text: #0f1a16; --danger: #e0715f; --chip: #2a2d2a; --active: #20453b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 28px 16px 80px; }
h1 { font-size: 22px; margin: 0 0 20px; letter-spacing: .02em; }
h2 { font-size: 16px; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.status { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.status.on { background: var(--active); color: #f2f7f4; border-color: transparent; }
.status .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.status .sub { opacity: .8; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); font-size: 13px; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 9px; padding: 7px 14px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
button.danger { color: var(--danger); }
button.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.status.on button { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
input[type=text], input[type=password], input[type=number], input[type=time], textarea {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; min-height: 120px; resize: vertical; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button.sel { background: var(--accent); color: var(--accent-text); box-shadow: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { background: var(--chip); border-radius: 999px; padding: 3px 6px 3px 12px; display: inline-flex; gap: 4px; align-items: center; }
.chip button { border: 0; background: none; padding: 0 6px; color: var(--muted); }
.sched { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 8px; }
.days button { padding: 4px 9px; min-width: 34px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.locked-note { font-size: 13px; color: var(--danger); margin-bottom: 10px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 9px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); padding: 20px; width: min(360px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.4); }
.hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>🔒 FocusBlock</h1>

  <section id="setup" class="card hidden">
    <h2>はじめに：解除パスワードを決める</h2>
    <p class="muted">ブロックを途中で止めたり、ブロック中に設定を変えるときに必要です。誰か（家族・友人）に決めてもらうと、より強力になります。</p>
    <div class="row">
      <input type="password" id="pw1" placeholder="パスワード">
      <input type="password" id="pw2" placeholder="もう一度">
      <button class="primary" id="setupBtn">設定する</button>
    </div>
  </section>

  <div id="app" class="hidden">
    <section id="status" class="card status">
      <div>
        <div class="sub" id="stLabel">待機中</div>
        <div class="big" id="stTime">—</div>
        <div class="sub" id="stDetail"></div>
      </div>
      <button id="stopBtn" class="hidden">パスワードで解除</button>
    </section>

    <section class="card">
      <h2>今すぐ集中する</h2>
      <div class="row" id="durations"></div>
      <div class="row" style="margin-top:10px">
        <span class="muted">または終了時刻</span><input type="time" id="untilTime">
        <span class="muted">／ 分数</span><input type="number" id="customMin" min="1" max="10000" style="width:90px">
      </div>
      <div class="row" style="margin-top:14px">
        <span class="muted">ブロック対象：</span>
        <label class="check"><input type="checkbox" id="qApps" checked> アプリ</label>
        <label class="check"><input type="checkbox" id="qWeb" checked> Webサイト</label>
        <button class="primary" id="startBtn" style="margin-left:auto">開始</button>
      </div>
    </section>

    <section class="card">
      <h2>スケジュール</h2>
      <p class="muted" style="margin-top:-6px">決まった曜日・時間に自動でブロックを開始します。</p>
      <div id="schedList"></div>
      <button id="addSched">＋ スケジュールを追加</button>
    </section>

    <section class="card">
      <h2>アプリ</h2>
      <div class="seg" id="appsMode">
        <button data-v="block">指定したアプリをブロック</button>
        <button data-v="allow">指定したアプリ以外をブロック</button>
      </div>
      <div class="chips" id="appChips"></div>
      <div class="row">
        <input type="text" id="appInput" list="appOptions" placeholder="アプリ名（例: Slack）" style="flex:1;min-width:200px">
        <datalist id="appOptions"></datalist>
        <button id="appAdd">追加</button>
      </div>
      <p class="hint" id="appsHint"></p>
    </section>

    <section class="card">
      <h2>Webサイト</h2>
      <div class="seg" id="webMode">
        <button data-v="block">指定したサイトをブロック</button>
        <button data-v="allow">指定したサイト以外をブロック</button>
      </div>
      <p class="hint">1行に1つ。<code>youtube.com</code> と書けば <code>m.youtube.com</code> などのサブドメインも対象になります。</p>
      <textarea id="webList" spellcheck="false"></textarea>
      <p class="hint" id="webHint"></p>
    </section>

    <div class="row" style="justify-content:flex-end;margin-bottom:24px">
      <span class="muted" id="dirty"></span>
      <button class="primary" id="saveBtn">設定を保存</button>
    </div>

    <details class="card">
      <summary>パスワードを変更</summary>
      <div class="row" style="margin-top:12px">
        <input type="password" id="oldPw" placeholder="現在のパスワード">
        <input type="password" id="newPw" placeholder="新しいパスワード">
        <button id="chPwBtn">変更</button>
      </div>
    </details>
  </div>
</main>

<dialog id="pwDialog">
  <form method="dialog">
    <h2 id="pwTitle">パスワード</h2>
    <input type="password" id="pwInput" style="width:100%" autocomplete="off">
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button type="button" onclick="this.closest('dialog').close('cancel')">キャンセル</button>
      <button value="ok" class="primary">OK</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const DAYS = ["月", "火", "水", "木", "金", "土", "日"];
let S = null;           // last server state
let draft = null;       // editable settings
let dirty = false;
let startMinutes = 25;

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "エラー");
  return j;
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}

function askPassword(title) {
  return new Promise((resolve) => {
    const d = $("pwDialog"); $("pwTitle").textContent = title; $("pwInput").value = "";
    d.onclose = () => resolve(d.returnValue === "ok" ? $("pwInput").value : null);
    d.showModal();
  });
}

function fmtRemain(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
function fmtClock(epoch) {
  const d = new Date(epoch * 1000), now = new Date();
  const t = d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? t : (d.getMonth() + 1) + "/" + d.getDate() + " " + t;
}

function renderStatus() {
  const a = S.active, on = a.active;
  $("status").classList.toggle("on", on);
  $("stopBtn").classList.toggle("hidden", !on);
  if (!on) {
    $("stLabel").textContent = "待機中"; $("stTime").textContent = "ブロックしていません";
    $("stDetail").textContent = ""; return;
  }
  const targets = [a.apps && "アプリ", a.web && "Webサイト"].filter(Boolean).join("・");
  const offset = Date.now() / 1000 - S.now;
  $("stLabel").textContent = "ブロック中（" + targets + "）";
  $("stTime").textContent = fmtRemain(a.end - (Date.now() / 1000 - offset));
  $("stDetail").textContent = a.sources.map((s) => s.name + "：" + fmtClock(s.end) + " まで").join(" / ");
}

function renderDurations() {
  const box = $("durations"); box.innerHTML = "";
  [[25, "25分"], [50, "50分"], [60, "1時間"], [120, "2時間"], [240, "4時間"]].forEach(([m, label]) => {
    const b = document.createElement("button"); b.textContent = label;
    b.className = startMinutes === m && !$("untilTime").value && !$("customMin").value ? "sel" : "";
    b.onclick = () => { startMinutes = m; $("untilTime").value = ""; $("customMin").value = ""; renderDurations(); };
    box.appendChild(b);
  });
}

function seg(id, value, onPick) {
  document.querySelectorAll("#" + id + " button").forEach((b) => {
    b.classList.toggle("sel", b.dataset.v === value);
    b.onclick = () => onPick(b.dataset.v);
  });
}

function markDirty() { dirty = true; $("dirty").textContent = "未保存の変更があります"; }

function renderSettings() {
  seg("appsMode", draft.apps.mode, (v) => { draft.apps.mode = v; markDirty(); renderSettings(); });
  seg("webMode", draft.web.mode, (v) => { draft.web.mode = v; markDirty(); renderSettings(); });
  const chips = $("appChips"); chips.innerHTML = "";
  draft.apps.list.forEach((name, i) => {
    const c = document.createElement("span"); c.className = "chip"; c.textContent = name;
    const x = document.createElement("button"); x.textContent = "×"; x.title = "削除";
    x.onclick = () => { draft.apps.list.splice(i, 1); markDirty(); renderSettings(); };
    c.appendChild(x); chips.appendChild(c);
  });
  if (!draft.apps.list.length) chips.innerHTML = '<span class="muted">まだありません</span>';
  $("appsHint").textContent = draft.apps.mode === "allow"
    ? (draft.apps.list.length ? "" : "⚠️ 今は許可アプリが0個なので、ブラウザもすべて終了されます。使うアプリを追加してください。 ")
      + "ここにあるアプリ以外は起動するとすぐ終了されます（Claude・Finder・システム設定・メニューバー常駐アプリは対象外）。未保存の作業は失われるので注意してください。"
    : "ここにあるアプリは、ブロック中に起動するとすぐ終了されます（Claude・Finder・システム設定はブロックされません）。";
  $("webHint").textContent = draft.web.mode === "allow"
    ? "許可したサイト以外は、すべてのブラウザで開けなくなります。サイトによっては画像などを別ドメイン（例: gstatic.com）から読み込むので、表示が崩れたら追加してください。ブラウザ以外のアプリの通信にも適用されます。claude.ai などの Claude のサイトは常に開けます。"
    : "Safari・Chrome・Arc・Edge・Firefox など、すべてのブラウザで開けなくなります。claude.ai などの Claude のサイトはブロックされません。";
  if (document.activeElement !== $("webList")) $("webList").value = draft.web.list.join("\n");
  renderSchedules();
}

function renderSchedules() {
  const list = $("schedList"); list.innerHTML = "";
  if (!draft.schedules.length) list.innerHTML = '<p class="muted">スケジュールはありません。</p>';
  draft.schedules.forEach((s, i) => {
    const el = document.createElement("div"); el.className = "sched";
    el.innerHTML = `
      <div class="row">
        <label class="check"><input type="checkbox" data-k="enabled"> 有効</label>
        <input type="text" data-k="name" placeholder="名前（例: 午前の集中）" style="flex:1;min-width:160px">
        <button class="danger" data-act="del">削除</button>
      </div>
      <div class="row days"></div>
      <div class="row">
        <input type="time" data-k="start"> 〜 <input type="time" data-k="end">
        <label class="check"><input type="checkbox" data-k="apps"> アプリ</label>
        <label class="check"><input type="checkbox" data-k="web"> Webサイト</label>
      </div>`;
    el.querySelectorAll("[data-k]").forEach((inp) => {
      const k = inp.dataset.k;
      if (inp.type === "checkbox") inp.checked = !!s[k]; else inp.value = s[k] || "";
      inp.oninput = () => { s[k] = inp.type === "checkbox" ? inp.checked : inp.value; markDirty(); };
    });
    const days = el.querySelector(".days");
    DAYS.forEach((d, di) => {
      const b = document.createElement("button"); b.textContent = d;
      b.className = s.days.includes(di) ? "sel" : "";
      b.onclick = () => {
        s.days = s.days.includes(di) ? s.days.filter((x) => x !== di) : [...s.days, di];
        markDirty(); renderSchedules();
      };
      days.appendChild(b);
    });
    el.querySelector("[data-act=del]").onclick = () => { draft.schedules.splice(i, 1); markDirty(); renderSchedules(); };
    list.appendChild(el);
  });
}

async function refresh() {
  try { S = await api("/api/state"); } catch (e) { return; }
  $("setup").classList.toggle("hidden", S.hasPassword);
  $("app").classList.toggle("hidden", !S.hasPassword);
  if (!draft || !dirty) {
    draft = JSON.parse(JSON.stringify({ apps: S.apps, web: S.web, schedules: S.schedules }));
    renderSettings();
  }
  renderStatus();
}

$("setupBtn").onclick = async () => {
  if ($("pw1").value !== $("pw2").value) return toast("パスワードが一致しません");
  try { await api("/api/setup", { password: $("pw1").value }); toast("設定しました"); refresh(); }
  catch (e) { toast(e.message); }
};

$("untilTime").oninput = () => { $("customMin").value = ""; renderDurations(); };
$("customMin").oninput = () => { $("untilTime").value = ""; renderDurations(); };

$("startBtn").onclick = async () => {
  let end;
  if ($("untilTime").value) {
    const [h, m] = $("untilTime").value.split(":").map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    if (d <= new Date()) d.setDate(d.getDate() + 1);
    end = d.getTime() / 1000;
  } else {
    end = Date.now() / 1000 + 60 * (Number($("customMin").value) || startMinutes);
  }
  try {
    await api("/api/start", { end, apps: $("qApps").checked, web: $("qWeb").checked });
    toast("ブロックを開始しました"); refresh();
  } catch (e) { toast(e.message); }
};

$("stopBtn").onclick = async () => {
  const pw = await askPassword("解除するにはパスワードを入力");
  if (pw === null) return;
  try { await api("/api/stop", { password: pw }); toast("解除しました"); refresh(); }
  catch (e) { toast(e.message); }
};

$("appAdd").onclick = () => {
  const v = $("appInput").value.trim().replace(/\.app$/, "");
  if (v && !draft.apps.list.includes(v)) { draft.apps.list.push(v); markDirty(); renderSettings(); }
  $("appInput").value = "";
};
$("appInput").onkeydown = (e) => { if (e.key === "Enter") $("appAdd").click(); };
$("webList").oninput = () => {
  draft.web.list = $("webList").value.split("\n").map((s) => s.trim()).filter(Boolean); markDirty();
};

$("addSched").onclick = () => {
  draft.schedules.push({ name: "", days: [0, 1, 2, 3, 4], start: "09:00", end: "12:00", apps: true, web: true, enabled: true });
  markDirty(); renderSchedules();
};

$("saveBtn").onclick = async () => {
  const body = JSON.parse(JSON.stringify(draft));
  if (S.active.active) {
    const pw = await askPassword("ブロック中の変更にはパスワードが必要です");
    if (pw === null) return;
    body.password = pw;
  }
  try {
    S = await api("/api/settings", body);
    dirty = false; $("dirty").textContent = ""; draft = null; toast("保存しました"); refresh();
  } catch (e) { toast(e.message); }
};

$("chPwBtn").onclick = async () => {
  try {
    await api("/api/password", { old: $("oldPw").value, new: $("newPw").value });
    $("oldPw").value = $("newPw").value = ""; toast("パスワードを変更しました");
  } catch (e) { toast(e.message); }
};

api("/api/apps").then((j) => {
  $("appOptions").innerHTML = j.apps.map((a) => `<option value="${a.replace(/"/g, "&quot;")}">`).join("");
}).catch(() => {});

renderDurations();
refresh();
setInterval(() => { if (S) renderStatus(); }, 1000);
setInterval(refresh, 5000);
</script>
</body>
</html>
