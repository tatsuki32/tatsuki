<title>Tatsuki's Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Design rules: memory/semantic/patterns/design-nondesigner.md (from "The Non-Designer's Design Book").
   Proximity: space steps 4/8/16/24/40, inside < between items < between sections. Alignment: one left line, numbers on the right.
   Repetition: one card, one heading, one status mark everywhere. Contrast: type 12/14/16/20/28, weight 400/700 only, one focal point per view.
   Gold is warm and comes forward, so it marks only: where you are, the focal point, the primary button, outside links. */
:root{
  --bg:#0b0b0c; --rail:#0f0f11; --surface:#151517; --surface-2:#1e1e21; --line:#2a2a2e; --line-2:#3c3c42;
  --ink:#ececee; --ink-2:#b6b6bc; --muted:#8a8a93;
  --accent:#e2b866; --accent-2:#9c7d45; --accent-soft:rgba(226,184,102,.10); --accent-ink:#1a1408;
  --red:#f0806f; --red-soft:rgba(240,128,111,.12); --green:#82d09d; --green-soft:rgba(130,208,157,.12); --blue:#93b6ff; --blue-soft:rgba(147,182,255,.12);
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:var(--font); --code:ui-monospace,Menlo,monospace;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:40px;
  --t1:12px; --t2:14px; --t3:16px; --t4:20px; --t5:28px;
  --r:12px; --r-s:8px;
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v5:#d55181; --v6:#9085e9; --v7:#7d7d86; --v8:#b6b6bc;
  --tabbar:0px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:var(--t2);line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
b,strong{font-weight:700}
p,li{text-wrap:pretty}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
kbd{font-family:var(--font);font-size:var(--t1);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--muted);background:transparent}

/* ---------- frame: rail (menu) + one content column ---------- */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:var(--s4) var(--s3);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s4);padding-left:max(var(--s3),env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s2);text-decoration:none}
.brand .mark{font-size:20px;line-height:1}
.brand b{font-size:var(--t2)}
.qbox{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s2) 0 10px;height:36px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.qbox:focus-within{border-color:var(--line-2)}
.qbox input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:none;color:var(--ink);font:inherit;font-size:var(--t2)}
.qbox input::placeholder{color:var(--muted)}
.qbox .e{color:var(--muted);font-size:var(--t1)}
.nav{display:grid;gap:2px}
.nav .gh{margin:var(--s4) var(--s2) var(--s1);font-size:var(--t1);color:var(--muted)}
.nav .gh:first-child{margin-top:0}
.nav a{display:flex;align-items:center;gap:10px;padding:6px var(--s2);font-size:var(--t2);border-radius:var(--r-s);text-decoration:none;color:var(--ink-2)}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav .e{width:20px;text-align:center;font-size:16px}
.count{margin-left:auto;font-size:var(--t1);color:var(--muted);font-weight:400}
.count.hot{color:var(--red);font-weight:700}
.rail .foot{margin-top:auto;display:grid;gap:var(--s2)}
.rail .foot .hint{font-size:var(--t1);color:var(--muted);padding:0 var(--s2);margin:var(--s1) 0 0}
.railbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px var(--s2);border:1px solid var(--line);border-radius:var(--r-s);background:transparent;cursor:pointer;font-size:var(--t2);color:var(--ink-2);text-align:left}
.railbtn:hover{border-color:var(--line-2);color:var(--ink)}
.railbtn kbd{margin-left:auto}
.railbtn .e{width:20px;text-align:center;font-size:16px}
#tabs{display:none}
main{min-width:0;padding:var(--s5) max(var(--s4),env(safe-area-inset-right,0px)) 80px max(var(--s4),env(safe-area-inset-left,0px))}
.wrap{max-width:960px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s4)}

/* ---------- one heading per view, one card, one section title (repetition) ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.eyebrow{font-size:var(--t1);color:var(--muted);margin:0 0 var(--s1)}
.eyebrow a{color:inherit;text-decoration:none}
h1{font-size:var(--t5);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:var(--t3);font-weight:700;margin:0;line-height:1.4}
h3{font-weight:700}
.sub{color:var(--muted);font-size:var(--t1);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.section-title{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s2);color:var(--ink);font-size:var(--t2);font-weight:700}
.section-title .e{font-size:16px}
.section-title a{margin-left:auto;font-weight:400;font-size:var(--t1);color:var(--muted);text-decoration:none}
.section-title a:hover{color:var(--ink)}
/* a card's own header: title, a quiet note, one action at the right */
.dhead{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;padding:var(--s3) var(--s3) var(--s2)}
.dhead h2 .e{margin-right:6px}
.dhead .sub{flex:1 1 12em;min-width:0}
.dhead .btn,.dhead .more{margin-left:auto}
.more{font-size:var(--t1);color:var(--muted);text-decoration:none;white-space:nowrap}
.more:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.empty{padding:var(--s4) var(--s3);color:var(--muted);text-align:left}
.empty b{display:block;color:var(--ink);font-size:var(--t3);margin-bottom:var(--s1)}

/* ---------- buttons, marks, chips ---------- */
.btn{border:1px solid var(--line-2);background:transparent;border-radius:var(--r-s);min-height:36px;padding:0 var(--s3);font-size:var(--t2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-2);background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:#ecc67c}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:32px;padding:0 12px;font-size:var(--t1)}
.btn kbd{border-color:currentColor;color:inherit;opacity:.7}
.ibtn{border:1px solid transparent;background:transparent;border-radius:var(--r-s);min-width:36px;min-height:36px;padding:0 6px;cursor:pointer;font-size:15px;color:var(--ink-2)}
.ibtn:hover{background:var(--surface-2);border-color:var(--line)}
/* one status mark everywhere: neutral by default, green = in progress / done, red = needs action / overdue */
.pill,.dl,.until,.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--t1);line-height:1.5;padding:1px var(--s2);border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent;white-space:nowrap;font-weight:400}
.pill.live{color:var(--green);background:var(--green-soft)}
.pill.red{color:var(--red);background:var(--red-soft)}
.pill.amber{color:var(--ink);border-color:var(--line-2);background:transparent}
.pill.blue{color:var(--blue);background:var(--blue-soft)}
.dl.warn{color:var(--ink);font-weight:700}
.dl.hot,.dl.over{color:var(--red);background:var(--red-soft)}
.dl.over{font-weight:700}
.until{color:var(--ink);font-weight:700}
.badge{min-width:24px;justify-content:center}
.badge.zero{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;min-height:32px;padding:0 14px;font-size:var(--t2);color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.gchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:var(--t1);color:var(--ink-2);text-decoration:none;cursor:pointer}
.gchip:hover{color:var(--ink)}
select{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-s);min-height:32px;padding:0 var(--s2);font:inherit;font-size:var(--t1)}
.msg{font-size:var(--t2);color:var(--ink-2)}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.done-card{opacity:.6}
.due{font-size:var(--t1);color:var(--muted)}
.duebtn{border:0;background:transparent;color:var(--ink-2);font-size:var(--t1);cursor:pointer;padding:0;text-decoration:underline dotted;text-underline-offset:3px}
.duebtn:hover{color:var(--ink)}
.tt{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:var(--t2);line-height:1.5;cursor:pointer;overflow-wrap:anywhere;color:var(--ink)}
.tt:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- home ---------- */
/* the focal point: today's three. The first one is the biggest thing on the page. */
.t3{border-color:rgba(226,184,102,.32)}
.t3row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s1) var(--s2);padding:var(--s3);border-top:1px solid var(--line)}
.t3row:first-child{border-top:0}
.t3n{font-size:var(--t3);font-weight:700;color:var(--muted);line-height:1.5}
.t3row .tt{font-size:var(--t3)}
.t3row.first{padding:var(--s4) var(--s3) var(--s3)}
.t3row.first .t3n{font-size:var(--t4);color:var(--accent);line-height:1.4}
.t3row.first .tt{font-size:var(--t4);line-height:1.4}
.t3acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);align-items:start}
@media (max-width:900px){.duo{grid-template-columns:minmax(0,1fr)}}
.hchips{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 var(--s3) var(--s3)}
.hchip{border:1px solid var(--line-2);background:transparent;border-radius:999px;min-height:36px;padding:0 14px;font-size:var(--t2);cursor:pointer;color:var(--ink-2)}
.hchip.on{background:var(--green-soft);border-color:transparent;color:var(--green);font-weight:700}
/* rows inside a card: one line between rows, nothing around them */
.drow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px var(--s3);border-top:1px solid var(--line)}
.dhead+div>.drow:first-child{border-top:0}
.drow .e{font-size:14px;text-align:center}
.dacts{display:flex;align-items:center;gap:var(--s2);justify-content:flex-end;flex-wrap:wrap}
.dmore{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px var(--s3);color:var(--ink-2);font-size:var(--t1);cursor:pointer;text-align:left;border-radius:0 0 var(--r) var(--r)}
.dmore:hover{background:var(--surface-2);color:var(--ink)}
.dlbox{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:6px}
@media (max-width:560px){.drow{grid-template-columns:20px minmax(0,1fr)}.drow .dl,.drow .dacts{grid-column:2;justify-self:start}}
.tsel{font-size:var(--t1)}
.tsel.doing{border-color:var(--green);color:var(--green)}
/* what came in: a list with the counts on one right-hand line */
.irow{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 var(--s3);border-top:1px solid var(--line);text-decoration:none;color:var(--ink);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font-size:var(--t2);text-align:left}
.irow:first-child{border-top:0}
.irow:hover{background:var(--surface-2)}
.irow .e{width:20px;text-align:center}
.irow .n{margin-left:auto;font-weight:700}
.irow .n.hot{color:var(--red)}
.irow .n.zero{color:var(--muted);font-weight:400}
.irow .s{color:var(--muted);font-size:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.inflow{overflow:hidden}
.digest{border-top:1px solid var(--line)}
.digest summary{list-style:none}
.digest summary::-webkit-details-marker{display:none}
.digest summary.irow{border-top:0}
.digest ol{margin:0;padding:0 var(--s3) var(--s3) 46px;display:grid;gap:6px}
.digest li{color:var(--muted);font-size:var(--t1)}
.digest .tt{font-weight:400}
/* tools */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s2)}
.tile{display:grid;grid-template-columns:32px minmax(0,1fr);gap:2px 12px;align-items:start;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--line-2);background:var(--surface-2)}
.tile .ico{grid-row:span 2;width:32px;height:32px;border-radius:var(--r-s);background:var(--surface-2);display:grid;place-items:center;font-size:17px}
.tile .t{font-weight:700;font-size:var(--t2);line-height:1.4;min-width:0;text-decoration:none}
.tile a.t:hover{text-decoration:underline}
.tile .d{font-size:var(--t1);color:var(--muted);line-height:1.5;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s1)}
.tiles.mini{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tiles.mini .tile{grid-template-columns:24px minmax(0,1fr);padding:10px 12px;align-items:center}
.tiles.mini .tile .ico{grid-row:auto;width:24px;height:24px;background:none;font-size:16px}
.tiles.mini .tile .d,.tiles.mini .tile .meta{display:none}
.tilewrap{position:relative;display:grid;min-width:0}
.tilewrap .tile{padding-right:48px}
.tilewrap .tedit{position:absolute;top:6px;right:6px}
/* pinned memos: the same card as everything else */
.notes-here{display:grid;gap:var(--s2)}
.note{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px var(--s3);border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note .when{font-size:var(--t1);color:var(--muted);margin-top:var(--s1)}
.note.done p{color:var(--muted);text-decoration:line-through}
.note .acts{display:flex;gap:2px}

/* ---------- reading views: news, minor countries, mail. Body 16px, about 40 Japanese characters a line. ---------- */
.lead{padding:var(--s4) var(--s3)}
.lead h2{font-size:var(--t4);line-height:1.45;margin:0 0 var(--s2);text-wrap:balance}
.lead p{margin:0;color:var(--ink-2);font-size:var(--t3);line-height:1.75;max-width:40em}
.lead p.eyebrow{margin:0 0 var(--s2);font-size:var(--t1);color:var(--muted);line-height:1.6}
.world{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--s4);align-items:start}
@media (max-width:1040px){.world{grid-template-columns:minmax(0,1fr)}}
.stories{display:grid}
.story{display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 12px;padding:var(--s4) var(--s3);border-top:1px solid var(--line);scroll-margin-top:72px}
.story:first-child{border-top:0}
.story .e{font-size:18px;line-height:1.5}
.story h3{margin:0;font-size:var(--t3);line-height:1.6;text-wrap:balance}
.story p{margin:var(--s2) 0 0;color:var(--ink-2);font-size:var(--t3);line-height:1.75;max-width:40em}
.story.flash{background:var(--accent-soft);transition:background 2s}
.lens{margin-top:12px;padding-left:12px;border-left:2px solid var(--line-2);font-size:var(--t2);color:var(--ink-2);max-width:40em}
.lens b{color:var(--ink)}
.srcs{margin-top:12px;display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3)}
.srcs a,a.ext,.md a,.jobs a{color:var(--accent);text-decoration:none}
.srcs a{font-size:var(--t1)}
.srcs a:hover,a.ext:hover,.md a:hover{text-decoration:underline}
.side{display:grid;gap:var(--s3)}
.side .card{padding:var(--s3)}
.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:var(--s3)}
.list .o{font-size:var(--t1);color:var(--muted);display:block}
.list a{text-decoration:none;font-weight:700;font-size:var(--t2);line-height:1.5;display:block}
.list a:hover{text-decoration:underline}
.watch li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s2);font-size:var(--t2)}
.watch time{font-size:var(--t1);color:var(--muted)}
.md{padding:var(--s4) var(--s3);font-size:var(--t3);line-height:1.75}
.md>*{max-width:40em}
.md h2,.md h3{font-size:var(--t4);margin:var(--s5) 0 var(--s2);line-height:1.45;color:var(--ink)}
.md>:first-child{margin-top:0}
.md h4,.md h5{font-size:var(--t3);margin:var(--s4) 0 var(--s1);color:var(--ink)}
.md p{margin:var(--s2) 0;color:var(--ink-2)}
.md ul,.md ol{margin:var(--s2) 0;padding-left:1.5em;display:grid;gap:var(--s1);color:var(--ink-2)}
.md b{color:var(--ink)}
.md a{overflow-wrap:anywhere}
.md hr{border:0;border-top:1px solid var(--line);margin:var(--s4) 0}
.md blockquote{margin:var(--s2) 0;padding-left:12px;border-left:2px solid var(--line-2);color:var(--muted)}
.md code{font-family:var(--code);font-size:var(--t1);background:var(--surface-2);padding:0 4px;border-radius:4px}
.mail{padding:var(--s3);display:grid;gap:var(--s2)}
.mail .top{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;font-size:var(--t1);color:var(--muted)}
.mail .top .dl{margin-left:auto}
.mail h3{margin:var(--s1) 0 0;font-size:var(--t3);line-height:1.5;overflow-wrap:anywhere}
.mail p{margin:0;color:var(--ink-2);font-size:var(--t3);line-height:1.75;max-width:40em}
.todo{padding-left:12px;border-left:3px solid var(--red);color:var(--ink);font-size:var(--t2)}
details.draft{border-top:1px solid var(--line);margin-top:var(--s2);padding-top:var(--s2)}
details.draft summary{cursor:pointer;list-style:none;padding:var(--s2) 0;font-size:var(--t2);font-weight:700;display:flex;justify-content:space-between;gap:var(--s2)}
details.draft summary::-webkit-details-marker{display:none}
.draft .meta{font-size:var(--t1);color:var(--muted);overflow-wrap:anywhere}
.draft pre{margin:0;padding:var(--s2) 0;font-family:var(--font);font-size:var(--t3);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;max-width:40em}
details.draft .sent-as summary{cursor:pointer;display:block;padding:var(--s2) 0;font-size:var(--t1);font-weight:400;color:var(--muted)}
.sent-as pre{color:var(--ink-2)}

/* ---------- tasks: three columns, no box around a column (space separates them) ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);align-items:start}
.col{border-radius:var(--r);display:grid;gap:var(--s3);align-content:start;min-height:140px;padding:var(--s1);margin:calc(-1 * var(--s1));transition:background .15s}
.col.over{background:var(--accent-soft)}
.col>h2{display:flex;align-items:baseline;gap:var(--s2);padding:0 var(--s1) var(--s1)}
.col .hint{margin:0 var(--s1);font-size:var(--t1);color:var(--muted)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:var(--s2);cursor:grab}
.task:hover{border-color:var(--line-2)}
.task.dragging{opacity:.4}
.task.closed .tt{color:var(--muted)}

/* Real due date: manual fix > dueAt from the morning mail check > received/created + 3 days.
   Countdowns run to the real due date; colour warns 2 days (gold) and 1 day (red) ahead. */
const HOUR=36e5, DAY=864e5, LEAD=0, DEFAULT_DUE=3*DAY, HCMC=7*HOUR;
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const toMs=v=>v==null||v===""?null:typeof v==="number"?v:(t=>isNaN(t)?null:t)(Date.parse(v));
function parseReceived(str,dayId){ // "Oct 28, 5:06 AM" written in Ho Chi Minh City time
  const end=Date.parse((dayId||"")+"T23:59:59+07:00");
  let mo,dd,h=0,mi=0;
  const j=/(\d{1,2})月\s*(\d{1,2})日(?:[^\d]*?(午前|午後)?\s*(\d{1,2}):(\d{2}))?/.exec(str||""); // "11月2日 5:06" (Japanese, 24h or 午前/午後)
  const m=/([A-Z][a-z]{2})\s+(\d{1,2})(?:,\s*(\d{1,2}):(\d{2})\s*(AM|PM))?/.exec(str||"");
  if(j){mo=+j[1]-1;dd=+j[2];if(j[4]){h=+j[4];mi=+j[5];if(j[3]==="午後"&&h<12)h+=12;if(j[3]==="午前"&&h===12)h=0}}
  else if(m&&m[1] in MON){mo=MON[m[1]];dd=+m[2];if(m[3]){h=(+m[3]%12)+(m[5]==="PM"?12:0);mi=+m[4]}}
  else return isNaN(end)?Date.now():end-DAY+1000;
  let y=+(dayId||"").slice(0,4)||new Date().getFullYear();
  let t=Date.UTC(y,mo,dd,h,mi)-HCMC;
  if(!isNaN(end)&&t>end+DAY) t=Date.UTC(y-1,mo,dd,h,mi)-HCMC; // a December mail checked in January
  return t;
}
const mailUid=(i,dayId)=>"mail:"+(i.gmail_url||(dayId+"/"+i.key));
const NEEDS=new Set(["Action needed","Reply drafted"]);
function deadlines(){
  const byUid=new Map(), closed=new Set();
  S.days.forEach(d=>(d.data?.items||[]).forEach(i=>{ // newest day first
    if(!NEEDS.has(i.priority)) return;
    const uid=mailUid(i,d.id);
    if((i.status||"pending")!=="pending"){closed.add(uid);return}
    if(byUid.has(uid)) return;
    byUid.set(uid,{uid,kind:"mail",title:i.subject_ja||i.subject||"（件名なし）",sub:i.from||"",sum:i.summary||"",day:d.id,key:i.key,
      base:toMs(i.receivedAt)??parseReceived(i.received,d.id),auto:toMs(i.dueAt),manual:toMs(S.dues[uid]?.at)});
  }));
  const list=[...byUid.values()].filter(x=>!closed.has(x.uid));
  // Notes (Inbox or pinned) never become deadlines: only mail that needs action does.
  list.forEach(x=>{x.due=x.manual??x.auto??(x.base+DEFAULT_DUE);x.src=x.manual!=null?"手動":x.auto!=null?"メール記載":(x.kind==="mail"?"受信":"作成")+"から3日";x.deadline=x.due-LEAD});
  return list.sort((a,b)=>a.deadline-b.deadline);
}

  return (ms<0?"超過 ":"")+(d?d+"日 ":"")+pad(h)+":"+pad(m)+":"+pad(s);
}

let actx=null, chimeOwed=false, lastChime=0;
function unlockAudio(){
  if(actx) return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){actx=null;return}
  const b=$("#soundBtn");if(b)b.hidden=true;
  if(chimeOwed){chimeOwed=false;setTimeout(chime,60)}
}
["pointerdown","keydown","touchstart"].forEach(t=>document.addEventListener(t,unlockAudio,{capture:true,passive:true}));
function chime(){
  if(S.mute) return;
  if(!actx||actx.state!=="running"){chimeOwed=true;return}
  if(Date.now()-lastChime<3000) return; lastChime=Date.now();
  const t0=actx.currentTime;
  [[880,0],[1318.5,.14]].forEach(([f,d])=>{const o=actx.createOscillator(),v=actx.createGain();o.type="sine";o.frequency.value=f;
    v.gain.setValueAtTime(0,t0+d);v.gain.linearRampToValueAtTime(.22,t0+d+.015);v.gain.exponentialRampToValueAtTime(.0001,t0+d+.9);
    o.connect(v).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.95)});
}

/* ---------- tasks ---------- */
/* One board for everything to do. Stored tasks live in "tasks" (Mac: data/tasks.json).
   Mail that needs action appears by itself and is only stored once you move it, under the same id everywhere ("t"+dueDocId).
   A task's due date is the real one; like mail, its countdown runs to it. */
const TSTATUS=[["notyet","未着手"],["doing","進行中"],["done","完了"],["paused","一旦中止"],["archived","アーカイブ"]];
const TCOLS=["notyet","doing","done"], TSHELF=["paused","archived"], TOPEN=new Set(["notyet","doing"]);
const TSRC={manual:["✍️","手入力"],memo:["📝","メモから"],mail:["✉️","メールから"],calendar:["📅","カレンダーから"],gtasks:["☑️","Googleタスク"],claude:["🤖","Claude"],daily:["☀️","毎日"]};
const LINKED=new Set(["mail","calendar","gtasks","claude","daily"]); // these come from elsewhere: their title and due date live at the source
const tLabel=k=>(TSTATUS.find(s=>s[0]===k)||[k,k])[1];
const mailTaskId=uid=>"t"+dueDocId(uid);
const newTaskId=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const taskRecord=t=>({id:t.id,title:t.title,status:t.status||"notyet",source:t.source||"manual",sourceRef:t.sourceRef||"",due:LINKED.has(t.source)?null:(t.due??null),note:t.note||"",planDate:t.planDate||null,planAi:t.planAi||null,estMin:t.estMin??null,estAi:t.estAi??null,...(t.clear?{clear:t.clear}:{}),createdAt:t.createdAt||Date.now(),deleted:!!t.deleted});
const byDeadline=(a,b)=>(a.deadline??Infinity)-(b.deadline??Infinity)||(b.createdAt||0)-(a.createdAt||0);
const withDeadline=t=>({...t,deadline:t.due!=null?t.due-LEAD:null});
/* Calendar events whose title starts with a mark become tasks: "TODO 書類を送る", "【やる】…", "☑ …" */
const MARK=/^\s*(?:TODO|【やる】|☑️?)\s*[:：]?\s*/i;
function linkedTasks(){
  const out=[];
  calEvents().forEach(e=>{const m=MARK.exec(e.title);if(m)out.push({id:"tc"+e.id,title:e.title.slice(m[0].length)||e.title,source:"calendar",sourceRef:e.id,
    due:e.allDay?e.endMs-6e4:e.startMs,url:e.url,createdAt:e.startMs})});
  (S.gtasks?.tasks||[]).forEach(g=>{if(!g.id||!g.title)return;out.push({id:"tg"+g.id,title:g.title,note:g.notes||"",source:"gtasks",sourceRef:g.id,
    due:g.due?Date.parse(g.due.slice(0,10)+"T23:59:00"):null,gdone:g.status==="completed",url:"https://tasks.google.com/",createdAt:Date.parse(g.updated)||0})});
  // every day: one job-hunting task for today (Ho Chi Minh City date). It is stored only once its status or note changes,
  // so a day you never touched does not pile up.
  const day=hcmcDate();
  out.push({id:"daily-jobs-"+day,title:"今日のJOINS・Skill Shift求人チェック",source:"daily",sourceRef:"jobs",kind:"jobs",
    due:Date.parse(day+"T23:59:00+07:00"),createdAt:Date.parse(day+"T00:00:00+07:00")});
  // what Claude left pending in the latest daily report; the report keeps the same key while an item stays open
  const r=S.reports[0];
  (r?.pending||[]).forEach(p=>{if(!p.key||!p.text)return;out.push({id:"tr"+String(p.key).replace(/[^\w-]/g,"_").slice(0,80),title:p.text,note:p.detail||"",source:"claude",sourceRef:p.key,
    due:null,url:okUrl(p.link)?p.link:"#log",createdAt:Date.parse(r.date+"T07:00:00")||0})});
  return out;
}
function boardTasks(mails){
  const byUid=Object.fromEntries(mails.map(x=>[x.uid,x])), linked=Object.fromEntries(linkedTasks().map(x=>[x.id,x]));
  const out=S.tasks.filter(t=>!t.deleted).map(t=>{
    const x=t.source==="mail"?byUid[t.sourceRef]:null, l=linked[t.id];
    if(x) return {...t,mail:x,due:x.due,deadline:x.deadline};
    // completed in Google Tasks wins over an open status on the desk
    if(l) return withDeadline({...l,...t,due:l.due,url:l.url,gdone:l.gdone,status:l.gdone&&TOPEN.has(t.status)?"done":t.status});
    return withDeadline(t);
  });
  const stored=new Set(out.map(t=>t.id));
  mails.forEach(x=>{const id=mailTaskId(x.uid);if(!stored.has(id))out.push({id,title:x.title,status:"notyet",source:"mail",sourceRef:x.uid,mail:x,due:x.due,deadline:x.deadline,createdAt:x.base})});
  Object.values(linked).forEach(l=>{if(!stored.has(l.id))out.push(withDeadline({...l,status:l.gdone?"done":"notyet"}))});
  return out;
}

/* A finished task is stored once as "task-<id>"; moving it back to not-yet / doing removes it. Old finished tasks count from their last change. */
const winId=s=>String(s).replace(/[^\w-]/g,"_").slice(0,140);
const hcmcDay=ms=>new Date(ms+HCMC).toISOString().slice(0,10);
async function taskWin(t,status){
  const id=winId("task-"+t.id), had=S.wins.find(w=>w.id===id), was=t.status||"notyet";
  if(status==="done"&&!had) return store.putWin({id,kind:t.source==="mail"?"mail":"task",title:t.title,sub:t.mail?.sub||"",ref:t.id});
  if(TOPEN.has(status)&&had) return store.putWin({...had,deleted:true});
  if(was==="done"&&!TOPEN.has(status)&&!had){const at=t.updatedAt||t.createdAt||Date.now();return store.putWin({id,kind:t.source==="mail"?"mail":"task",title:t.title,sub:t.mail?.sub||"",ref:t.id,at,date:hcmcDay(at)})}
}

function askText(title,label,value,maxLen){
  return new Promise(res=>{
    if($("#modal").firstChild) return res(null);
    $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="pop" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="top"><h2>${esc(title)}</h2><button class="ibtn" id="xAsk" aria-label="閉じる">✕</button></div>
      <label class="sub" for="askInput">${esc(label)}</label>

      <div class="row"><button class="btn primary" id="askOk">決定</button><button class="btn" id="askCancel">やめる</button></div>
    </div></div>`;
    const inp=$("#askInput"), done=v=>{$("#modal").innerHTML="";res(v)};
    inp.focus();inp.select();
    $("#askOk").onclick=()=>done(inp.value);$("#askCancel").onclick=()=>done(null);$("#xAsk").onclick=()=>done(null);
    $("#scrim").onclick=e=>{if(e.target.id==="scrim")done(null)};

  });
}

/* Claude's hourly task writes the next 7 days of the main Google Calendar (title, time, place, link only).
   All-day events come as dates: read them as local days, end exclusive. */
const startOfDay=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()};
const dayStart=(base,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);return d.getTime()};
const fmtTime=ms=>new Date(ms).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
function calEvents(){
  const ms=(v,allDay)=>allDay?Date.parse(String(v).slice(0,10)+"T00:00:00"):Date.parse(v);
  return (S.cal?.events||[]).map(e=>({...e,startMs:ms(e.start,e.allDay),endMs:ms(e.end,e.allDay)}))
    .filter(e=>!isNaN(e.startMs)&&!isNaN(e.endMs)).sort((a,b)=>(b.allDay-a.allDay)||a.startMs-b.startMs);
}
function untilText(ms){const a=Math.max(0,ms),h=Math.floor(a/HOUR),m=Math.floor(a%HOUR/6e4),s=Math.floor(a%6e4/1e3);return "あと "+(h?h+":"+pad(m):m)+":"+pad(s)}
const untilChip=ms=>`<span class="until" data-until="${ms}">${untilText(ms-Date.now())}</span>`;
function evRow(e,ds,win){
  const now=Date.now(), de=dayStart(ds,1);
  const time=e.allDay?"終日":(e.startMs<ds?"〜":fmtTime(e.startMs)+"–")+(e.endMs>de?"":fmtTime(e.endMs));
  const state=!e.allDay&&e.endMs<=now?"past":!e.allDay&&e.startMs<=now?"now":"";
  const tail=MARK.test(e.title)?`<span class="pill amber">タスク</span>`:state==="now"?`<span class="pill live">進行中</span>`:"";
  const inner=`<time>${esc(time)}</time><span class="t">${esc(e.title)}</span>${tail}${e.location?`<span class="loc">📍 ${esc(e.location)}</span>`:""}`;
  const row=okUrl(e.url)?`<a class="ev ${state}" href="${esc(e.url)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="ev ${state}">${inner}</div>`;
  if(!(win&&state==="past"&&!MARK.test(e.title))) return row;
  return `<div class="evwrap">${row}${S.wins.some(w=>w.id===evWinId(e))?`<span class="sub evdone">✓ できた</span>`:`<button class="btn sm" data-winev="${esc(e.id)}">できた</button>`}</div>`;
}
function todayEvents(){
  const now=Date.now(), d0=startOfDay(now), d1=dayStart(d0,1);
  if(!S.cal) return `<section class="card dpanel" aria-label="次の予定"><div class="dhead"><h2><span class="e">📅</span>次の予定</h2></div><div class="empty">予定がまだ届いていません。</div></section>`;
  const list=calEvents().filter(e=>e.endMs>now&&e.startMs<d1), next=list.find(e=>!e.allDay&&e.startMs>now);
  return `<section class="card dpanel" aria-label="次の予定">
    <div class="dhead"><h2><span class="e">📅</span>次の予定</h2>${next?untilChip(next.startMs):`<span class="sub">このあと時間の決まった予定はありません</span>`}<a class="more" href="#calendar">7日間 →</a></div>
    ${list.length?list.slice(0,3).map(e=>evRow(e,d0)).join(""):`<div class="empty">今日の残りの予定はありません。</div>`}
  </section>`;
}
function calendar(){
  const head=`<header class="head"><div><p class="eyebrow">カレンダー${S.cal?.generated_at?" · 更新 "+esc(S.cal.generated_at):""}</p><h1>これから7日間</h1></div><a class="btn" href="https://calendar.google.com/" target="_blank" rel="noopener">Googleカレンダー ↗</a></header>`;
  if(!S.cal) return head+`<div class="card empty"><b>予定がまだ届いていません</b>Claude が1時間ごとに Google カレンダーから読み込みます。</div>`;
  const d0=startOfDay(Date.now()), evs=calEvents();
  const days=[0,1,2,3,4,5,6].map(i=>{const ds=dayStart(d0,i), de=dayStart(d0,i+1), list=evs.filter(e=>e.startMs<de&&e.endMs>ds);
    const label=new Date(ds).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"});
    return `<section class="card day ${i===0?"is-today":""}"><h2>${esc(label)}<span class="sub">${i===0?"今日":i===1?"明日":""}${list.length?" · "+list.length+"件":""}</span></h2>${list.map(e=>evRow(e,ds,i===0)).join("")||`<div class="ev"><time>—</time><span class="t" style="color:var(--muted);font-weight:500">予定なし</span></div>`}</section>`});
  return head+notesHere("calendar")+`<p class="sub" style="margin:0">タイトルを「TODO」「【やる】」「☑」で始めた予定は、自動で「タスク」に入ります。</p><div class="days">${days.join("")}</div>`;
}

}

/* ---------- minor countries watch ---------- */
/* Each issue is written by the Tue/Fri scheduled task into "watch" (doc id = date) as Markdown; the Google Doc stays the archive. */
function md(src){ // small, safe Markdown: headings, lists, quotes, rules, **bold**, *italic*, `code`, [text](https://…), bare https links
  const inline=t=>esc(t).replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,(m,a,u)=>`<a href="${u}" target="_blank" rel="noopener">${a}</a>`)
    .replace(/(^|[\s（(])(https:\/\/[^\s<）)]+)/g,(m,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const out=[];let list=null;
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const raw of String(src||"").split("\n")){
    const l=raw.replace(/\s+$/,"");let m;
    if(!l.trim()){close();continue}
    if(m=/^(#{1,4})\s+(.*)$/.exec(l)){close();const n=Math.min(m[1].length+1,5);out.push(`<h${n}>${inline(m[2])}</h${n}>`);continue}
    if(/^(-{3,}|\*{3,}|━+)$/.test(l.trim())){close();out.push("<hr>");continue}
    if(m=/^\s*[-*・]\s+(.*)$/.exec(l)){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push(`<li>${inline(m[1])}</li>`);continue}
    if(m=/^\s*\d+[.)]\s+(.*)$/.exec(l)){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push(`<li>${inline(m[1])}</li>`);continue}
    if(m=/^>\s?(.*)$/.exec(l)){close();out.push(`<blockquote>${inline(m[1])}</blockquote>`);continue}
    close();out.push(`<p>${inline(l)}</p>`);
  }
  close();return out.join("");
}
function watch(){
  const head=x=>`<header class="head"><div><p class="eyebrow">マイナー国ウォッチ${x?" · "+esc(x.date||x.id):""}</p><h1>${x?esc(x.title||"マイナー国ウォッチ"):"マイナー国ウォッチ"}</h1></div>${S.watch.length>1?`<label class="sub">号 <select id="watchNo">${S.watch.map(w=>`<option value="${esc(w.id)}" ${w.id===x?.id?"selected":""}>${esc(w.date||w.id)}${w.no?" 第"+esc(w.no)+"号":""}</option>`).join("")}</select></label>`:""}</header>`;
  const x=S.watch.find(w=>w.id===S.watchId)||S.watch[0];
  if(!x) return head(null)+`<div class="card empty"><b>まだ号がありません</b>毎週火曜と金曜の朝に、バルカン・コーカサス・中央アジア・南米内陸・南アジア・東南アジアから2地域ずつ届きます。</div>`;
  return head(x)+notesHere("watch")+`${(x.regions||[]).length?`<div class="chips">${x.regions.map(r=>`<span class="pill">${esc(r)}</span>`).join("")}</div>`:""}
  <article class="card md" data-src="${esc(x.docUrl||"")}" data-srclabel="マイナー国ウォッチ ${esc(x.date||"")}">${md(x.body)}</article>
  ${okUrl(x.docUrl)?`<p class="sub"><a href="${esc(x.docUrl)}" target="_blank" rel="noopener">Googleドキュメントで開く ↗</a></p>`:""}`;
}

/* ---------- notes: Scrapbox-style pages linked with [words] ---------- */
/* Stored in "notes" (Mac: data/notes.json), synced both ways like memos. [Title] links a note (a missing one is made on click),
   [https://… label] links out. The same brackets work in memos and task notes. Backlinks are counted from the text, never stored. */
const noteList=()=>S.wnotes.filter(n=>!n.deleted);
const normTitle=t=>String(t||"").normalize("NFKC").trim().toLowerCase();
const noteByTitle=t=>noteList().find(n=>normTitle(n.title)===normTitle(t));
const newNoteId=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* inline text with [links]; external links open in a new tab */
function wikiInline(raw){
  return String(raw||"").split(/(\[[^\[\]\n]+\])/g).map(part=>{
    const m=/^\[([^\[\]\n]+)\]$/.exec(part); if(!m) return esc(part);
    const inner=m[1].trim();
    if(/^https:\/\//.test(inner)){const [,url,label]=/^(\S+)(?:\s+(.+))?$/.exec(inner);return `<a class="ext" href="${esc(url)}" target="_blank" rel="noopener">${esc(label||url)} ↗</a>`}
    return wlink(inner);
  }).join("");
}
/* a whole body: "# heading", "- bullet", blank lines; everything else a line */
function wikiBlock(raw){
  return String(raw||"").split("\n").map(l=>{let m;
    if(m=/^#{1,3}\s+(.*)$/.exec(l)) return `<h3>${wikiInline(m[1])}</h3>`;
    if(m=/^(\s*)[-・]\s+(.*)$/.exec(l)) return `<div class="li" style="margin-left:${Math.min(m[1].length,8)*6}px">${wikiInline(m[2])}</div>`;
    return l.trim()?`<div class="ln">${wikiInline(l)}</div>`:`<div class="ln gap"></div>`;
  }).join("");
}
const linksIn=raw=>[...String(raw||"").matchAll(/\[([^\[\]\n]+)\]/g)].map(m=>m[1].trim()).filter(t=>!/^https:\/\//.test(t));
/* Where each [word] is used: one count per note, memo, task note, or news article (a note whose body cites that article's URL).
   Recounted only when notes, memos or tasks change. */
const SRC_LINE=/^\s*出典[：:]/;
const hasContent=n=>String(n?.body||"").split("\n").some(l=>l.trim()&&!SRC_LINE.test(l));
let LS=null;
function linkStats(){
  if(LS&&LS.n===S.wnotes&&LS.m===S.memos&&LS.t===S.tasks) return LS;
  const count=new Map(), add=(raw,extra=[])=>new Set([...linksIn(raw),...extra].map(normTitle)).forEach(k=>count.set(k,(count.get(k)||0)+1));
  noteList().forEach(n=>{add(n.body);
    const urls=[...String(n.body||"").matchAll(/^\s*出典[：:]\s*\[(https:\/\/\S+)/gm)];if(urls.length)count.set(normTitle(n.title),(count.get(normTitle(n.title))||0)+urls.length)});
  S.memos.forEach(m=>add(m.text));S.tasks.filter(t=>!t.deleted).forEach(t=>add(t.note));
  return LS={n:S.wnotes,m:S.memos,t:S.tasks,count,byT:new Map(noteList().map(n=>[normTitle(n.title),n]))};
}
const linkUses=t=>linkStats().count.get(normTitle(t))||0;
const linkLone=t=>{const n=linkStats().byT.get(normTitle(t));return !hasContent(n)&&linkUses(t)<2&&!(n&&sentencesFor(n).length>=2)};
const wlink=t=>`<a class="wl${linkLone(t)?" lone":""}" href="#notes" data-wiki="${esc(t)}"${linkLone(t)?' title="まだどこにもつながっていません"':""}>${esc(t)}</a>`;
/* news and Minor Countries: words linked from an article show as links inside it (first match per note, per article) */
function linkSources(root){
  root.querySelectorAll("[data-src]").forEach(el=>{
    const url=el.dataset.src; if(!/^https:\/\//.test(url)) return;
    const titles=noteList().filter(n=>n.title&&String(n.body||"").includes("["+url)).map(n=>n.title).sort((a,b)=>b.length-a.length);
    titles.forEach(t=>{
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:x=>x.parentElement.closest("a,button,select,textarea,.wl")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
      let x;while(x=w.nextNode()){const i=x.data.toLowerCase().indexOf(t.toLowerCase());if(i<0)continue;
        const r=document.createRange();r.setStart(x,i);r.setEnd(x,i+t.length);
        const tpl=document.createElement("template");tpl.innerHTML=wlink(t);const link=tpl.content.firstChild;link.textContent=x.data.slice(i,i+t.length);
        r.deleteContents();r.insertNode(link);break}
    });
  });
}
/* auto-links: a note's title becomes a link wherever it shows on the page (task names, mail, calendar, buttons, menus…).
   Only the page is changed, never the data. Titles of 1 character, and notes switched off (noAuto), are left alone.
   Latin words match whole words only ("AI" is not found inside "MAIL"); case and full/half width don't matter. */
const AUTO_SKIP="script,style,textarea,input,select,option,svg,.wl,.ext,.selmenu,.inedit,#toastHost,.ntitle,.ncard,[contenteditable],[data-noauto]";
let AL={key:null,re:null};
const WORD_CH="A-Za-z0-9Ａ-Ｚａ-ｚ０-９";
function wordPat(t){
  const ch=c=>{const k=c.charCodeAt(0),e=c.replace(/[.*+?^${}()|[\]\\\/-]/g,"\\$&");return k>0x20&&k<0x7f&&c!==" "?`[${e}${String.fromCharCode(k+0xFEE0)}]`:/\s/.test(c)?"[\\s\\u3000]+":e};
  return (/^[A-Za-z0-9]/.test(t)?`(?<![${WORD_CH}])`:"")+[...t].map(ch).join("")+(/[A-Za-z0-9]$/.test(t)?`(?![${WORD_CH}])`:"");
}
// older Safari has no lookbehind: fall back to plain matching rather than break the page
function wordRe(alt,flags){try{return new RegExp(alt.join("|"),flags)}catch(e){return new RegExp(alt.map(a=>a.replace(/^\(\?<!\[[^\]]*\]\)/,"")).join("|"),flags)}}
function autoRe(){
  const titles=[...new Set(noteList().filter(n=>!n.noAuto).map(n=>String(n.title||"").normalize("NFKC").trim()).filter(t=>[...t].length>=2))].sort((a,b)=>b.length-a.length);
  const key=titles.map(t=>t+(linkLone(t)?"0":"1")).join("\n");
  if(AL.key===key) return AL;
  const alt=titles.map(wordPat), re=alt.length?wordRe(alt,"giu"):null;
  return AL={key,re};
}
function titleFor(found){const k=normTitle(found);return noteList().find(n=>normTitle(n.title)===k)?.title||found}
function autoLinkIn(root){
  const {re}=AL; if(!re||!root) return;
  const els=root.nodeType===3?[root]:[];
  if(root.nodeType===1){if(root.closest(AUTO_SKIP))return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:x=>!x.data.trim()||x.parentElement?.closest(AUTO_SKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    let x;while(x=w.nextNode())els.push(x)}
  else if(root.nodeType===3&&root.parentElement?.closest(AUTO_SKIP)) return;
  for(const x of els){
    re.lastIndex=0; if(!re.test(x.data)) continue; re.lastIndex=0;
    const frag=document.createDocumentFragment(); let last=0,m;
    const inBtn=!!x.parentElement?.closest("a,button,label,summary,.nav,#tabs");
    while(m=re.exec(x.data)){
      if(m.index>last) frag.append(x.data.slice(last,m.index));
      const t=titleFor(m[0]), lone=linkLone(t), el=document.createElement(inBtn?"span":"a");
      el.className="wl awl"+(lone?" lone":""); el.dataset.wiki=t; el.textContent=m[0];
      if(!inBtn) el.href="#notes"; if(lone) el.title="まだどこにもつながっていません";
      frag.append(el); last=m.index+m[0].length;
    }
    if(last<x.data.length) frag.append(x.data.slice(last));
    x.replaceWith(frag);
  }
}
function unAutoLink(){document.querySelectorAll(".awl").forEach(a=>a.replaceWith(document.createTextNode(a.textContent)));document.body.normalize()}
let alObs=null, alQueue=new Set(), alTick=0;
const alQueueAdd=recs=>{for(const r of recs){if(r.type==="characterData")alQueue.add(r.target);else r.addedNodes.forEach(n=>alQueue.add(n))}};
function autoLinkRun(){
  alTick=0; const prev=AL.key; autoRe();
  alQueueAdd(alObs.takeRecords()); alObs.disconnect();
  try{
    if(prev!==AL.key){unAutoLink();autoLinkIn(document.body)}
    else alQueue.forEach(n=>{if(n.isConnected)autoLinkIn(n)});
  }finally{alQueue.clear();alObs.takeRecords();alObs.observe(document.body,{childList:true,subtree:true,characterData:true})}
}
function autoLinkStart(){
  alObs=new MutationObserver(recs=>{alQueueAdd(recs);if(!alTick) alTick=requestAnimationFrame(autoLinkRun)});
  alQueue.add(document.body); autoLinkRun();
}
/* task cards can be dragged; starting on the title selects its words instead (drag the card by its lower part) */
document.addEventListener("pointerdown",e=>{
  const d=e.target.closest?.('[draggable="true"]'); if(!d||e.pointerType!=="mouse"||!e.target.closest("button,a")||e.target===d) return;
  d.draggable=false; const back=()=>{d.draggable=true;removeEventListener("pointerup",back,true)}; addEventListener("pointerup",back,true);
},true);
/* a click on a link inside a button opens the note instead; menus and tabs still switch screens.
   A click that ends a drag-selection never presses the button underneath. */
document.addEventListener("click",e=>{
  const s=window.getSelection(), t=e.target.closest?.("button,a,[data-hit],[role=button],.card[data-open]");
  if(s&&!s.isCollapsed&&s.toString().trim()&&t&&s.anchorNode&&t.contains(s.anchorNode)){e.preventDefault();e.stopPropagation();return}
  const w=e.target.closest?.(".awl"); if(!w||w.closest(".nav,#tabs,[data-notelist]")) return;
  e.preventDefault();e.stopPropagation();hideSelMenu();if($("#modal").firstChild)$("#modal").innerHTML="";openWiki(w.dataset.wiki);
},true);
/* 2-hop: for each [word] in this note, the other notes that also link it (and the word's own note) */
function twoHop(n){
  const me=normTitle(n.title), seen=new Set();
  return [...new Set(linksIn(n.body).map(normTitle))].filter(k=>k&&k!==me).map(k=>{
    const page=noteByTitle(k);
    const others=noteList().filter(x=>x.id!==n.id&&x.id!==page?.id&&linksIn(x.body).some(y=>normTitle(y)===k));
    return {word:page?.title||linksIn(n.body).find(y=>normTitle(y)===k),page,others};
  }).filter(g=>g.others.length);
}
/* A page's cards: every sentence in the Desk that holds its word, worked out from the text and never stored.
   Source lines ("出典：…") are kept in the note but shown apart from what you write. */
const noteMain=raw=>String(raw||"").split("\n").filter(l=>!SRC_LINE.test(l)).join("\n").replace(/^\n+|\s+$/g,"");
const noteSrc=raw=>String(raw||"").split("\n").filter(l=>SRC_LINE.test(l));
function sentencesOf(raw){
  return String(raw||"").split("\n").flatMap(l=>{
    if(SRC_LINE.test(l)||/^\s*\|?[\s:|-]*$/.test(l)) return [];
    l=l.replace(/\[([^\[\]\n]+)\]\(https?:[^)\s]+\)/g,"$1").replace(/^\s*(#{1,4}\s+|[-・]\s+|>\s*)/,"").replace(/[*`]/g,"").replace(/\|/g," ").trim();
    return (l.match(/(?:\[[^\[\]]*\]|[^。！？!?.]|\.(?!\s|$))+(?:[。！？!?]+|\.)?[」』）)"”]*|[。！？!?]+/g)||[]).map(x=>x.trim()).filter(x=>x.length>1);
  });
}
let SX=null;
function sentIndex(){
  if(SX&&SX.e===S.editions&&SX.w===S.watch&&SX.n===S.wnotes&&SX.m===S.memos&&SX.t===S.tasks) return SX;
  const all=[], add=(kind,raw,label,at,go)=>sentencesOf(raw).forEach(text=>all.push({kind,text,plain:plain(text).trim(),label,at,go}));
  S.editions.forEach(e=>{const at=Date.parse(e.id)||0;(e.data.stories||[]).forEach((x,i)=>[x.title,x.summary,x.lens].forEach(r=>add("news",r,e.id,at,{ed:e.id,story:i})))});
  S.watch.filter(w=>!w.deleted).forEach(w=>add("watch",w.body,w.date||w.id,Date.parse(w.date)||0,{watch:w.id}));
  noteList().forEach(n=>add("note",n.body,n.title,n.updatedAt||n.createdAt||0,{note:n.id}));

      const own=norm(terms[k]); let best=0, w=null;
      for(const a of alts){ if(!a) continue; const s=(T.includes(a)?3:X.includes(a)?1:0)*(a===own?1:.6); if(s>best){best=s;w=a} }
      if(!best){ok=false;break} score+=best; if(w&&w!==own)via.add(w); hitWord=hitWord||w;
    }
    if(!ok&&ai.length){const a=ai.map(norm).find(a=>a&&(T.includes(a)||X.includes(a)));if(a){ok=true;score=.4;hitWord=a;via.add(a)}}
    if(ok) hits.push({...it,score,hitWord});
  }
  hits.sort((a,b)=>b.score-a.score||((b.at||Date.parse(b.date)||0)-(a.at||Date.parse(a.date)||0)));
  return {hits,via:[...via].map(w=>SHOW[w]||w).slice(0,8)};
}
function snippet(it){
  const src=it.text||"", w=it.hitWord; if(!w) return esc(src.slice(0,90));
  const N=norm(src), i=N.indexOf(w); if(i<0) return esc(src.slice(0,90));
  const a=Math.max(0,i-30), b=Math.min(src.length,i+w.length+50);
  return (a?"…":"")+esc(src.slice(a,i))+"<b>"+esc(src.slice(i,i+w.length))+"</b>"+esc(src.slice(i+w.length,b))+(b<src.length?"…":"");
}

const MCOLOR={"飲食費":"var(--v1)","交通費":"var(--v2)","旅行・宿泊":"var(--v3)","買い物・日用品":"var(--v4)","学び・手続き":"var(--v5)","現金":"var(--v6)","その他":"var(--v7)"};

const mtick=v=>v>=1000?`${Math.round(v/100)/10}K`:String(Math.round(v));
function mscale(top){const raw=Math.max(top,1),p=10**Math.floor(Math.log10(raw)),s=[1,2,5,10].find(x=>x*p>=raw/3)*p;return {step:s,top:Math.ceil(raw/s)*s}}
const mbar=(x,y,w,h,fill,attrs="")=>{if(h<=0)return "";const r=Math.min(4,w/2,h);return `<path d="M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z" fill="${fill}" ${attrs}/>`};
/* Columns on one axis: each slot holds stacks or side-by-side bars, with a hit area larger than the mark. Rows and the table carry every value. */
function mcolumns({slots,height=180,label,line,lineName,caption}){
  const W=mwidth(),left=36,base=height-20,tops=slots.map(s=>s.mode==="side"?Math.max(0,...s.parts.map(p=>p.v)):s.parts.reduce((n,p)=>n+Math.max(p.v,0),0)),{step,top}=mscale(Math.max(...tops,line||0));
  const y=v=>base-v/top*(base-8),band=(W-left)/slots.length,grid=[];
  for(let v=0;v<=top;v+=step)grid.push(`<line x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${left-6}" y="${y(v)+4}" text-anchor="end" class="mtick">${mtick(v)}</text>`);
  const everyLabel=Math.max(1,Math.ceil(slots.length/(W/44)));
  const marks=slots.map((s,i)=>{
    const x0=left+i*band,gap=2;let out="";
    if(s.mode==="side"){const w=Math.min(24,(band-gap*3)/s.parts.length);s.parts.forEach((p,j)=>{out+=mbar(x0+gap+j*(w+gap),y(Math.max(p.v,0)),w,base-y(Math.max(p.v,0)),p.c)})}
    else{const w=Math.min(24,Math.max(band-4,2));let at=base;s.parts.forEach((p,j)=>{const h=base-y(Math.max(p.v,0));if(h<=0)return;const seg=Math.max(h-(j?2:0),1);at-=h;out+=(j===s.parts.length-1||!s.parts.slice(j+1).some(q=>q.v>0))?mbar(x0+(band-w)/2,at,w,seg,p.c):`<rect x="${x0+(band-w)/2}" y="${at}" width="${w}" height="${seg}" fill="${p.c}"/>`})}
    const mark=i%everyLabel===0?`<text x="${x0+band/2}" y="${height-4}" text-anchor="middle" class="mtick">${esc(s.label)}</text>`:"";
    return `${out}${mark}<rect x="${x0}" y="0" width="${band}" height="${base}" fill="transparent" class="mhit" data-tip="${esc(s.tip)}" ${s.attrs||""}/>`;
  }).join("");
  const ref=line?`<line x1="${left}" x2="${W}" y1="${y(line)}" y2="${y(line)}" stroke="var(--ink)" stroke-width="2"/><text x="${W}" y="${y(line)-6}" text-anchor="end" class="mtick">${esc(lineName)} ${mround(line)}</text>`:"";
  return `<svg class="mchart" viewBox="0 0 ${W} ${height}" width="${W}" height="${height}" role="img" aria-label="${esc(label)}">${grid.join("")}${marks}${ref}</svg>`;
}

/* 返信待ち: Life OS 02. On the Mac the server holds the state; online the hourly sync copies it to db "followups"
   and an answer waits on its doc until the next sync. This view has no way to send mail: 送る opens the Gmail draft. */
const fuDay=ms=>new Date(ms+HCMC).toISOString().slice(0,10);
const fuAge=i=>Math.round((Date.parse(fuDay(Date.now()))-Date.parse(fuDay(Date.parse(i.waitingAt))))/DAY);
function fuData(){
  if(db){const docs=(S.fuDocs||[]).filter(d=>!d.deleted),meta=docs.find(d=>d.id==="_meta");return meta?{enabled:meta.enabled!==false,lastRun:meta.lastRun,items:docs.filter(d=>d.id!=="_meta").sort((a,b)=>String(a.waitingAt).localeCompare(String(b.waitingAt)))}:null}
  return S.fu||null;
}
async function fuLoad(force){
  if(!LOCALAPI||S.fuBusy||(!force&&Date.now()-(S.fuAt||0)<20000))return;
  S.fuBusy=true;S.fuAt=Date.now();
  try{const v=await api("GET","/api/followups"),same=JSON.stringify(v)===JSON.stringify(S.fu);S.fu=v;S.fuErr=false;S.fuBusy=false;if(!same&&viewId()==="followups")render()}
  catch(e){const was=S.fuErr;S.fuErr=true;S.fuBusy=false;if(!was&&viewId()==="followups")render()}
}
const fuDraftBtn=i=>i.hasDraft&&okUrl(i.draftUrl)?`<a class="btn sm" href="${esc(i.draftUrl)}" target="_blank" rel="noopener">Gmail で下書きを開く ↗</a>`:"";
const fuBtn=(i,c,cls)=>`<button class="btn sm ${cls||""}" data-fu="${esc(c)}" data-fuid="${i.no}">${esc(c)}</button>`;
function fuHead(i){return `<div class="futop"><h3>${esc(i.subject)}</h3><span class="fudays">${fuAge(i)}日</span></div><div class="fuwho">${esc((i.to||[]).join(", "))}</div>`}
function fuActions(i,btns){
  if(i.answer) return `<p class="msg">「${esc(i.answer)}」を受け取りました。次の同期で反映します。</p>`;
  return `<div class="row">${btns}</div>`;
}
function fuView(){
  const d=fuData();
  const head=(sub,act)=>`<header class="head"><div><p class="eyebrow">${sub}</p><h1>返信待ち</h1></div>${act||""}</header>`;
  if(!d) return head("Life OS")+`<div class="card empty"><b>${S.fuErr?"読み込めませんでした":db?"まだ届いていません":LOCALAPI?"読み込んでいます":"Desk のサーバーが必要です"}</b>${S.fuErr?"Desk のサーバーが動いているか確かめてください。":db?"毎時の同期のあとに出ます。":""}</div>`;
  if(!d.enabled) return head("Life OS")+`<div class="card empty"><b>止めています</b>再開するときは python3 lifeos/02-followup/run.py start</div>`;
  const live=d.items.filter(i=>i.state!=="held"&&i.state!=="dropped");
  const asks=live.filter(i=>i.asking).slice(0,3),shown=new Set(asks.map(i=>i.no));
  const rest=live.filter(i=>!shown.has(i.no)),quiet=d.items.filter(i=>i.state==="held"||i.state==="dropped");
  const today=d.lastRun===fuDay(Date.now());
  const note=d.lastRun?(today?"今朝のメールを確認しました":`最後の確認 ${esc(d.lastRun)}。今朝の確認はまだです`):"メールの確認はまだです";
  const run=LOCALAPI&&!db?`<button class="btn" id="fuRun">メールを確認</button>`:"";
  const ask=asks.length?`<section><h2 class="section-title">答えを待っています</h2>${asks.map(i=>`<article class="card fucard"><div>${fuHead(i)}</div>${fuActions(i,fuBtn(i,"送る","primary")+fuBtn(i,"保留")+fuBtn(i,"捨てる"))}</article>`).join("")}</section>`:"";
  const row=i=>`<div><div>${fuHead(i)}</div>${fuActions(i,i.state==="send"?`<span class="msg">Gmail で確かめて、自分で送る番です</span>${fuDraftBtn(i)}`:(fuDraftBtn(i)+(i.asking?fuBtn(i,"送る")+fuBtn(i,"保留"):"")+fuBtn(i,"捨てる")))}</div>`;
  const list=rest.length?`<section><h2 class="section-title">返信待ち ${rest.length}件</h2><div class="card fulist">${rest.map(row).join("")}</div></section>`:(asks.length?"":`<div class="card empty"><b>返信待ちはありません</b>メールの確認のあとに、ここへ出ます。</div>`);
  const qrow=i=>`<div><div>${fuHead(i)}</div><p class="fuwho">${i.state==="held"?`保留中。${esc(i.holdUntil||"")} にまた聞きます`:"催促をやめました。下書きは Gmail に残っています"}</p>${fuActions(i,fuBtn(i,"戻す"))}</div>`;
  const more=quiet.length?`<details class="fumore"><summary>保留・やめたもの ${quiet.length}件</summary><div class="card fulist">${quiet.map(qrow).join("")}</div></details>`:"";
  return head(note,run)+`<div class="fu">${ask}${list}${more}</div><p class="sub">メールは Desk からは送られません。送るのは Gmail で本人が行います。</p>`;

async function ccHabit(){
  const today=hcmcDate(), h=S.habits.find(x=>x.id===CCHABIT.id);

async function ccSend(c,arg){

    try{const a=text.slice(c.cmd.length).replace(/^ /,"");await api("POST","/api/claude",{cmd:c.cmd,arg:a});toast("⌨️ Terminal で開きました");return}
    catch(e){/* server too old or not a Mac: fall back to copying */}
  }

function openCC(id){

  if(!c.ask){$("#modal").innerHTML="";return ccSend(c)}

  const go=LOCALAPI?"Terminal で開く":"コピーして Claude Code を開く";
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="pop" role="dialog" aria-modal="true" aria-label="${esc(c.name)}">
    <div class="top"><h2>${esc(c.name)} <code class="cccmd">${esc(c.cmd)}</code></h2><button class="ibtn" id="xCC" aria-label="閉じる">✕</button></div>
    <p class="hint">${esc(c.hint)}。${c.note?"<b>"+esc(c.note)+"</b>":""}${c.mac&&!LOCALAPI?"Mac で使うコマンドです。":""}空のまま渡すと、Claude が聞き返します。</p>
    <div class="ccfield"><label class="sub" for="ccText">${esc(c.ask)}</label>
    <textarea id="ccText" placeholder="${esc(c.ph||"")}">${esc(draft)}</textarea></div>
    <button class="btn primary" id="ccGo" style="justify-content:center">${go} <kbd>⌘/Ctrl + Enter</kbd></button>
  </div></div>`;
  const ta=$("#ccText");ta.focus();
  if(c.draft) ta.oninput=()=>{try{localStorage.setItem(c.draft,ta.value)}catch(e){}};
  const close=()=>{$("#modal").innerHTML=""};
  const send=()=>{const v=ta.value;if(c.draft)try{localStorage.removeItem(c.draft)}catch(e){}close();ccSend(c,v)};
  $("#ccGo").onclick=send;$("#xCC").onclick=close;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};

function palMatch(q){
  const w=norm(q.trim().replace(/^[/／]/,"")).trim(), all=palItems();
  if(!w) return all;
  const hit=x=>(x.key&&norm(x.key)===w)||[x.name,x.sub,x.kw,x.g].some(s=>s&&norm(s).includes(w));
  return all.filter(hit).sort((a,b)=>((b.key&&norm(b.key)===w)?1:0)-((a.key&&norm(a.key)===w)?1:0));
}
function palette(){
  const xs=palMatch(S.q); S.palSel=Math.min(S.palSel||0,Math.max(0,xs.length-1));
  const groups=[...new Set(xs.map(x=>x.g))];
  return `<section class="card results pal" aria-label="コマンド"><div class="rhead"><b>コマンド</b><span class="sub">↑↓ で選んで Enter · Esc で戻る · 右のキーは、入力欄の外でそのまま押しても開けます</span></div>
    ${groups.map(g=>`<div class="rgroup"><div class="section-title">${esc(g)}</div>${xs.map((x,i)=>x.g!==g?"":`<button class="rrow palrow ${i===S.palSel?"sel":""}" data-pal="${i}"><span>${esc(x.name)}${x.sub?` <code>${esc(x.sub)}</code>`:""}</span>${x.key?`<kbd>${esc(x.key)}</kbd>`:""}</button>`).join("")}</div>`).join("")||`<p class="sub" style="padding:4px 12px 10px;margin:0">合うコマンドがありません。</p>`}
  </section>`;
}
function palRun(i){
  const x=palMatch(S.q)[i]; if(!x) return;
  S.q="";S.palSel=0;$("#q").value="";$("#q").blur();render();x.run();
}
function palMove(d){
  const rows=[...document.querySelectorAll("[data-pal]")]; if(!rows.length) return;
  S.palSel=(S.palSel+d+rows.length)%rows.length;
  rows.forEach((r,i)=>r.classList.toggle("sel",i===S.palSel));rows[S.palSel].scrollIntoView({block:"nearest"});
}

/* ---------- focus: starts and lifts FocusBlock on this Mac, through desk/server.py. Mac only; nothing is stored in Desk. ---------- */
S.fb={state:null,err:null,min:25,until:"",apps:true,web:true};
const fbActive=()=>!!S.fb.state?.active?.active;
const fbEndMs=()=>(S.fb.state?.active?.end||0)*1000;
const FB_SETTINGS="http://127.0.0.1:47800";
function fbLeft(ms){ms=Math.max(0,ms);const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+":"+pad(m):m)+":"+pad(s%60)}
const fbTargets=a=>[a.apps&&"アプリ",a.web&&"Webサイト"].filter(Boolean).join("・");
let fbKey=null;
async function fbLoad(){
  try{const r=await fetch("/api/focus/state");const j=await r.json();
    if(r.ok){S.fb.state=j;S.fb.err=null}else{S.fb.state=null;S.fb.err=j.error||"FocusBlock につながりません"}
  }catch(e){S.fb.state=null;S.fb.err="Desk サーバーにつながりません"}
  const key=JSON.stringify([S.fb.state,S.fb.err]);
  if(key!==fbKey){fbKey=key;render()}
}
async function fbPost(action,body){
  const r=await fetch("/api/focus/"+action,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||"うまくいきませんでした");
  S.fb.state=j;S.fb.err=null;fbKey=JSON.stringify([j,null]);
}
function fbWarning(){
  const st=S.fb.state,f=S.fb;
  if(f.apps&&st.apps.mode==="allow"&&!st.apps.count) return "許可アプリが0個なので、開始するとブラウザもすべて終了し、このデスクも閉じます。先に設定で使うブラウザを許可してください。";
  const none=(f.apps&&st.apps.mode==="block"&&!st.apps.count)||(f.web&&st.web.mode==="block"&&!st.web.count);
  return none?"ブロックするものがリストにありません。設定で追加してください。":"";
}

async function fbStartNow(){

  if(f.until){const [h,m]=f.until.split(":").map(Number),d=new Date();d.setHours(h,m,0,0);if(d<=new Date())d.setDate(d.getDate()+1);end=d.getTime()/1000}
  try{await fbPost("start",{end,apps:f.apps,web:f.web});toast("ブロックを始めました");render()}catch(e){toast(e.message)}
}

  document.querySelectorAll("[data-fbmin]").forEach(b=>b.onclick=()=>{S.fb.min=+b.dataset.fbmin;S.fb.until="";render()});
  document.querySelectorAll("[data-fbt]").forEach(b=>b.onclick=()=>{S.fb[b.dataset.fbt]=!S.fb[b.dataset.fbt];render()});
  $("#fbUntil")&&($("#fbUntil").oninput=e=>{S.fb.until=e.target.value;document.querySelectorAll("[data-fbmin]").forEach(b=>b.setAttribute("aria-pressed",!S.fb.until&&S.fb.min===+b.dataset.fbmin))});
  $("#fbStart")&&($("#fbStart").onclick=fbStartNow);
}

/* ---------- boot ---------- */
render();
autoLinkStart();
(async()=>{
  if(Array.isArray(window.TOOLS)){ // PC version
    try{S.dues=JSON.parse(localStorage.getItem("desk-dues")||"{}")||{}}catch(e){S.dues={}}
    S.loaded=true;S.local=true;S.tools=window.TOOLS;S.editions=window.WORLD||[];S.days=window.MAIL||[];S.cal=window.CAL||null;S.gtasks=window.GTASKS||null;S.reports=window.REPORTS||[];S.watch=window.WATCH||[];S.memory=window.MEMORY||null;
    if(LOCALAPI){fbLoad();setInterval(fbLoad,5000);await loadApiMemos();setInterval(loadApiMemos,30000);window.addEventListener("focus",loadApiMemos);return}
    try{S.memos=JSON.parse(localStorage.getItem("desk-memos")||"[]")}catch(e){S.memos=[]}
    try{S.tasks=JSON.parse(localStorage.getItem("desk-tasks")||"[]")}catch(e){S.tasks=[]}
    try{S.prompts=JSON.parse(localStorage.getItem("desk-prompts")||"{}")||{}}catch(e){S.prompts={}}
    try{S.wnotes=JSON.parse(localStorage.getItem("desk-notes")||"[]")||[]}catch(e){S.wnotes=[]}
    try{S.habits=JSON.parse(localStorage.getItem("desk-habits")||"[]")||[]}catch(e){S.habits=[]}
    try{S.wins=JSON.parse(localStorage.getItem("desk-wins")||"[]")||[]}catch(e){S.wins=[]}
    return render();
  }
  db=window.claude?await claude.use("db"):null;
  if(!db){$("#view").insertAdjacentHTML("afterbegin",'<div class="card empty"><b>ログインすると Desk を読み込みます</b>claude.ai でこのページを開くと、ツール・ニュース・メールが表示されます。</div>');return}
  const sub=(col,fn,q)=> (q||db.collection(col)).onSnapshot(s=>{fn(s.docs.filter(d=>d.exists));render()},()=>toast("接続が切れました。再読み込みしてつなぎ直してください"));
  sub("tools",d=>S.tools=d.map(x=>({id:x.id,...x.data()})));
  sub("memos",d=>S.memos=d.map(x=>({id:x.id,...x.data()})).filter(m=>!m.deleted));
  sub("tasks",d=>S.tasks=d.map(x=>({id:x.id,...x.data()})).filter(t=>!t.deleted));
  sub("notes",d=>S.wnotes=d.map(x=>({id:x.id,...x.data()})).filter(n=>!n.deleted));
  sub("memory",d=>S.memory=d.find(x=>x.id==="current")?.data()||null);
  sub("habits",d=>S.habits=d.map(x=>({id:x.id,...x.data()})).filter(h=>!h.deleted));
  sub("wins",d=>S.wins=d.map(x=>({id:x.id,...x.data()})).filter(w=>!w.deleted));
  claude.use("sample").then(x=>{S.sampleOk=!!x;render()});
  sub("prompts",d=>S.prompts=promptsById(d.map(x=>({id:x.id,...x.data()}))));
  sub("calendar",d=>S.cal=d.find(x=>x.id==="upcoming")?.data()||null);
  sub("gtasks",d=>S.gtasks=d.find(x=>x.id==="current")?.data()||null);
  sub("watch",d=>S.watch=d.map(x=>({id:x.id,...x.data()})).filter(w=>!w.deleted),db.collection("watch").orderBy("date","desc").limit(30));
  sub("reports",d=>S.reports=d.map(x=>({id:x.id,...x.data()})),db.collection("reports").orderBy("date","desc").limit(400));
  sub("editions",d=>S.editions=d.map(x=>({id:x.id,data:x.data()})),db.collection("editions").orderBy("date","desc").limit(60));
  sub("days",d=>{S.days=d.map(x=>({id:x.id,data:x.data()}));S.loaded=true},db.collection("days").orderBy("date","desc").limit(30));
  sub("lifeos",d=>S.lifeos=d.map(x=>({id:x.id,...x.data()})));
  sub("lifemap",d=>S.lifemap=d.map(x=>({id:x.id,...x.data()})));
  sub("followups",d=>S.fuDocs=d.map(x=>({id:x.id,...x.data()})));
  db.collection("dues").onSnapshot(s=>{S.dues=duesById(s.docs.filter(d=>d.exists).map(d=>d.data()));render()},()=>{});
})();
</script>
