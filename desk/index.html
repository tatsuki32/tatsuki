/* ---------- minor countries watch ---------- */
/* Each issue is written by the Tue/Fri scheduled task into "watch" (doc id = date) as Markdown; the Google Doc stays the archive. */
function md(src){ // small, safe Markdown: headings, lists, quotes, rules, **bold**, *italic*, `code`, [text](https://…), bare https links
  const inline=t=>esc(t).replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,(m,a,u)=>`<a href="${u}" target="_blank" rel="noopener">${a}</a>`)
    .replace(/(^|[\s（(])(https:\/\/[^\s<）)]+)/g,(m,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const out=[];let list=null;
  const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  for(const raw of String(src||"").split("\n")){
    const l=raw.replace(/\s+$/,"");let m;
    if(!l.trim()){close();continue}
    if(m=/^(#{1,4})\s+(.*)$/.exec(l)){close();const n=Math.min(m[1].length+1,5);out.push(`<h${n}>${inline(m[2])}</h${n}>`);continue}
    if(/^(-{3,}|\*{3,}|━+)$/.test(l.trim())){close();out.push("<hr>");continue}
    if(m=/^\s*[-*・]\s+(.*)$/.exec(l)){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push(`<li>${inline(m[1])}</li>`);continue}
    if(m=/^\s*\d+[.)]\s+(.*)$/.exec(l)){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push(`<li>${inline(m[1])}</li>`);continue}
    if(m=/^>\s?(.*)$/.exec(l)){close();out.push(`<blockquote>${inline(m[1])}</blockquote>`);continue}
    close();out.push(`<p>${inline(l)}</p>`);
  }
  close();return out.join("");
}
function watch(){
  const head=x=>`<header class="head"><div><p class="eyebrow">Minor Countries Watch${x?" · "+esc(x.date||x.id):""}</p><h1>${x?esc(x.title||"Minor Countries Watch"):"Minor Countries Watch"}</h1></div>${S.watch.length>1?`<label class="sub">Issue <select id="watchNo">${S.watch.map(w=>`<option value="${esc(w.id)}" ${w.id===x?.id?"selected":""}>${esc(w.date||w.id)}${w.no?" No. "+esc(w.no):""}</option>`).join("")}</select></label>`:""}</header>`;
  const x=S.watch.find(w=>w.id===S.watchId)||S.watch[0];
  if(!x) return head(null)+`<div class="card empty"><b>No issues yet</b>Every Tuesday and Friday morning, two regions arrive from the Balkans, the Caucasus, Central Asia, inland South America, South Asia and Southeast Asia.</div>`;
  return head(x)+notesHere("watch")+`${(x.regions||[]).length?`<div class="chips">${x.regions.map(r=>`<span class="pill">${esc(r)}</span>`).join("")}</div>`:""}
  <article class="card md" data-noauto data-src="${esc(x.docUrl||"")}" data-srclabel="Minor Countries Watch ${esc(x.date||"")}">${md(x.body)}</article>
  ${okUrl(x.docUrl)?`<p class="sub"><a href="${esc(x.docUrl)}" target="_blank" rel="noopener">Open in Google Docs ↗</a></p>`:""}`;
}

/* ---------- notes: Scrapbox-style pages linked with [words] ---------- */
/* Stored in "notes" (Mac: data/notes.json), synced both ways like memos. [Title] links a note (a missing one is made on click),
   [https://… label] links out. The same brackets work in memos and task notes. Backlinks are counted from the text, never stored. */
const noteList=()=>S.wnotes.filter(n=>!n.deleted);
const normTitle=t=>String(t||"").normalize("NFKC").trim().toLowerCase();
const noteByTitle=t=>noteList().find(n=>normTitle(n.title)===normTitle(t));
const newNoteId=()=>"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* Scrapbox notation (scrapbox.io/help-jp/その他の書き方). Text only: nothing here writes to a note.
   [word] page · [* bold] [** bigger] [/ italic] [- strike] · [title https://…] either order · [https://….png] [[…png]] [link image]
   [page.icon] · #tag · `code` · lines: indent, > quote, $ command, code:name, table:name, html:name. */
const IMG_RE=/\.(?:png|jpe?g|gif|webp|avif)(?:[?#]\S*)?$/i, PDF_RE=/\.pdf(?:[?#]\S*)?$/i;
const isUrlTok=t=>/^(?:https?:\/\/\S+|\/uploads\/[\w.-]+)$/.test(t);
const extLink=(url,label)=>`<a class="ext" href="${esc(url)}" target="_blank" rel="noopener">${esc(label||url)} ↗</a>`;
function wikiMedia(u,full){
  if(IMG_RE.test(u)) return `<img class="wimg${full?" full":""}" loading="lazy" alt="" src="${esc(u)}">`;
  if(PDF_RE.test(u)&&u.startsWith("/uploads/")) return `<span class="wpdf"><iframe title="PDF" loading="lazy" src="${esc(u)}"></iframe>${extLink(u,"Open PDF")}</span>`;
  return extLink(u,u.startsWith("/uploads/")?"Open file":u);
}
const firstImage=raw=>{const m=/(?:https?:\/\/|\/uploads\/)[^\s\[\]]+\.(?:png|jpe?g|gif|webp|avif)(?:[?#][^\s\[\]]*)?/i.exec(String(raw||""));return m?m[0]:""};
function wikiIcon(name,times){
  const img=firstImage(noteByTitle(name)?.body);
  if(!img) return wlink(name);
  const one=`<img alt="${esc(name)}" title="${esc(name)}" loading="lazy" src="${esc(img)}">`;
  return `<a class="wicon" href="#notes" data-wiki="${esc(name)}">${one.repeat(Math.min(Math.max(times||1,1),20))}</a>`;
}
function wikiBracket(inner){
  let m; inner=inner.trim();
  if(m=/^\[(.+)\]$/.exec(inner)) return isUrlTok(m[1])&&IMG_RE.test(m[1])?wikiMedia(m[1],true):`<b>${wikiInline(m[1])}</b>`;
  if(m=/^([*\/\-]+)\s+(.+)$/.exec(inner)){
    const stars=(m[1].match(/\*/g)||[]).length; let h=wikiInline(m[2]);
    if(m[1].includes("-")) h=`<s>${h}</s>`;
    if(m[1].includes("/")) h=`<i>${h}</i>`;
    if(stars) h=`<b${stars>=4?' class="wb3"':stars>=2?' class="wb2"':""}>${h}</b>`;
    return h;
  }
  const toks=inner.split(/\s+/), first=toks[0], last=toks[toks.length-1];
  if(toks.length===1&&isUrlTok(first)) return wikiMedia(first);
  if(toks.length===2&&isUrlTok(first)&&isUrlTok(last)&&(IMG_RE.test(first)!==IMG_RE.test(last))){
    const [img,to]=IMG_RE.test(first)?[first,last]:[last,first];
    return `<a href="${esc(to)}" target="_blank" rel="noopener">${wikiMedia(img)}</a>`;
  }
  if(isUrlTok(first)) return extLink(first,toks.slice(1).join(" "));
  if(isUrlTok(last)) return extLink(last,toks.slice(0,-1).join(" "));
  if(m=/^(.+?)\.icon(?:\*(\d+))?$/.exec(inner)) return wikiIcon(m[1],+m[2]);
  if((m=/^(.+) icon$/.exec(inner))&&noteByTitle(m[1])&&!noteByTitle(inner)) return wikiIcon(m[1]);
  return wlink(inner);
}
function wikiText(t){
  let out="",last=0;
  for(const m of t.matchAll(/(^|\s)#([^\s#\[\]]+)|https?:\/\/[^\s\[\]<>"、。）]+/g)){
    if(m[2]){out+=esc(t.slice(last,m.index))+esc(m[1])+`<a class="wl${linkLone(m[2])?" lone":""}" href="#notes" data-wiki="${esc(m[2])}">#${esc(m[2])}</a>`}
    else out+=esc(t.slice(last,m.index))+extLink(m[0]);
    last=m.index+m[0].length;
  }
  return out+esc(t.slice(last));
}
function wikiInline(raw){
  const s=String(raw||""); let out="",buf="",i=0;
  const flush=()=>{out+=wikiText(buf);buf=""};
  while(i<s.length){
    if(s[i]==="`"){const j=s.indexOf("`",i+1);if(j>i+1&&!s.slice(i,j).includes("\n")){flush();out+=`<code>${esc(s.slice(i+1,j))}</code>`;i=j+1;continue}}
    if(s[i]==="["){let d=0,j=i;for(;j<s.length&&s[j]!=="\n";j++){if(s[j]==="[")d++;else if(s[j]==="]"&&--d===0)break}
      if(d===0&&s[j]==="]"&&j>i+1&&s.slice(i+1,j).trim()){flush();out+=wikiBracket(s.slice(i+1,j));i=j+1;continue}}
    buf+=s[i++];
  }
  flush(); return out;
}
/* HTML you write in a page: kept to plain structure, so nothing pasted can run or send anything */
const HTML_TAGS=new Set("a abbr article aside b blockquote br caption cite code col colgroup dd del details div dl dt em figcaption figure h1 h2 h3 h4 h5 h6 hr i img ins kbd li mark ol p pre q s section small span strong sub summary sup table tbody td tfoot th thead tr u ul".split(" "));
const HTML_DROP=new Set("script style iframe object embed form input button select textarea link meta base svg math template noscript".split(" "));
const HTML_ATTRS=new Set("href src alt title class id style width height colspan rowspan open".split(" "));
function cleanHtml(raw){
  const doc=new DOMParser().parseFromString(String(raw||""),"text/html");
  const walk=node=>[...node.children].forEach(el=>{
    const tag=el.tagName.toLowerCase();
    if(HTML_DROP.has(tag)||!HTML_TAGS.has(tag)&&el.namespaceURI!=="http://www.w3.org/1999/xhtml"){el.remove();return}
    walk(el);
    if(!HTML_TAGS.has(tag)){el.replaceWith(...el.childNodes);return}
    [...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim();
      if(!HTML_ATTRS.has(n)||((n==="href"||n==="src")&&!/^(https?:\/\/|\/uploads\/|#)/i.test(v))||(n==="style"&&/url\s*\(|expression|@import/i.test(v)))el.removeAttribute(a.name)});
    if(tag==="a"){el.setAttribute("target","_blank");el.setAttribute("rel","noopener")}
  });
  walk(doc.body);
  return doc.body.innerHTML;
}
const indentOf=l=>/^[ \t　]*/.exec(l)[0].length;
/* The lines under "code:…", "table:…" or "html:…": everything indented deeper than the opening line. */
function blockBody(lines,i){
  const base=indentOf(lines[i]), out=[]; let j=i+1;
  for(;j<lines.length;j++){if(lines[j].trim()&&indentOf(lines[j])<=base)break;out.push(lines[j].slice(Math.min(base+1,indentOf(lines[j]))))}
  while(out.length&&!out[out.length-1].trim()){out.pop();j--}
  return {body:out,next:j};
}
function codeBlock(raw,name){
  const lines=String(raw||"").split("\n"), i=lines.findIndex(l=>l.trim()==="code:"+name);
  return i<0?"":blockBody(lines,i).body.join("\n");
}
/* a whole body. Each piece remembers its first line (data-l), so a double click can put the cursor there. */
function wikiBlock(raw,base=0){
  const lines=String(raw||"").split("\n"), out=[]; let i=0;
  while(i<lines.length){
    const l=lines[i], at=`data-l="${i+base}"`, t=l.trim(); let m;
    if(m=/^(code|table|html):(.*)$/.exec(t)){
      const {body,next}=blockBody(lines,i), name=m[2].trim();
      if(m[1]==="code") out.push(`<figure class="wcode" ${at}>${name?`<figcaption>${esc(name)}</figcaption>`:""}<pre><code>${esc(body.join("\n"))}</code></pre></figure>`);
      else if(m[1]==="table"){const rows=body.filter(r=>r.trim()&&!/^[-\s\t]+$/.test(r)).map(r=>r.split("\t"));
        out.push(`<div class="wtable" ${at}>${name?`<p class="sub">${esc(name)}</p>`:""}<table>${rows.map((r,y)=>`<tr>${r.map(c=>y?`<td>${wikiInline(c.trim())}</td>`:`<th>${wikiInline(c.trim())}</th>`).join("")}</tr>`).join("")}</table></div>`)}
      else out.push(`<div class="whtml" ${at}>${cleanHtml(body.join("\n"))}</div>`);
      i=next; continue;
    }
    if(m=/^#{1,3}\s+(.*)$/.exec(l)) out.push(`<h3 ${at}>${wikiInline(m[1])}</h3>`);
    else if(m=/^\s*>\s?(.*)$/.exec(l)) out.push(`<blockquote class="wq" ${at}>${wikiInline(m[1])}</blockquote>`);
    else if(m=/^\s*([$%] .*)$/.exec(l)) out.push(`<pre class="wcmd" ${at}><code>${esc(m[1])}</code></pre>`);
    else if(m=/^(\s*)[-・]\s+(.*)$/.exec(l)) out.push(`<div class="li" ${at} style="margin-left:${Math.min(m[1].length,8)*6}px">${wikiInline(m[2])}</div>`);
    else if(t&&(m=/^[ \t　]+/.exec(l))) out.push(`<div class="li" ${at} style="margin-left:${Math.min(m[0].length-1,8)*16}px">${wikiInline(t)}</div>`);
    else out.push(t?`<div class="ln" ${at}>${wikiInline(l)}</div>`:`<div class="ln gap" ${at}></div>`);
    i++;
  }
  return out.join("");
}
/* Words a text links to. Decorations, URLs and code are not links; [page.icon] and #tag are. */
function linksIn(raw){
  const s=String(raw||"").replace(/`[^`\n]*`/g,""), out=[];
  for(const m of s.matchAll(/\[([^\[\]\n]+)\]/g)){
    const t=m[1].trim(); let i;
    if(/^[*\/\-]+\s/.test(t)||/https?:\/\/|\/uploads\//.test(t)||(s[m.index-1]==="["&&s[m.index+m[0].length]==="]")) continue;
    out.push((i=/^(.+?)\.icon(?:\*\d+)?$/.exec(t))||(i=/^(.+) icon$/.exec(t))&&noteByTitle(i[1])&&!noteByTitle(t)?i[1]:t);
  }
  for(const m of s.matchAll(/(?:^|\s)#([^\s#\[\]]+)/g)) out.push(m[1]);
  return out;
}
/* Where each [word] is used: one count per note, memo, task note, or news article (a note whose body cites that article's URL).
   Recounted only when notes, memos or tasks change. */
const SRC_LINE=/^\s*(?:出典[：:]|Source:)/i;
const hasContent=n=>String(n?.body||"").split("\n").some(l=>l.trim()&&!SRC_LINE.test(l));
let LS=null;
function linkStats(){
  if(LS&&LS.n===S.wnotes&&LS.m===S.memos&&LS.t===S.tasks) return LS;
  const count=new Map(), add=(raw,extra=[])=>new Set([...linksIn(raw),...extra].map(normTitle)).forEach(k=>count.set(k,(count.get(k)||0)+1));
  noteList().forEach(n=>{add(n.body);
    const urls=[...String(n.body||"").matchAll(/^\s*(?:出典[：:]|Source:)\s*\[(https:\/\/\S+)/gim)];if(urls.length)count.set(normTitle(n.title),(count.get(normTitle(n.title))||0)+urls.length)});
  S.memos.forEach(m=>add(m.text));S.tasks.filter(t=>!t.deleted).forEach(t=>add(t.note));
  return LS={n:S.wnotes,m:S.memos,t:S.tasks,count,byT:new Map(noteList().map(n=>[normTitle(n.title),n]))};
}
const linkUses=t=>linkStats().count.get(normTitle(t))||0;
const linkLone=t=>{const n=linkStats().byT.get(normTitle(t));return !hasContent(n)&&linkUses(t)<2&&!(n&&sentencesFor(n).length>=2)};
const wlink=t=>`<a class="wl${linkLone(t)?" lone":""}" href="#notes" data-wiki="${esc(t)}"${linkLone(t)?' title="Not linked anywhere yet"':""}>${esc(t)}</a>`;
/* news and Minor Countries: words linked from an article show as links inside it (first match per note, per article) */
function linkSources(root){
  root.querySelectorAll("[data-src]").forEach(el=>{
    const url=el.dataset.src; if(!/^https:\/\//.test(url)) return;
    const titles=noteList().filter(n=>n.title&&String(n.body||"").includes("["+url)).map(n=>n.title).sort((a,b)=>b.length-a.length);
    titles.forEach(t=>{
      const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:x=>x.parentElement.closest("a,button,select,textarea,.wl")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});

  if(e.key==="Backspace"&&a===0&&b===0&&plainKey){

}

function runSearch(q){
  const terms=q.trim().split(/\s+/).filter(Boolean); if(!terms.length) return {hits:[],via:[]};
  const ai=(S.aiExp||{})[norm(q)]||[];
  const sets=terms.map(expand), via=new Set();
  const hits=[];
  for(const it of searchIndex()){
    const T=norm(it.title), X=norm(it.text); let score=0, ok=true, hitWord=null;
    for(const [k,alts] of sets.entries()){
      const own=norm(terms[k]); let best=0, w=null;
      for(const a of alts){ if(!a) continue; const s=(T.includes(a)?3:X.includes(a)?1:0)*(a===own?1:.6); if(s>best){best=s;w=a} }
      if(!best){ok=false;break} score+=best; if(w&&w!==own)via.add(w); hitWord=hitWord||w;
    }
    if(!ok&&ai.length){const a=ai.map(norm).find(a=>a&&(T.includes(a)||X.includes(a)));if(a){ok=true;score=.4;hitWord=a;via.add(a)}}
    if(ok) hits.push({...it,score,hitWord});
  }
  hits.sort((a,b)=>b.score-a.score||((b.at||Date.parse(b.date)||0)-(a.at||Date.parse(a.date)||0)));
  return {hits,via:[...via].map(w=>SHOW[w]||w).slice(0,8)};
}

function pgStats(extraId){
  const list=winList().filter(w=>w.kind!=="claude"), today=hcmcDate(), by=new Map();
  list.forEach(w=>by.set(w.date,(by.get(w.date)||0)+1));
  if(extraId&&!list.some(w=>w.id===extraId))by.set(today,(by.get(today)||0)+1);
  const n=by.get(today)||0;let best=0,wk=0,streak=0;
  by.forEach((v,d)=>{if(d!==today&&v>best)best=v});
  for(let i=0;i<7;i++)wk+=by.get(dayOff(today,-i))||0;
  for(let d=n?today:dayOff(today,-1);by.has(d);d=dayOff(d,-1))streak++;
  return {n,best,wk,streak,days:by.size,lastWeek:by.get(dayOff(today,-7))||0,items:list.filter(w=>w.date===today).sort((a,b)=>(b.at||0)-(a.at||0))};
}

/* words: real numbers first, so they stay true and keep changing; never the same line twice in a row */
const PGMILE={1:"Your first one is done",3:"Number 3. You're finding a rhythm",5:"Number 5. Good pace",10:"Number 10. Impressive",15:"Number 15. You're really moving today",20:"Number 20. What a day",30:"Number 30. Remember to take a break",50:"Number 50. A remarkable record"};
const PGLINES=["Small or not, one is one","You're making progress","Just one more is fine","Finishing it counts","Nice, another one","Keep it up"];
let pgLast="";
function cheerWords(s){
  let tier=0,sub;
  if(s.best&&s.n===s.best+1){tier=2;sub=`New personal best. Your previous best was ${s.best}`}
  else if(s.n===PG.goal){tier=1;sub="You reached today's goal"}
  else if(PGMILE[s.n]){tier=s.n>1?1:0;sub=PGMILE[s.n]}
  else{const pool=[...PGLINES,`${s.wk} in the last 7 days`,...(s.lastWeek&&s.n>s.lastWeek?[`${s.n-s.lastWeek} more than the same day last week`]:[]),...(s.streak>1?[`${s.streak} days in a row`]:[]),...(s.best&&s.n>s.best?["You're beating your best"]:[])].filter(x=>x!==pgLast);
    sub=pool[Math.floor(Math.random()*pool.length)]}
  pgLast=sub;
  return {tier,head:`Done. Number ${s.n} today`,sub};
}

const mfv=(start,monthly,years,rate,fee)=>{const r=(rate-(fee||0))/100/12,n=Math.round(years*12);return r?start*(1+r)**n+monthly*(((1+r)**n-1)/r):start+monthly*n};
function moneySimInvestOut(s){
  const start=s.start||0,monthly=s.monthly||0,years=s.years||0,rates=[s.rate1,s.rate2,s.rate3].filter(v=>v!=null);
  if(!years)return `<p class="due">Enter the number of years to calculate.</p>`;
  if(!rates.length)return `<p class="due">Enter an assumed return to calculate. No default is filled in.</p>`;
  const span=Array.from({length:Math.min(years,60)+1},(_,i)=>i),principal=span.map(y=>start+monthly*12*y),COL=["var(--v1)","var(--v2)","var(--v3)"];
  const out=rates.map((r,i)=>({name:`${r}%/yr`,c:COL[i],values:span.map(y=>mfv(start,monthly,y,r,s.fee))}));
  const end=rates.map(r=>mfv(start,monthly,years,r,s.fee)),paid=start+monthly*12*years;
  return mlegend([["Paid in","var(--v7)"],...out.map(x=>[x.name,x.c])])+mlines({label:"Investment estimate",labels:span.map(y=>`Yr ${y}`),series:[{name:"Paid in",c:"var(--v7)",values:principal},...out]})+`<div class="mscroll"><table><thead><tr><th>Assumed return</th><th class="n">After ${years} years</th><th class="n">Paid in</th><th class="n">Growth</th></tr></thead><tbody>${rates.map((r,i)=>`<tr><td>${esc(r)}%/yr</td><td class="n">${mround(end[i])}</td><td class="n">${mround(paid)}</td><td class="n">${msign(Math.round(end[i]-paid))}</td></tr>`).join("")}</tbody></table></div>`;
}
function moneySimLifeOut(l,age){
  if(age==null)return `<p class="due">Cannot calculate without a date of birth.</p>`;
  const to=l.toAge||Math.max(age+30,60),rate=(l.rate||0)/100,labels=[],values=[];let money=l.start||0;
  for(let a=age;a<=to;a++){labels.push(`Age ${a}`);if(a>age)money=money*(1+rate)+(l.monthly||0)*12;(l.events||[]).forEach(e=>{if(e.age===a)money-=e.cost||0});values.push(Math.round(money))}
  return mlines({label:"Life plan estimate",labels,series:[{name:"Balance",c:"var(--v1)",values}]})+`<p class="due">About ${msign(values[values.length-1])} USD at age ${esc(to)}. Event costs are the amounts you entered. Changes in pay and prices are not included.</p>`;
}

/* Awaiting Reply: Life OS 02. On the Mac the server holds the state; online the hourly sync copies it to db "followups"
   and an answer waits on its doc until the next sync. This view has no way to send mail: Send (送る) opens the Gmail draft. */
const fuDay=ms=>new Date(ms+HCMC).toISOString().slice(0,10);
const fuAge=i=>Math.round((Date.parse(fuDay(Date.now()))-Date.parse(fuDay(Date.parse(i.waitingAt))))/DAY);
function fuData(){
  if(db){const docs=(S.fuDocs||[]).filter(d=>!d.deleted),meta=docs.find(d=>d.id==="_meta");return meta?{enabled:meta.enabled!==false,lastRun:meta.lastRun,items:docs.filter(d=>d.id!=="_meta").sort((a,b)=>String(a.waitingAt).localeCompare(String(b.waitingAt)))}:null}
  return S.fu||null;
}
async function fuLoad(force){
  if(!LOCALAPI||S.fuBusy||(!force&&Date.now()-(S.fuAt||0)<20000))return;
  S.fuBusy=true;S.fuAt=Date.now();
  try{const v=await api("GET","/api/followups"),same=JSON.stringify(v)===JSON.stringify(S.fu);S.fu=v;S.fuErr=false;S.fuBusy=false;if(!same&&viewId()==="followups")render()}
  catch(e){const was=S.fuErr;S.fuErr=true;S.fuBusy=false;if(!was&&viewId()==="followups")render()}
}
const fuDraftBtn=i=>i.hasDraft&&okUrl(i.draftUrl)?`<a class="btn sm" href="${esc(i.draftUrl)}" target="_blank" rel="noopener">Open the draft in Gmail ↗</a>`:"";
const FUEN={"送る":"Send","保留":"Hold","捨てる":"Drop","戻す":"Restore"};const fuBtn=(i,c,cls)=>`<button class="btn sm ${cls||""}" data-fu="${esc(c)}" data-fuid="${i.no}">${esc(FUEN[c]||c)}</button>`;
function fuHead(i){return `<div class="futop"><h3>${esc(i.subject)}</h3><span class="fudays">${fuAge(i)===1?"1 day":fuAge(i)+" days"}</span></div><div class="fuwho">${i.source==="whatsapp"?"WhatsApp":"Gmail · "+esc((i.to||[]).join(", "))}</div>`}
const fuCopyBtn=i=>i.copyText?`<button class="btn sm" data-fucopy="${esc(i.copyText)}">Copy message</button>`:"";
function fuActions(i,btns){
  if(i.answer) return `<p class="msg">Got "${esc(FUEN[i.answer]||i.answer)}". It will apply at the next sync.</p>`;
  return `<div class="row">${btns}</div>`;
}
function fuView(){
  const d=fuData();
  const head=(sub,act)=>`<header class="head"><div><p class="eyebrow">${sub}</p><h1>Awaiting Reply</h1></div>${act||""}</header>`;
  if(!d) return head("Life OS")+`<div class="card empty"><b>${S.fuErr?"Could not load":db?"Nothing has arrived yet":LOCALAPI?"Loading":"The Desk server is needed"}</b>${S.fuErr?"Check that the Desk server is running.":db?"It appears after the hourly sync.":""}</div>`;
  if(!d.enabled) return head("Life OS")+`<div class="card empty"><b>Paused</b>To resume, run python3 lifeos/02-followup/run.py start</div>`;
  const live=d.items.filter(i=>i.state!=="held"&&i.state!=="dropped");
  const asks=live.filter(i=>i.asking).slice(0,3),shown=new Set(asks.map(i=>i.no));
  const rest=live.filter(i=>!shown.has(i.no)),quiet=d.items.filter(i=>i.state==="held"||i.state==="dropped");
  const today=d.lastRun===fuDay(Date.now());
  const note=d.lastRun?(today?"Checked this morning's email":`Last checked ${esc(d.lastRun)}. Not checked this morning yet`):"Email not checked yet";
  const run=LOCALAPI&&!db?`<button class="btn" id="fuRun">Check email</button>`:"";
  const ask=asks.length?`<section><h2 class="section-title">Waiting for your answer</h2>${asks.map(i=>`<article class="card fucard"><div>${fuHead(i)}</div>${fuActions(i,fuBtn(i,"送る","primary")+fuBtn(i,"保留")+fuBtn(i,"捨てる"))}</article>`).join("")}</section>`:"";
  const row=i=>`<div><div>${fuHead(i)}</div>${fuActions(i,i.state==="send"?`<span class="msg">Your turn: check it in Gmail and send it yourself</span>${fuDraftBtn(i)}`:(fuDraftBtn(i)+fuCopyBtn(i)+(i.asking?fuBtn(i,"送る")+fuBtn(i,"保留"):"")+fuBtn(i,"捨てる")))}</div>`;
  const list=rest.length?`<section><h2 class="section-title">Awaiting Reply (${rest.length})</h2><div class="card fulist">${rest.map(row).join("")}</div></section>`:(asks.length?"":`<div class="card empty"><b>Nothing awaiting reply</b>Items appear here after the email check.</div>`);
  const qrow=i=>`<div><div>${fuHead(i)}</div><p class="fuwho">${i.state==="held"?`On hold. You will be asked again on ${esc(i.holdUntil||"")}`:"Stopped nudging. The draft is still in Gmail"}</p>${fuActions(i,fuBtn(i,"戻す"))}</div>`;
  const more=quiet.length?`<details class="fumore"><summary>On hold or stopped (${quiet.length})</summary><div class="card fulist">${quiet.map(qrow).join("")}</div></details>`:"";
  return head(note,run)+`<div class="fu">${ask}${list}${more}</div><p class="sub">Desk does not send anything. You send messages yourself in Gmail or WhatsApp.</p>`;
}

  const buttons=(hot.length?`<details class="bdfold"><summary>Most tapped (${hot.length})</summary><div class="urow ubtns uhead"><span>Screen · Button</span><span class="n">Taps</span><span class="n">Tap rate</span></div>${hot.map(brow).join("")}</details>`:`<p class="due">No button taps recorded in ${span}.</p>`)
    +(d.stale.length?`<details class="bdfold"><summary>Not tapped in 14 days (${d.stale.length})</summary>${d.stale.map(r=>`<div class="urow ubtns"><span class="uname">${bname(r)}</span><span class="n sub">Last</span><span class="n">${uDay(r.last)}</span></div>`).join("")}</details>`:"");
  const hist=L.history||[], week=hist.find(h=>h.week===L.week&&!h.reset);
  const when=!L.on?"This window is for testing, so nothing is counted or rearranged.":!L.auto?"Automatic rearranging is off. Counting continues.":d.nextRun?`Next rearrangement: Mon ${uDay(d.nextRun)}.${d.ready?"":" It starts once there are 14 days of records."}`:"Once records come in, it starts on the Monday after 14 days.";
  const arrange=`<p style="margin:0">${when}</p>${week?`<p class="wt" style="margin:0">This week: ${uMoves(week.moves)}${week.undone?" (restored)":""}</p>`:""}
    <div class="nsgo">${L.canUndo?`<button class="btn sm" data-ulay="undo">Restore last week's order</button>`:""}${L.changed?`<button class="btn sm" data-ulay="reset">Restore the original order</button>`:""}<button class="btn sm" data-ulay="auto:${L.auto?"off":"on"}">${L.auto?"Stop automatic rearranging":"Start automatic rearranging"}</button></div>
    ${hist.filter(h=>h!==week).map(h=>`<p class="due" style="margin:0">Week of ${uDay(h.week)}: ${h.reset?"Restored the original order":uMoves(h.moves)}${h.undone?" (restored)":""}</p>`).join("")}`;
  const often=used.filter(r=>r.v.id!=="home").slice(0,3), lead=often.length?`Most used: ${often.map(r=>r.v.label).join(", ")}`:"No records yet";
  const sub=d.first?`In ${span}, ${used.length} screens opened and ${rows.length-used.length} not opened. Counting since ${uDay(d.first)}.`:"A record is added each time you switch screens. What you type and the text you read are not recorded.";
  const chips=`<div class="chips" role="group" aria-label="Period">${[["7","7 days"],["14","14 days"],["30","30 days"],["all","All"]].map(([k,l])=>`<button class="chip" data-ulay="period:${k}" aria-pressed="${k===q}">${l}</button>`).join("")}</div>`;
  return `<div class="money"><div><p class="eyebrow">Usage</p><h1>${esc(lead)}</h1><p class="sub" style="margin:var(--s1) 0 0">${esc(sub)}</p></div>${chips}
    ${mpanel("Screens","Most days opened first. Bars show time spent",screens)}
    ${mpanel("Home cards",d.homeN?`Share of the ${d.homeN} Home visits in which the card was tapped`:"",cards)}
    ${mpanel("Buttons","Share of that screen's visits in which it was tapped",buttons)}
    ${mpanel("Rearranging","Once a week, up to 3 screens and 3 cards",arrange)}</div>`;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest?.("[data-ulay]"); if(!b||!LOCALAPI) return;
  const [op,kind,id]=b.dataset.ulay.split(":");
  if(op==="period"){S.uq=kind;S.usage=null;render();uLoad(true);return}
  if(!S.layout?.on){toast("This window is for testing, so the order cannot be changed");return}
  const on=op==="pin"?b.getAttribute("aria-pressed")!=="true":kind==="on";
  try{S.layout=await api("PUT","/api/layout",op==="pin"?{op,kind,id,on}:op==="auto"?{op,on}:{op});render();
    const say={undo:"Restored last week's order",reset:"Restored the original order",pin:on?"Pinned where it is":"Unpinned",auto:on?"Automatic rearranging started":"Automatic rearranging stopped"}[op];if(say)toast(say)}
  catch(err){toast("Could not save. Please check the server")}
});

window.addEventListener("hashchange",()=>{uEnter();S.confirm=null;hideSelMenu();if(location.hash==="#notes"&&!S.noteKeep)S.noteId=null;S.noteKeep=false;const f=S.focus!=null;if(!f)window.scrollTo(0,0);render()});

/* ---------- focus: starts and lifts FocusBlock on this Mac, through desk/server.py. Mac only; nothing is stored in Desk. ---------- */
S.fb={state:null,err:null,min:25,until:"",apps:true,web:true};
const fbActive=()=>!!S.fb.state?.active?.active;
const fbEndMs=()=>(S.fb.state?.active?.end||0)*1000;
const FB_SETTINGS="http://127.0.0.1:47800";
function fbLeft(ms){ms=Math.max(0,ms);const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+":"+pad(m):m)+":"+pad(s%60)}
const fbTargets=a=>[a.apps&&"apps",a.web&&"websites"].filter(Boolean).join(" and ");
let fbKey=null;
async function fbLoad(){
  try{const r=await fetch("/api/focus/state");const j=await r.json();
    if(r.ok){S.fb.state=j;S.fb.err=null}else{S.fb.state=null;S.fb.err=j.error||"Cannot connect to FocusBlock"}
  }catch(e){S.fb.state=null;S.fb.err="Cannot connect to the Desk server"}
  const key=JSON.stringify([S.fb.state,S.fb.err]);
  if(key!==fbKey){fbKey=key;render()}
}
async function fbPost(action,body){
  const r=await fetch("/api/focus/"+action,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||"That did not work");
  S.fb.state=j;S.fb.err=null;fbKey=JSON.stringify([j,null]);
}
function fbWarning(){
  const st=S.fb.state,f=S.fb;
  if(f.apps&&st.apps.mode==="allow"&&!st.apps.count) return "No apps are allowed, so starting will quit every browser and close this Desk too. Allow the browser you use in the settings first.";
  const none=(f.apps&&st.apps.mode==="block"&&!st.apps.count)||(f.web&&st.web.mode==="block"&&!st.web.count);
  return none?"Nothing is on the block list. Add some in the settings.":"";
}
const FB_FOOT=`<div class="fbfoot"><p class="sub">If you cannot use a browser, open FocusBlock in the Applications folder to lift the block. Claude and System Settings are never blocked.</p><a class="more" href="${FB_SETTINGS}" target="_blank" rel="noopener">List and schedule settings ↗</a></div>`;
function focusView(){
  const st=S.fb.state,f=S.fb;
  if(!st) return `<header class="head"><div><p class="eyebrow">Focus</p><h1>${f.err?"Cannot connect to FocusBlock":"Checking"}</h1></div></header>
    ${f.err?`<div class="card empty"><b>${esc(f.err)}</b>Wait a moment and open it again. If a block is on, you can lift it from FocusBlock in the Applications folder.</div>`:""}`;
  if(fbActive()){const a=st.active;
    return `<header class="head"><div><p class="eyebrow">Focus · Blocking ${esc(fbTargets(a))}</p><h1 class="fbclock" data-fleft="${fbEndMs()}">${fbLeft(fbEndMs()-Date.now())}</h1><p class="sub fbsrc">${a.sources.map(s=>esc(s.name)+": until "+esc(fmtDue(s.end*1000))).join(" / ")}</p></div><button class="btn" data-fbstop>Unlock with password</button></header>
    ${FB_FOOT}
    ${notesHere("focus")}`;
  }
  const warn=fbWarning(), ok=st.hasPassword&&(f.apps||f.web);
  const chip=(attr,on,label)=>`<button class="chip" ${attr} aria-pressed="${on}">${label}</button>`;
  return `<header class="head"><div><p class="eyebrow">Focus</p><h1>How long do you want to focus?</h1></div></header>
  <section class="card fbform">
    <div class="fbgroup"><div class="chips">${[[25,"25 min"],[50,"50 min"],[60,"1 hr"],[120,"2 hr"],[240,"4 hr"]].map(([m,l])=>chip(`data-fbmin="${m}"`,!f.until&&f.min===m,l)).join("")}</div>
      <label class="fbuntil"><span class="sub">Set an end time</span><input type="time" id="fbUntil" value="${esc(f.until)}"></label></div>
    <div class="fbgroup"><h2>What to block</h2><div class="chips">${chip('data-fbt="apps"',f.apps,"Apps")}${chip('data-fbt="web"',f.web,"Websites")}</div></div>
    ${!st.hasPassword?`<p class="todo" style="margin:0">Set an unlock password in the settings first.</p>`:warn?`<p class="todo" style="margin:0">${esc(warn)}</p>`:""}
    <div class="row"><button class="btn primary" id="fbStart" ${ok?"":"disabled"}>${warn&&st.hasPassword?"Start anyway":"Start"}</button></div>
  </section>
  ${FB_FOOT}
  ${notesHere("focus")}`;
}
function focusHomeCard(){
  if(!LOCALAPI||!fbActive()) return "";
  const a=S.fb.state.active;
  return `<section class="card" aria-label="Blocking"><div class="dhead"><h2><span class="e">🎯</span>Blocking</h2><span class="sub">${esc(fbTargets(a))}</span><span class="until" data-fleft="${fbEndMs()}">${fbLeft(fbEndMs()-Date.now())}</span><button class="btn sm" data-fbstop>Unlock with password</button></div></section>`;
}
function openFbStop(){
  if($("#modal").firstChild) return;
  $("#modal").innerHTML=`<div class="scrim" id="scrim"><div class="pop" role="dialog" aria-modal="true" aria-label="Lift the block">
    <div class="top"><h2>🎯 Lift the block</h2><button class="ibtn" id="xFb" aria-label="Close">✕</button></div>
    <label class="sub" for="fbPw">Unlock password</label>
    <input type="password" id="fbPw" autocomplete="off">
    <p class="msg err" id="fbErr" role="alert" style="margin:0"></p>
    <div class="row"><button class="btn primary" id="fbGo">Unlock</button><button class="btn" id="fbNo">Cancel</button></div>
  </div></div>`;
  const inp=$("#fbPw"), close=()=>{$("#modal").innerHTML=""};
  inp.focus();
  $("#fbGo").onclick=async()=>{const b=$("#fbGo");b.disabled=true;
    try{await fbPost("stop",{password:inp.value});close();toast("Unlocked");render()}
    catch(e){if($("#fbErr")){$("#fbErr").textContent=e.message;b.disabled=false;inp.select()}}};
  $("#fbNo").onclick=close;$("#xFb").onclick=close;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
  inp.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();if(!$("#fbGo").disabled)$("#fbGo").click()}if(e.key==="Escape")close()};
}
async function fbStartNow(){
  const f=S.fb;let end=Date.now()/1000+60*f.min;
  if(f.until){const [h,m]=f.until.split(":").map(Number),d=new Date();d.setHours(h,m,0,0);if(d<=new Date())d.setDate(d.getDate()+1);end=d.getTime()/1000}
  try{await fbPost("start",{end,apps:f.apps,web:f.web});toast("Block started");render()}catch(e){toast(e.message)}
}
function wireFocus(){
  document.querySelectorAll("[data-fbstop]").forEach(b=>b.onclick=openFbStop);
  document.querySelectorAll("[data-fbmin]").forEach(b=>b.onclick=()=>{S.fb.min=+b.dataset.fbmin;S.fb.until="";render()});
  document.querySelectorAll("[data-fbt]").forEach(b=>b.onclick=()=>{S.fb[b.dataset.fbt]=!S.fb[b.dataset.fbt];render()});
  $("#fbUntil")&&($("#fbUntil").oninput=e=>{S.fb.until=e.target.value;document.querySelectorAll("[data-fbmin]").forEach(b=>b.setAttribute("aria-pressed",!S.fb.until&&S.fb.min===+b.dataset.fbmin))});
  $("#fbStart")&&($("#fbStart").onclick=fbStartNow);
}

/* ---------- boot ---------- */
render();
autoLinkStart();
(async()=>{
  if(Array.isArray(window.TOOLS)){ // PC version
    try{S.dues=JSON.parse(localStorage.getItem("desk-dues")||"{}")||{}}catch(e){S.dues={}}
    S.loaded=true;S.local=true;S.tools=window.TOOLS.map(enOf);S.editions=window.WORLD||[];S.days=window.MAIL||[];S.cal=window.CAL||null;S.gtasks=window.GTASKS||null;S.reports=window.REPORTS||[];S.watch=window.WATCH||[];S.heritage=(window.HERITAGE||[]).filter(h=>!h.deleted);S.hcountries=(window.HERITAGE_COUNTRIES||[]).map(([code,name,region])=>({code,name,region}));S.memory=window.MEMORY||null;
    if(LOCALAPI){uEnter();uSync();fbLoad();setInterval(fbLoad,5000);await loadApiMemos();setInterval(loadApiMemos,30000);window.addEventListener("focus",loadApiMemos);return}
    try{S.memos=JSON.parse(localStorage.getItem("desk-memos")||"[]")}catch(e){S.memos=[]}
    try{S.tasks=JSON.parse(localStorage.getItem("desk-tasks")||"[]")}catch(e){S.tasks=[]}
    try{S.prompts=JSON.parse(localStorage.getItem("desk-prompts")||"{}")||{}}catch(e){S.prompts={}}
    try{S.wnotes=JSON.parse(localStorage.getItem("desk-notes")||"[]")||[]}catch(e){S.wnotes=[]}
    try{S.habits=JSON.parse(localStorage.getItem("desk-habits")||"[]")||[]}catch(e){S.habits=[]}
    try{S.wins=JSON.parse(localStorage.getItem("desk-wins")||"[]")||[]}catch(e){S.wins=[]}
    try{S.wlog=JSON.parse(localStorage.getItem("desk-worldlog")||"{}")||{}}catch(e){S.wlog={}}
    try{S.gear=JSON.parse(localStorage.getItem("desk-gear")||"[]")||[]}catch(e){S.gear=[]}
    try{S.projects=JSON.parse(localStorage.getItem("desk-projects")||"[]")||[]}catch(e){S.projects=[]}
    try{S.sections=JSON.parse(localStorage.getItem("desk-sections")||"[]")||[]}catch(e){S.sections=[]}
    return render();
  }
  db=window.claude?await claude.use("db"):null;
  if(!db){$("#view").insertAdjacentHTML("afterbegin",'<div class="card empty"><b>Sign in to load Desk</b>Open this page on claude.ai to see tools, news and email.</div>');return}
  const sub=(col,fn,q)=> (q||db.collection(col)).onSnapshot(s=>{fn(s.docs.filter(d=>d.exists));render()},()=>toast("Connection lost. Reload to reconnect"));
  sub("tools",d=>S.tools=d.map(x=>({id:x.id,...x.data()})));
  sub("memos",d=>S.memos=d.map(x=>({id:x.id,...x.data()})).filter(m=>!m.deleted));
  sub("tasks",d=>S.tasks=d.map(x=>({id:x.id,...x.data()})).filter(t=>!t.deleted));
  sub("notes",d=>S.wnotes=d.map(x=>({id:x.id,...x.data()})).filter(n=>!n.deleted));
  sub("memory",d=>S.memory=d.find(x=>x.id==="current")?.data()||null);
  sub("habits",d=>S.habits=d.map(x=>({id:x.id,...x.data()})).filter(h=>!h.deleted));
  sub("wins",d=>S.wins=d.map(x=>({id:x.id,...x.data()})).filter(w=>!w.deleted));
  sub("gear",d=>S.gear=d.map(x=>({id:x.id,...x.data()})).filter(g=>!g.deleted));
  sub("projects",d=>S.projects=d.map(x=>({id:x.id,...x.data()})).filter(p=>!p.deleted));
  sub("sections",d=>S.sections=d.map(x=>({id:x.id,...x.data()})).filter(x=>!x.deleted));
  claude.use("sample").then(x=>{S.sampleOk=!!x;render()});
  claude.use("assets").then(a=>{S.assets=a||null}); // Belongings photos; non-null only for people who can edit
  sub("prompts",d=>S.prompts=promptsById(d.map(x=>({id:x.id,...x.data()}))));
  sub("calendar",d=>S.cal=d.find(x=>x.id==="upcoming")?.data()||null);
  sub("gtasks",d=>S.gtasks=d.find(x=>x.id==="current")?.data()||null);
  sub("watch",d=>S.watch=d.map(x=>({id:x.id,...x.data()})).filter(w=>!w.deleted),db.collection("watch").orderBy("date","desc").limit(30));
  sub("reports",d=>S.reports=d.map(x=>({id:x.id,...x.data()})),db.collection("reports").orderBy("date","desc").limit(400));
  sub("editions",d=>S.editions=d.map(x=>({id:x.id,data:x.data()})),db.collection("editions").orderBy("date","desc").limit(60));
  sub("days",d=>{S.days=d.map(x=>({id:x.id,data:x.data()}));S.loaded=true},db.collection("days").orderBy("date","desc").limit(30));
  sub("lifeos",d=>S.lifeos=d.map(x=>({id:x.id,...x.data()})));
  sub("lifemap",d=>S.lifemap=d.map(x=>({id:x.id,...x.data()})));
  sub("followups",d=>S.fuDocs=d.map(x=>({id:x.id,...x.data()})));
  db.collection("dues").onSnapshot(s=>{S.dues=duesById(s.docs.filter(d=>d.exists).map(d=>d.data()));render()},()=>{});
})();
</script>
