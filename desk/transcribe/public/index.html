<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcribe</title>
<style>
  :root {
    --bg: #0a0a0b; --panel: #141417; --line: #26262b; --text: #ededee; --muted: #9a9aa2;
    --accent: #e4b768; --danger: #e5675f; --ok: #6cc08b; --spk1: #7fa8f0; --spk2: #c39af0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 -apple-system, "Hiragino Sans", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 16px 12px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
  aside h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 4px 8px; }
  .new { width: 100%; margin-bottom: 18px; }
  .item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; margin-bottom: 2px; }
  .item:hover { background: var(--panel); }
  .item.active { background: var(--panel); outline: 1px solid var(--line); }
  .item b { display: block; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .item small { color: var(--muted); font-size: 12px; }
  main { padding: 32px; min-width: 0; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .notice { border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  .notice.soft { border-color: var(--line); color: var(--muted); }
  .recorder { text-align: center; padding: 28px 16px; }
  .timer { font-size: 56px; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.2; }
  .rec { width: 84px; height: 84px; border-radius: 50%; background: var(--danger); border: 0; color: #fff; font-weight: 600; margin: 18px 0; }
  .rec.on { background: var(--panel); color: var(--danger); border: 2px solid var(--danger); }
  .meter { height: 6px; max-width: 320px; margin: 0 auto 10px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 12px 0; }
  .hint { color: var(--muted); font-size: 13px; }
  .drop { border: 1px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); margin-top: 24px; cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .title { width: 100%; background: none; border: 0; border-bottom: 1px solid transparent; font-size: 22px; font-weight: 600; padding: 2px 0; }
  .title:focus { outline: 0; border-color: var(--line); }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; align-items: center; }
  .toolbar .spacer { flex: 1; }
  .danger { color: var(--danger); }
  audio { width: 100%; height: 36px; margin: 6px 0 14px; }
  .segment { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 5px 0; border-bottom: 1px solid #1b1b1e; }
  .segment time { color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; padding-top: 3px; background: none; border: 0; text-align: left; }
  .segment div { outline: 0; border-radius: 4px; }
  .segment div:focus { background: var(--panel); }
  .modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; max-width: 100%; }
  .modes button { border: 0; border-radius: 0; background: none; padding: 6px 12px; white-space: nowrap; }
  #modeHint { margin-bottom: 8px; }
  .voicebar { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .voicebar .modes { margin-bottom: 8px; }
  .voicebar .hint { margin-bottom: 8px; }
  .modes button + button { border-left: 1px solid var(--line); }
  .modes button[aria-pressed="true"] { background: var(--panel); color: var(--accent); }
  .modes button:disabled { opacity: .45; }
  .meters { display: grid; grid-template-columns: 48px 1fr; gap: 4px 8px; align-items: center; max-width: 320px; margin: 0 auto 10px; font-size: 12px; color: var(--muted); text-align: left; }
  .meters .meter { margin: 0; max-width: none; }
  .meter.them i { background: var(--spk2); }
  .meter.me i { background: var(--spk1); }
  .who { background: none; border: 0; padding: 0 8px 0 0; font-size: 13px; font-weight: 700; cursor: pointer; }
  .who.s1 { color: var(--spk1); }
  .who.s2 { color: var(--spk2); }
  .who:hover { text-decoration: underline; }
  .line { display: flex; align-items: baseline; flex-wrap: wrap; min-width: 0; }
  .line div { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
  .menu { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: grid; min-width: 180px; }
  .menu button { border: 0; text-align: left; background: none; padding: 6px 10px; }
  .menu button:hover { background: var(--line); }
  .search { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 16px; }
  .adds { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .form { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; display: grid; gap: 8px; }
  .form input, .form textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .form textarea { min-height: 200px; resize: vertical; }
  .form .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .form .row input[type=date] { width: auto; }
  .minutes { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; }
  .minutes h3 { font-size: 13px; color: var(--muted); font-weight: 700; margin: 16px 0 4px; }
  .minutes h3:first-of-type { margin-top: 8px; }
  .minutes ul { margin: 0; padding-left: 20px; }
  .minutes li { padding: 2px 0; }
  .minutes [contenteditable]:focus { outline: 0; background: var(--panel); border-radius: 4px; }
  .minutes .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .minutes .head b { font-size: 16px; flex: 1; }
  .act { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .act span[data-f="what"] { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
  .act small { color: var(--muted); }
  .act button { font-size: 12px; padding: 2px 8px; }
  .act .done { color: var(--ok); font-size: 12px; }
  details.orig { margin: 16px 0; }
  details.orig summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.orig pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 8px 0 0; }
  .sub input[type=date] { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 13px; padding: 0 4px; }
  .failed { border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 20px 16px; }
    .timer { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <button class="new" id="newBtn">+ New recording</button>
    <input class="search" id="search" type="search" placeholder="Search titles, text and minutes" aria-label="Search">
    <h2>Meetings</h2>
    <div id="list"></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>

<script>
const LANG = { ja: 'Japanese', auto: 'Detect language', en: 'English', vi: 'Vietnamese', zh: 'Chinese', ko: 'Korean' };
const STATUS = {
  recording: 'Recording', interrupted: 'Stopped early', uploading: 'Importing', queued: 'Waiting',
  converting: 'Converting', transcribing: 'Transcribing', splitting: 'Telling voices apart', done: 'Done', partial: 'Partly done', error: "Didn't finish",
};
const ACTIVE = ['queued', 'converting', 'transcribing', 'splitting'];
const MODES = { mic: 'Mic only', meeting: 'Meeting', inperson: 'In person' };
const SPK_CLASS = { me: 's1', A: 's1', them: 's2', B: 's2' };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 覚えられなくても動く */ } },
};
const MODE_HINT = {
  mic: 'One voice track, as before',
  meeting: 'Your mic is “Me”. What Zoom or Meet plays on this Mac is “Them”.',
  inperson: 'Two people, one mic. After the text is ready, voices are split into A and B.',
};
const VOICES = { mac: 'This Mac', room: 'The room' };
const VOICE_HINT = {
  mac: 'Zoom or Meet on this Mac. Your mic is “Me”; what the call plays here is “Them”, even in earphones.',
  room: 'Phone on speaker, or face to face. Only the mic records; voices are split into Me and Them afterwards.',
};
let voice = VOICES[store.get('tr-voice')] ? store.get('tr-voice') : 'mac';
let mode = MODES[store.get('tr-mode')] ? store.get('tr-mode') : 'mic';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clock = (sec) => {
  sec = Math.floor(sec || 0);
  return [Math.floor(sec / 3600), Math.floor(sec / 60) % 60, sec % 60].map((n) => String(n).padStart(2, '0')).join(':');
};
const api = async (path, options = {}) => {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Connection problem (${res.status})`);
  return data;
};
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

let selected = null;      // 開いている記録のID。nullなら録音画面
let renderedKey = '';     // 文字部分を不要に描き直さないための印
let status = { engine_ready: true, free_bytes: Infinity };
let sessions = [];
let query = '';           // 一覧の検索語

/* ---------- 録音 ---------- */
const rec = {
  active: false, starting: false, sid: null, sent: 0, captured: 0, queue: [], sending: false, finishing: false,
  stream: null, ctx: null, node: null, wakeLock: null, peak: 0, quietSince: 0, netError: false, warning: '', pending: [],
  mode: 'mic', voice: 'mac', clockSent: false, tap: null, tapTimer: null, themQuietSince: 0,
};

// 会議のとき、Mac の音を録るアプリの様子を1秒ごとに見る
async function pollTap() {
  if (!rec.active || rec.mode !== 'meeting') return;
  try {
    rec.tap = await api(`/api/sessions/${rec.sid}/tap`);
    if (rec.tap.level > 0.003) rec.themQuietSince = Date.now();
  } catch (e) { /* 次の回に */ }
  renderMeter();
  rec.tapTimer = setTimeout(pollTap, 1000);
}

// 「相手の声」を変える。録音前は次の録音に、録音中はこの時刻から効く
async function switchVoice(next) {
  voice = next;
  store.set('tr-voice', next);
  if (rec.active && rec.mode === 'meeting' && rec.voice !== next) {
    rec.voice = next;
    renderRecorder();
    try {
      await post(`/api/sessions/${rec.sid}/voice`, { voice: next });
      rec.tap = null;
      rec.themQuietSince = Date.now();
    } catch (e) { rec.warning = `Couldn't switch: ${e.message}`; }
  }
  renderRecorder();
}

function tapNote() {
  if (rec.voice !== 'mac') return '';
  const t = rec.tap;
  if (!t || t.state === 'starting') return 'Starting meeting audio…';
  if (t.state === 'error' && t.error === 'permission') return 'To record the other side, allow “Tatsuki Audio Tap” in System Settings › Privacy & Security › Screen & System Audio Recording. Then stop and record again. Your microphone is still recording.';
  if (t.state === 'error' && t.error === 'missing') return 'Meeting audio needs a one-time setup: run desk/transcribe/setup.sh. Your microphone is still recording.';
  if (t.state === 'error') return `Meeting audio stopped: ${t.error}. Your microphone is still recording.`;
  if (t.state === 'lost') return 'Meeting audio stopped. Starting it again…';
  if (Date.now() - rec.themQuietSince > 30000) return 'No meeting audio yet. Is Zoom or Meet open on this Mac?';
  return '';
}

async function startRecording() {
  if (rec.active || rec.starting) return;
  rec.starting = true;
  rec.warning = '';
  renderRecorder();
  try {
    const deviceId = $('mic') && $('mic').value;
    rec.stream = await navigator.mediaDevices.getUserMedia({
      audio: { deviceId: deviceId ? { exact: deviceId } : undefined, channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: true },
    });
    loadMics();
    await buildAudioGraph();
    const language = $('language').value;
    const meta = await post('/api/sessions', { language, mode, voice });
    Object.assign(rec, { active: true, sid: meta.id, sent: 0, captured: 0, queue: [], pending: [], finishing: false, netError: false,
      quietSince: Date.now(), mode, voice, clockSent: false, tap: null, themQuietSince: Date.now() });
    if (mode === 'meeting') pollTap();
    rec.stream.getTracks().forEach((t) => {
      t.onended = () => { rec.warning = 'The microphone was disconnected. Everything up to now is saved. Check the connection, then press Stop.'; renderRecorder(); };
      t.onmute = () => { rec.warning = 'No sound is coming from the microphone.'; renderRecorder(); };
      t.onunmute = () => { rec.warning = ''; renderRecorder(); };
    });
    rec.node.port.onmessage = onAudio;
    try { rec.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* なくても録音は続く */ }
    renderRecorder();
    refreshList();
  } catch (e) {
    cleanupAudio();
    rec.warning = e.name === 'NotAllowedError'
      ? 'The microphone is blocked. Allow it in the address bar and in System Settings › Privacy & Security › Microphone.'
      : `Could not start recording: ${e.message}`;
  } finally {
    rec.starting = false;
    renderRecorder();
  }
}

async function buildAudioGraph() {
  const build = async (options) => {
    const ctx = new AudioContext(options);
    await ctx.audioWorklet.addModule('/worklet.js');
    const source = ctx.createMediaStreamSource(rec.stream);
    const node = new AudioWorkletNode(ctx, 'pcm-capture', { numberOfOutputs: 0 });
    source.connect(node);
    return { ctx, node };
  };
  let graph;
  try { graph = await build({ sampleRate: 16000 }); } catch (e) { graph = await build({}); }
  rec.ctx = graph.ctx;
  rec.node = graph.node;
  rec.ctx.onstatechange = () => { if (rec.active && rec.ctx && rec.ctx.state === 'suspended') rec.ctx.resume().catch(() => {}); };
  if (rec.ctx.state === 'suspended') await rec.ctx.resume();
}

// マイクの音声が1秒届くたびに動く。タイマーと違い、裏のタブでも間引かれない。
function onAudio(event) {
  const { pcm, peak } = event.data;
  if (!rec.clockSent && rec.sid) {  // この音の最初のサンプルの時刻。Them とのずれを合わせる
    rec.clockSent = true;
    post(`/api/sessions/${rec.sid}/clock`, { mic_start: Date.now() / 1000 - pcm.byteLength / 32000 }).catch(() => { rec.clockSent = false; });
  }
  rec.pending.push(new Uint8Array(pcm));
  rec.captured += pcm.byteLength;
  rec.peak = peak;
  if (peak > 0.003) rec.quietSince = Date.now();
  if (rec.pending.length >= 2 || rec.finishing) flushPending();
  renderMeter();
}

function flushPending() {
  if (!rec.pending.length) return;
  rec.queue.push(new Blob(rec.pending));
  rec.pending = [];
  sendQueue();
}

// 送信は順番に1つずつ。失敗しても音声はメモリに残し、届くまで再送する。
async function sendQueue() {
  if (rec.sending) return;
  rec.sending = true;
  while (rec.queue.length) {
    const blob = rec.queue[0];
    try {
      const res = await fetch(`/api/sessions/${rec.sid}/chunk?offset=${rec.sent}`, { method: 'POST', body: blob });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { size } = await res.json();
      if (size === rec.sent + blob.size) {
        rec.sent = size;
        rec.queue.shift();
        rec.netError = false;
      } else if (size < rec.sent) {
        rec.warning = 'Part of the recording is missing on this Mac. Stop the recording and check it.';
        rec.netError = true;
        await new Promise((r) => setTimeout(r, 2000));
      } else {
        rec.sent = size - blob.size;
      }
    } catch (e) {
      rec.netError = true;
      renderMeter();
      await new Promise((r) => setTimeout(r, 2000));
    }
  }
  rec.sending = false;
  renderMeter();
}

function cleanupAudio() {
  if (rec.stream) rec.stream.getTracks().forEach((t) => { t.onended = t.onmute = t.onunmute = null; t.stop(); });
  if (rec.ctx) rec.ctx.close().catch(() => {});
  if (rec.wakeLock) rec.wakeLock.release().catch(() => {});
  rec.stream = rec.ctx = rec.node = rec.wakeLock = null;
}

async function stopRecording() {
  if (!rec.active || rec.finishing) return;
  rec.finishing = true;
  renderRecorder();
  await new Promise((resolve) => {
    const onLast = (event) => { if (event.data.last) resolve(); };
    rec.node.port.addEventListener('message', onLast);
    rec.node.port.postMessage('flush');
    setTimeout(resolve, 1000);
  });
  cleanupAudio();
  clearTimeout(rec.tapTimer);
  flushPending();
  while (rec.queue.length || rec.sending) await new Promise((r) => setTimeout(r, 200));
  const sid = rec.sid;
  for (;;) {
    try { await post(`/api/sessions/${sid}/finish`); break; } catch (e) { await new Promise((r) => setTimeout(r, 2000)); }
  }
  rec.active = false;
  rec.finishing = false;
  rec.warning = '';
  selected = sid;
  renderedKey = '';
  await refreshList();
  renderMain();
}

window.addEventListener('beforeunload', (e) => {
  if (rec.active) { e.preventDefault(); e.returnValue = ''; }
});

function renderMeter() {
  if (!$('timer')) return;
  $('timer').textContent = clock(rec.captured / 32000);
  $('level').style.width = `${Math.min(100, Math.sqrt(rec.peak) * 100)}%`;
  if ($('themLevel')) $('themLevel').style.width = `${Math.min(100, Math.sqrt((rec.tap && rec.tap.level) || 0) * 100)}%`;
  const unsent = Math.round((rec.captured - rec.sent) / 32000);
  let note = `Saved ${clock(rec.sent / 32000)}`;
  if (rec.netError) note = `Can't reach the recorder. Still trying (${unsent} sec not saved yet). Keep this page open.`;
  else if (rec.warning) note = rec.warning;
  else if (Date.now() - rec.quietSince > 30000) note = 'No sound for over 30 seconds. Check the microphone.';
  else if (rec.mode === 'meeting' && tapNote()) note = tapNote();
  $('recNote').textContent = note;
}

function renderRecorder() {
  if (selected !== null || !$('recBtn')) return;
  const b = $('recBtn');
  b.className = 'rec' + (rec.active ? ' on' : '');
  b.textContent = rec.finishing ? 'Saving' : rec.active ? 'Stop' : 'Record';
  b.disabled = rec.starting || rec.finishing;
  $('language').disabled = $('mic').disabled = rec.active;
  document.querySelectorAll('.modes button[data-mode]').forEach((el) => { el.disabled = rec.active; el.setAttribute('aria-pressed', String(el.dataset.mode === (rec.active ? rec.mode : mode))); });
  const meeting = (rec.active ? rec.mode : mode) === 'meeting';
  const v = rec.active ? rec.voice : voice;
  $('voiceBar').style.display = meeting ? 'flex' : 'none';
  document.querySelectorAll('#voices button').forEach((el) => { el.disabled = rec.finishing; el.setAttribute('aria-pressed', String(el.dataset.voice === v)); });
  $('themRow').style.display = meeting && v === 'mac' ? 'contents' : 'none';
  $('modeHint').textContent = meeting ? VOICE_HINT[v] + (rec.active ? ' Let everyone know you\'re recording.' : '') : MODE_HINT[mode];
  $('recWarn').textContent = !rec.active && rec.warning ? rec.warning : '';
  $('recWarn').style.display = !rec.active && rec.warning ? 'block' : 'none';
  $('recTips').style.display = rec.active ? 'block' : 'none';
  $('drop').style.display = rec.active ? 'none' : 'block';
  if (!rec.active) { $('timer').textContent = '00:00:00'; $('level').style.width = 0; $('recNote').textContent = 'Saved every few seconds while recording'; }
  else renderMeter();
}

async function loadMics() {
  if (!$('mic')) return;
  const devices = await navigator.mediaDevices.enumerateDevices().catch(() => []);
  const mics = devices.filter((d) => d.kind === 'audioinput' && d.deviceId !== 'communications');
  const current = $('mic').value;
  $('mic').innerHTML = '<option value="">Default microphone</option>' +
    mics.filter((d) => d.deviceId && d.deviceId !== 'default' && d.label).map((d) => `<option value="${esc(d.deviceId)}">${esc(d.label)}</option>`).join('');
  $('mic').value = current;
}

/* ---------- 画面 ---------- */
function renderHome() {
  $('view').innerHTML = `
    ${status.engine_ready ? '' : '<div class="notice">The speech engine isn\'t installed yet. Run setup.sh once. You can still record.</div>'}
    ${status.free_bytes < 2e9 ? '<div class="notice">Less than 2 GB of disk space is left. An hour of recording uses about 60 MB.</div>' : ''}
    <div class="notice" id="recWarn" style="display:none"></div>
    <div class="recorder">
      <div class="modes" role="group" aria-label="What are you recording?">${Object.entries(MODES).map(([k, v]) => `<button data-mode="${k}" aria-pressed="${k === mode}">${v}</button>`).join('')}</div>
      <div class="voicebar" id="voiceBar"><span class="hint">Their voice</span><div class="modes" id="voices" role="group" aria-label="Where does their voice come from?">${Object.entries(VOICES).map(([k, v]) => `<button data-voice="${k}" aria-pressed="${k === voice}">${v}</button>`).join('')}</div></div>
      <div class="hint" id="modeHint"></div>

    </div>

    <input type="file" id="file" accept="audio/*,.m4a,.mp3,.wav,.aiff,.aac,.caf,.docx,.doc,.rtf,.odt,.pdf,.txt,.md" multiple hidden>
    <div class="adds"><button id="pasteBtn">Paste text</button><button id="linkBtn">Google Docs link</button></div>
    <div id="addForm"></div>`;
  $('recBtn').onclick = () => (rec.active ? stopRecording() : startRecording());
  document.querySelectorAll('.modes button[data-mode]').forEach((el) => {
    el.onclick = () => { mode = el.dataset.mode; store.set('tr-mode', mode); renderHome(); };
  });
  document.querySelectorAll('#voices button').forEach((el) => {
    el.onclick = () => switchVoice(el.dataset.voice);
  });
  const drop = $('drop');
  drop.onclick = () => $('file').click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) uploadAll([...e.dataTransfer.files]); };
  $('file').onchange = (e) => { if (e.target.files.length) uploadAll([...e.target.files]); };
  $('pasteBtn').onclick = showPaste;
  $('linkBtn').onclick = showLink;
  loadMics();
  renderRecorder();
}

// 1つずつ順に送る。音声は文字起こしへ、文書は文字を取り出して文の記録に。1件だけなら開く
async function uploadAll(files) {
  const drop = $('drop');
  const errors = [];
  let last = null;
  for (const [i, file] of files.entries()) {
    try {
      last = await uploadOne(file, (pct) => { if ($('drop')) drop.textContent = `Importing ${i + 1} of ${files.length}… ${pct}%`; });
    } catch (e) { errors.push(e.message); }
  }
  await refreshList();
  if (errors.length) {
    if ($('drop')) drop.innerHTML = errors.map(esc).join('<br>');
    return;
  }
  if (files.length === 1 && last) { selected = last.id; renderedKey = ''; renderMain(); return; }
  if ($('drop')) drop.textContent = `Added ${files.length}. They're in the list.`;
}

function uploadOne(file, onProgress) {
  return new Promise((resolve, reject) => {
    const language = $('language') ? $('language').value : 'ja';
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/api/upload?name=${encodeURIComponent(file.name)}&language=${language}&mode=${mode === 'inperson' ? 'inperson' : 'mic'}`);
    xhr.upload.onprogress = (e) => onProgress(Math.round(e.loaded / e.total * 100));
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch (e) { /* 下で扱う */ }
      if (xhr.status === 200) resolve(data);
      else reject(new Error(data.error || `${file.name}: the import didn't finish`));
    };
    xhr.onerror = () => reject(new Error(`${file.name}: the import didn't finish`));
    xhr.send(file);
  });
}

function estimateLeft(m) {
  const fresh = m.done_chunks - (m.resumed_chunks || 0);
  if (m.status !== 'transcribing' || fresh < 1 || !m.started_at) return '';
  const perChunk = (Date.now() / 1000 - m.started_at) / fresh;
  const left = Math.round(perChunk * (m.total_chunks - m.done_chunks) / 60);
  return left < 1 ? '· almost done' : `· about ${left} min left`;
}

async function renderDetail() {

/* ---------- 議事録 ---------- */
const MIN_SECTIONS = [['summary', 'Summary'], ['decisions', 'Decisions'], ['actions', 'Actions'], ['next', 'Next']];

function minutesHtml(m, ready) {
  const mm = m.minutes;
  const busy = m.minutes_state === 'running';
  const head = `<div class="head"><b>Minutes</b>
    ${mm && !busy ? '<button id="minCopy">Copy minutes</button>' : ''}
    ${ready && !busy ? `<button id="minMake">${mm ? 'Make again' : 'Make minutes'}</button>` : ''}</div>`;
  let body;
  if (busy) body = '<div class="hint">Claude is writing the minutes. This takes about a minute; you can leave this page.</div>';
  else if (!mm) body = `<div class="hint">${ready ? 'Press “Make minutes” to get a summary, decisions and actions. Only then is the text sent to Claude (Sonnet 5.5, a few yen per meeting). Audio is never sent.' : 'Minutes can be made once the text is ready.'}</div>`;
  else {
    body = MIN_SECTIONS.map(([k, label]) => {
      const items = mm[k] || [];
      if (!items.length) return '';
      const lis = k === 'actions'
        ? items.map((a, i) => `<li><div class="act"><span contenteditable="plaintext-only" data-f="what" data-i="${i}">${esc(a.what)}</span>
            <small><span contenteditable="plaintext-only" data-f="who" data-i="${i}" aria-label="Who">${esc(a.who)}</span>${a.who && a.due ? ' · ' : ''}<span contenteditable="plaintext-only" data-f="due" data-i="${i}" aria-label="Due">${esc(a.due)}</span></small>
            ${a.taskId ? '<span class="done">In Tasks</span>' : `<button data-task="${i}">Make it a task</button>`}</div></li>`).join('')
        : items.map((t, i) => `<li contenteditable="plaintext-only" data-sec="${k}" data-i="${i}">${esc(t)}</li>`).join('');
      return `<h3>${label}</h3><ul>${lis}</ul>`;
    }).join('') || '<div class="hint">Nothing to note was found.</div>';
  }
  const err = m.minutes_state === 'error' ? `<div class="notice">${esc(m.minutes_error || 'The minutes could not be made')}</div>` : '';
  return `<section class="minutes" id="minutes">${head}${err}${body}</section>`;
}

function readMinutes(m) {
  const out = { summary: [], decisions: [], actions: [], next: [] };
  document.querySelectorAll('#minutes li[data-sec]').forEach((el) => { const t = el.textContent.trim(); if (t) out[el.dataset.sec].push(t); });
  (m.minutes.actions || []).forEach((a, i) => {
    const f = (n) => { const el = document.querySelector(`#minutes [data-f="${n}"][data-i="${i}"]`); return el ? el.textContent.trim() : ''; };
    if (f('what')) out.actions.push({ what: f('what'), who: f('who'), due: f('due'), taskId: a.taskId || '' });
  });
  return out;
}

function minutesText(m, mm) {
  const lines = [`${m.title} (${m.met})`, ''];
  MIN_SECTIONS.forEach(([k, label]) => {
    if (!(mm[k] || []).length) return;
    lines.push(label);
    mm[k].forEach((x) => {
      if (k !== 'actions') return lines.push(`- ${x}`);
      const extra = [x.who, x.due].filter(Boolean).join(', ');
      lines.push(`- ${x.what}${extra ? ` (${extra})` : ''}`);
    });
    lines.push('');
  });
  return lines.join('\n').trim();
}

function wireMinutes(m) {
  if ($('minMake')) $('minMake').onclick = async () => {
    if (m.minutes && !confirm('Make the minutes again? Your edits to the current minutes will be replaced.')) return;
    renderedKey = '';
    try { await post(`/api/sessions/${m.id}/minutes`); } catch (e) { alert(e.message); }
    renderDetail();
  };
  if (!m.minutes) return;
  const save = async () => {
    const next = readMinutes(m);
    await api(`/api/sessions/${m.id}/minutes`, { method: 'PUT', body: JSON.stringify({ minutes: next }) });
    m.minutes = { ...m.minutes, ...next };
  };
  document.querySelectorAll('#minutes [contenteditable]').forEach((el) => {
    el.dataset.saved = el.textContent;
    el.onblur = () => { if (el.textContent !== el.dataset.saved) { el.dataset.saved = el.textContent; save(); } };
  });
  document.querySelectorAll('#minutes [data-task]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        await post(`/api/sessions/${m.id}/minutes/task`, { index: Number(b.dataset.task) });
        b.outerHTML = '<span class="done">In Tasks</span>';
      } catch (e) { b.disabled = false; b.textContent = 'Try again'; b.title = e.message; }
    };
  });
  if ($('minCopy')) $('minCopy').onclick = async (e) => {
    const text = minutesText(m, readMinutes(m));
    try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied'; } catch (err) { e.target.textContent = 'Could not copy'; }
    setTimeout(() => { e.target.textContent = 'Copy minutes'; }, 1500);
  };
}

function closeMenu() { const m = $('spkMenu'); if (m) m.remove(); }
document.addEventListener('click', (e) => { if (!e.target.closest('#spkMenu')) closeMenu(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

function renderMain() {
  renderList();
  if (selected === null) {
    if (!$('recBtn')) renderHome();
    else renderRecorder();
  } else {
    renderDetail();
  }
}

async function refreshList() {
  try {
    [sessions, status] = await Promise.all([api(`/api/sessions${query ? `?q=${encodeURIComponent(query)}` : ''}`), api('/api/status')]);
    renderList();
  } catch (e) { /* サーバーが再起動中なら次の周期で回復する */ }
}

$('newBtn').onclick = () => { selected = null; renderedKey = ''; renderList(); renderHome(); };
let searchTimer = null;
$('search').oninput = (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { query = e.target.value.trim(); refreshList(); }, 250);
};
setInterval(async () => {
  await refreshList();
  if (selected !== null) renderDetail();
}, 3000);
selected = new URLSearchParams(location.search).get('id'); // Desk opens a recording with ?id=
refreshList().then(renderMain);
</script>
</body>
</html>
