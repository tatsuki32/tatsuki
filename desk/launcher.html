<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatsuki's Desk</title>
<!-- The way in from a browser. Normally use "Tatsuki's Desk.app". When the server is running, this goes on to localhost:4747. -->
<style>
  :root { --bg:#0d0d0d; --text:#ece8df; --muted:#9a958a; --gold:#d4af37; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; padding:40px 16px;
         background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { width:100%; max-width:40em; margin:0 auto; }
  h1 { margin:0 0 8px; font-size:20px; font-weight:700; }
  p { margin:0 0 24px; color:var(--muted); }
  code { color:var(--text); }
  button { padding:8px 16px; border:0; border-radius:8px; background:var(--gold); color:#111; font:700 14px inherit; cursor:pointer; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <p id="checking">Opening Desk…</p>
  <div id="down" hidden>
    <h1>The Desk server is not running</h1>
    <p>Opening "Tatsuki's Desk.app" starts it. If that does not help, run <code>bash ~/TatsukiDesk/desk/setup-mac.sh</code> in Terminal.</p>
    <button id="retry" type="button">Try again</button>
  </div>
</main>
<script>
  var LOCAL = "http://localhost:4747";
  function check() {
    document.getElementById("checking").hidden = false;
    document.getElementById("down").hidden = true;
    var done = false;
    var fail = function () {
      if (done) return; done = true;
      document.getElementById("checking").hidden = true;
      document.getElementById("down").hidden = false;
    };
    setTimeout(fail, 2500);
    // no-cors: the reply cannot be read, but it succeeds when the server runs and fails when it is down
    fetch(LOCAL + "/health", { mode: "no-cors", cache: "no-store" })
      .then(function () { if (done) return; done = true; location.replace(LOCAL); })
      .catch(fail);
  }
  document.getElementById("retry").onclick = check;
  check();
</script>
</body>
</html>
