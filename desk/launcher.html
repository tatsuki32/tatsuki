<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatsuki's Desk</title>
<!-- ダブルクリックで Desk を開くランチャー。Mac のサーバー（localhost:4747）が動いていればそちらへ、
     止まっていればオンライン版を選べる。setup-mac.sh がデスクトップにコピーを置く。 -->
<style>
  :root { --bg:#0b0b0c; --panel:#151517; --line:#2a2a2e; --text:#ece8df; --muted:#9a958a; --gold:#d4af37; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .card { width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 22px; text-align:center; }
  h1 { margin:0 0 6px; font-size:20px; color:var(--gold); letter-spacing:.04em; }
  p { margin:8px 0; color:var(--muted); font-size:14px; line-height:1.7; }
  .btns { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  a.btn, button.btn { display:block; padding:12px; border-radius:10px; border:1px solid var(--gold); background:transparent;
         color:var(--gold); font-size:15px; text-decoration:none; cursor:pointer; font-family:inherit; }
  a.btn.primary { background:var(--gold); color:#111; }
  code { color:var(--text); background:#000; padding:1px 6px; border-radius:4px; font-size:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>Tatsuki's Desk</h1>
  <p id="checking">Mac 版を開いています…</p>
  <div id="down" hidden>
    <p>Mac 版のサーバー（localhost:4747）が動いていません。</p>
    <p><code>desk/Start Desk.command</code> をダブルクリックするか、<br><code>bash desk/setup-mac.sh</code> で常駐させてください。</p>
    <div class="btns">
      <button class="btn" id="retry" type="button">もう一度試す</button>
      <a class="btn primary" href="https://claude.ai/artifact/EkyjR8X6XJdundGEXE9XgP">オンライン版を開く</a>
      <a class="btn" href="http://localhost:4747">それでも Mac 版を開く</a>
    </div>
  </div>
</div>
<script>
  var LOCAL = "http://localhost:4747";
  function check() {
    document.getElementById("checking").hidden = false;
    document.getElementById("down").hidden = true;
    var done = false;
    var fail = function () {
      if (done) return; done = true;
      document.getElementById("checking").hidden = true;
      document.getElementById("down").hidden = false;
    };
    setTimeout(fail, 2500);
    // no-cors: 応答の中身は読めないが、サーバーが動いていれば成功、止まっていれば失敗になる
    fetch(LOCAL + "/health", { mode: "no-cors", cache: "no-store" })
      .then(function () { if (done) return; done = true; location.replace(LOCAL); })
      .catch(fail);
  }
  document.getElementById("retry").onclick = check;
  check();
</script>
</body>
</html>
