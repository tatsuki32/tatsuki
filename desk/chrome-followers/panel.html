<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desk Followers</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <select id="account" aria-label="Account"></select>
  <p class="sub" id="count"></p>
  <div class="bar" role="progressbar" aria-label="Today" aria-valuemin="0"><i id="fill"></i></div>
  <input type="search" id="find" placeholder="Find an ID" aria-label="Find an ID" autocapitalize="none" spellcheck="false">
  <p class="sub" id="now" role="status"></p>
</header>
<main id="main" aria-live="polite"></main>
<footer>
  <label>List <select id="list"><option value="notback">Does not follow back</option><option value="left">Stopped following you, 30 days</option><option value="new">You followed, 30 days, not back</option></select></label>
  <label>Work behind, without showing the page <input type="checkbox" id="behind"></label>
  <label>Per hour <select id="perHour"><option>5</option><option>10</option><option>15</option><option>20</option></select></label>
  <label>Per day <select id="perDay"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option><option>40</option><option>50</option><option>100</option></select></label>
  <label id="overRow">Followed <select id="over"><option value="365">over a year ago</option><option value="90">over 90 days ago</option><option value="0">any time</option></select></label>
  <p class="sub">Press as many as you like; they are done one after another while this panel is open. If Instagram asks to slow down, it stops for a day.</p>
</footer>
<script src="press.js"></script>
<script src="panel.js"></script>
</body>
</html>
